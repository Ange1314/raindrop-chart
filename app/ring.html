  /* ================= 当前打开这一层的实时刷新 =================

     轮询 /api/shelves 只更新到「工作区」这一层 —— 它的孩子是懒加载的，
     点开那一刻拉一次，之后再也不动。所以：
       · 根层：珠子圆得好好的，一进空间就死
       · 会话层：更死，连「最新那个回合」都没装进来

     这里补上，代价是一轮最多一个请求：
       · 工作区层 → /api/ws，2KB
       · 会话层   → 只有它真的多了东西才补，而且只拉尾部 24 个回合、3 秒最多一次
     不重拉整份会话明细（实测那份 544KB），也不做全树重扫。 */

  var SESSION_TAIL = 24;     /* 每次补多少条尾部回合 */
  var TURN_CAP     = 420;    /* 环形里最多装多少条回合 —— 再多布局就啃不动了 */
  var TURN_EVERY   = 3000;   /* 同一个会话最快多久补一次 */
  var sessPullAt = 0, sessPullSid = '';

  /* 只跑一次 —— fetch 超时兜底和正常回来会同时到，不能重复收尾 */
  function once(fn){
    var done = false;
    return function(){ if (done) return; done = true; fn(); };
  }

  /* 会话列表就地合并：同一个 sid 复用原对象，只改会变的数字。
     顺序必须保持原样 —— 地址是按行号算的，一旦重排（比如按时新排到最前），
     后面所有圆的地址全变，会集体「重新出生」闪一下。
     真的新出现的会话追加在末尾 —— 它确实是新的，出生动画就是它该有的反馈。 */
  function mergeSessionList(ws, fresh){
    var old = ws.children || [];
    if (!old.length || !fresh.length) return;
    var by = {}, i, o, added = 0;
    for (i = 0; i < old.length; i++) if (old[i].sid) by[old[i].sid] = old[i];
    for (i = 0; i < fresh.length; i++){
      o = fresh[i].sid ? by[fresh[i].sid] : null;
      if (!o){ old.push(fresh[i]); added++; continue; }
      o.at = fresh[i].at || 0;
      o.steps = fresh[i].steps || 0;
      o.turns = fresh[i].turns || 0;
      if (fresh[i].files) o.files = fresh[i].files;
    }
    if (added) stampKids(ws);
  }

  /* 会话开着的时候，只补**新到**的东西：拉尾部一小段，逐条比。
     · 新回合 → 接到末尾
     · 老回合多了步骤 → 换掉它的孩子（最后一步往往就加在最后一轮里，
       不认这条的话，下钻到「步」这一级永远看不到更新）
     不重拉整份明细 —— 那是五百多 KB，每 1.5 秒一次纯属浪费。 */
  function pullTurns(node, done){
    var kids = node.children || [];
    if (kids.length >= TURN_CAP){ done(); return; }
    var now = Date.now();
    if (node.sid === sessPullSid && now - sessPullAt < TURN_EVERY){ done(); return; }
    sessPullSid = node.sid; sessPullAt = now;
    fetch('/api/session?id=' + encodeURIComponent(node.sid) +
          '&limit=' + SESSION_TAIL + '&tail=1', { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var got = (d && d.tree && d.tree.children) || [];
        var by = {}, lastAt = 0, i, o;
        for (i = 0; i < kids.length; i++){
          if (kids[i].at) by[kids[i].at] = kids[i];
          if ((kids[i].at || 0) > lastAt) lastAt = kids[i].at || 0;
        }
        var add = [], touched = 0;
        for (i = 0; i < got.length; i++){
          o = got[i].at ? by[got[i].at] : null;
          if (o){
            var oc = o.children || [], gc = got[i].children || [];
            if (gc.length !== oc.length){
              o.children = gc;
              delete o.w;            /* 回合的权重按步数算，孩子变了必须重算 */
              touched++;
            }
            continue;
          }
          add.push(got[i]);
        }
        if (add.length || touched){
          add.sort(function(a, b){ return (a.at || 0) - (b.at || 0); });
          for (i = 0; i < add.length && kids.length < TURN_CAP; i++) kids.push(add[i]);
          stampKids(node);           /* 新回合、新步骤都要立刻有地址 */
        }
        done();
      })
      .catch(function(){ done(); });
  }

  function refreshOpenLevel(done){
    done = done || function(){};
    var ws = null, i;
    /* 找当前这一层属于哪个工作区。会话/回合/步骤珠自己没有 wid，往上借。 */
    for (i = path.length - 1; i >= 0; i--)
      if (path[i] && path[i].kind === 'workspace' && path[i].wid){ ws = path[i]; break; }
    /* 根层不用管：/api/shelves 每次回来就是新的 */
    if (!ws || !(ws.children && ws.children.length)){ done(); return; }

    /* 请求卡住也不能把这一轮的收尾卡死：1.5 秒到点就按现有数据收尾 */
    var tail = once(done);
    setTimeout(tail, 1500);

    fetch('/api/ws?wid=' + encodeURIComponent(ws.wid), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var f = path[path.length - 1];
        var isSess = !!(f && f.sid && f.kind === 'session');
        var beforeAt = isSess ? (f.at || 0) : 0;
        var beforeSteps = isSess ? (f.steps || 0) : 0;
        mergeSessionList(ws, (d && d.children) || []);
        /* 打开的是会话：它自己多了东西，才去补尾部回合 */
        if (isSess && ((f.at || 0) !== beforeAt || (f.steps || 0) !== beforeSteps))
          pullTurns(f, tail);
        else tail();
      })
      .catch(function(){ tail(); });
  }

  function applyLive(d){
    var m = d.meta || {};
    if (d.stepUnit) STEP_UNIT = d.stepUnit;

    /* 按 name 保住当前下钻位置；保不住就退回根 */
    var oldPath = path.slice();
    var names = [];
    for (var i = 1; i < oldPath.length; i++) names.push(oldPath[i].name);
    /* 从浏览器历史退回来时，目标路径在历史里，不在当前 path 里 */
    if (navPending){ names = navPending.slice(1); navPending = null; }
    var keepGroups = openGroups;

    root = d.tree;
    clearFresh(root);
    /* 盖地址：树图那边用的是同一套段规则，两边对得上号。
       前缀取「这份数据自己的源」，不是当前的 SOURCE ——
       快速切库时两轮请求会错开到达，拿 SOURCE 盖章会把别人家的地址盖到自己头上。 */
    stampAddr(root, (d.source !== undefined ? d.source : SOURCE) || '');

    path = [root];
    for (var n = 0; n < names.length; n++){
      var hit = null, kids = path[path.length - 1].children || [];
      for (var j = 0; j < kids.length; j++) if (kids[j].name === names[n]){ hit = kids[j]; break; }
      if (!hit) break;
      /* 工作区的会话是点开才拉进 children 的，新树里都是空的。
         不补回来，每 1.5 秒轮询一次就会把用户正在看的会话层冲掉。 */
      var prev = oldPath[n + 1];
      if (prev && prev.children && prev.children.length
          && (!hit.children || !hit.children.length)){
        hit.children = prev.children;
        hit.lazyWs = false;
      }
      path.push(hit);
    }

    /* 顺序很重要：**先刷新当前打开这一层，再判定「新到」**。
       反过来的话，工作区那颗的 at 已经把这轮的新时间戳吃掉了，
       深一层补上来的东西永远不可能「比上次更晚」，波纹就永远不冒。 */
    var wasReady = liveReady;
    liveReady = true;
    needsBuild = true;
    pulseAt = Date.now();          /* 记账：这一轮是数据刷新，允许变化的圆冒涟漪 */

    var __gen = ++liveGen;
    refreshOpenLevel(function(){
      if (__gen !== liveGen) return;    /* 已经有更新的一轮在跑，这次作废 */
      commitFresh(root, keepGroups, wasReady);
    });

    /* #into=N —— 直接下钻到第 N 个回合，可分享“某个回合”的视图
       #into=1.2 —— 点分路径，逐层下钻（第 1 个孩子的第 2 个孩子）。
       两级写法是后加的：截图和「分享到某一层」都需要一次落到底，
       只支持一级就得点两下鼠标，链接也就没法整段复制。 */
    if (!intoDone){
      var mm = /[#&]into=(\d+(?:\.\d+)*)/.exec(location.hash);
      if (mm){
        var segs = mm[1].split('.'), p = [root], walked = true;
        for (var si = 0; si < segs.length; si++){
          var nx = ((p[p.length - 1] || {}).children || [])[+segs[si]];
          if (!nx){ walked = false; break; }
          p.push(nx);
        }
        if (walked && p.length > 1){
          path = p;
          expanded = true;
          intoDone = true;
        }
      }
    }

    drawCrumb();

    /* 从树图切过来时带着一个目标地址：新树已经就位，现在真正落下去。
       放在按名字恢复之后 —— 名字只是「别丢层」，地址才是「就要这一层」。 */
    if (pendAddr){ var pa = pendAddr; pendAddr = ''; applyAddr(pa); }

    /* 每次拉取的记账，用于验证增量；#probe 时挂到 title 上。
       这里的数字取「上一轮收尾时」的结果 —— 收尾是异步的，不能在这里等。 */
    if (!window.__log) window.__log = [];
    window.__log.push({ calls: lastCalls, fresh: lastFresh, at: lastSeenAt });
    if (/[#&]probe/.test(location.search + location.hash)){
      document.title = 'LOG ' + JSON.stringify(window.__log);
    }

    if (/[#&]dump/.test(location.search + location.hash)){
      setTimeout(function(){
        /* 延时放宽到 2.5s：300ms 时首帧可能还没重建完，抓到的是一棵旧树 */
        var f = focusNode();
        document.title = JSON.stringify({
          W: W, H: H, R: Math.min(W,H)*P.ring,
          focus: f && f.name, kids: f && (f.children||[]).length,
          beans: beans.map(function(b){
            return { k: b.key.slice(0,12), x: Math.round(b.x), y: Math.round(b.y),
                     r: Math.round(b.r*10)/10, d: Math.round(Math.hypot(b.x-CX, b.y-CY)) };
          })
        });
      }, 2500);
    }
    /* 统计只报当前层和下一层，见 statLine() */
    var stat = statLine();
    setLive(stat || '', false);
  }

  function drawCrumb(){
    var html = '';
    /* 进了某个库，前面挂一个回顶级的入口 —— 否则点进去就出来，
       只能刷新页面。data-i=-1 是这一档的固定标记。 */
    if (SOURCE) html += '<b data-i="-1">Raindrop Chart</b><i>›</i>';

    for (var i = 0; i < path.length; i++){
      if (i) html += '<i>›</i>';
      html += '<b data-i="' + i + '">' + path[i].name + '</b>';
    }
    crumb.innerHTML = html;
  }

  function spawnRipple(x, y, r, power){
    /* 快照模式不画涟漪：它是 600ms 的过场动画，定住以后会变成一个大圆
       穿过后面的珠子，每次截图都得解释一遍「这不是 bug」。 */
    if (SNAP) return;
    ripples.push({ x: x, y: y, r0: r * 0.6, r1: r * (1.6 + power * 0.5), t: 0, life: 620 + power * 220 });
    if (power > 0.7) ripples.push({ x: x, y: y, r0: r * 0.45, r1: r * 2.05, t: -90, life: 760 });
  }

  function hitTest(mx, my){
    var i, alive = 0;
    for (i = 0; i < beans.length; i++) if (beans[i].ta > 0.02) alive++;
    /* 中心只在它真被画出来时才算可点，否则会挡住所有珠子 */
    if (!alive && Math.hypot(mx - CX, my - CY) <= R0()) return { kind: 'center' };
    for (i = beans.length - 1; i >= 0; i--){
      var b = beans[i];
      if (b.a < 0.4) continue;
      if (Math.hypot(mx - b.x, my - b.y) <= b.r) return { kind: 'bead', bean: b };
    }
    return null;
  }

  function drawCenter(){
    var f = focusNode();
    /* 子体铺开时父体让位：不再画那个大圆，画面全留给子体。
       只数还活着的珠子 —— 退场中的 bean 会留在数组里，不能拿 length 判断。 */
    var alive = 0, q;
    for (q = 0; q < beans.length; q++) if (beans[q].ta > 0.02) alive++;
    if (alive) return;

    var R = R0();
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, TAU);
    ctx.fillStyle = hoveredKey === 'center' ? TC.dotHi : TC.dot;
    ctx.fill();
    ctx.strokeStyle = hoveredKey === 'center' ? TC.brdHi : TC.brd;
    ctx.lineWidth = 1;
    ctx.stroke();

    var g = ctx.createLinearGradient(CX - R, CY - R, CX + R, CY + R);
    g.addColorStop(0, TC.hl);
    g.addColorStop(.55, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, TAU);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.stroke();

    if (!f) return;
    ctx.textAlign = 'center';
    ctx.fillStyle = TC.ink;
    ctx.font = '500 15px system-ui,-apple-system,"PingFang SC",sans-serif';
    /* 中心珠再大也有边。15px 一行放不下就折两行，行距按字的 1.4 倍走 ——
       原来直接怼一行原名，长标题会横穿整个大圆。 */
    var cn = circleLabel(f) || String(f.name || '');
    var cw = chordW(R, 12) * 0.94;
    var c1 = fitText(cn, cw);
    var c2 = (c1 !== cn && c1.indexOf('…') >= 0) ? fitText2(cn, cw) : null;
    if (c2) ctx.fillText(c2[0], CX, expanded ? CY - 14 : CY - 12);
    else ctx.fillText(c1, CX, expanded ? CY - 6 : CY - 4);
    if (c2) ctx.fillText(c2[1], CX, expanded ? CY + 7 : CY + 9);
    ctx.fillStyle = TC.sub;
    ctx.font = '11px system-ui,-apple-system,"PingFang SC",sans-serif';
    ctx.fillText(fitText(expanded ? wtext(f) : '点一下展开', chordW(R, 12) * 0.94),
                 CX, expanded ? (c2 ? CY + 28 : CY + 12) : (c2 ? CY + 30 : CY + 14));
  }

  /* 高光贴图：只生成一次，之后每帧复用（圆形裁切，圆外透明） */
  var HL = null;
  function makeHighlight(){
    var s2 = 512;
    var c2 = document.createElement('canvas');
    c2.width = c2.height = s2;
    var g2 = c2.getContext('2d');
    g2.beginPath();
    g2.arc(s2 / 2, s2 / 2, s2 / 2, 0, TAU);
    g2.clip();
    var lg = g2.createLinearGradient(0, 0, s2, s2);
    lg.addColorStop(0, TC.hl);
    lg.addColorStop(.55, 'rgba(255,255,255,0)');
    g2.fillStyle = lg;
    g2.fillRect(0, 0, s2, s2);
    return c2;
  }

  /* ===== 合并珠那两行小字（「2000 个 · 13238 步」）的统计 =====
     原来是在 drawBeans 里现算的：每帧都要把 group 数组从头遍历两三遍。
     foldOvers 折出来的聚合珠，一个就有两千多个成员（实测那个
     13238 步的会话就是这样），于是每帧六千多次运算 —— 雨图掉帧只是表面，
     真正的影响是**整条主线程被占住，连树图都跟着卡**。
     统计只跟 group 的内容有关，缓存在珠子上，group 换了才重算。 */
  var GK_UNIT = { workspace: ' 个工作区', session: ' 个会话', turn: ' 轮',
                  file: ' 个文件' };
  function groupStat(d){
    var g = d.group;
    var sig = g.length + '|' + (g[0] ? (g[0].__addr || g[0].name || '') : '');
    if (d.__gSig === sig && d.__gS) return d.__gS;

    var gk0 = (g[0] && g[0].kind) || 'step';
    var steps = 0, sec = 0, i, gm, cnt;
    for (i = 0; i < g.length; i++){
      gm = g[i];
      if (gm.kind === 'turn' || (gm.children && gm.children.length))
        steps += (gm.children || []).length;
      sec += gm.value || 0;
    }
    var sub;
    if (gk0 === 'workspace' || gk0 === 'session'){
      cnt = 0;
      for (i = 0; i < g.length; i++) cnt += (g[i].steps || 0);
      sub = cnt + ' 步';
    } else if (gk0 === 'turn'){
      sub = steps + ' 步';
    } else if (gk0 === 'file'){
      cnt = 0;
      for (i = 0; i < g.length; i++) cnt += (g[i].count || 0);
      sub = cnt + ' 次';
    } else {
      sub = fmtSec(sec);
    }
    d.__gSig = sig;
    d.__gS = { n: g.length, sub: sub, unit: gk0 };
    return d.__gS;
  }

  /* ---- 字体/虚线常量：font 赋值是 Canvas2D 里最贵的状态变更之一
     （每次都触发字体解析），常量化 + 「变了才赋」，一帧从几百次降到个位数 ---- */
  var F10 = '500 10px system-ui,-apple-system,"PingFang SC",sans-serif';
  var F11 = '11px system-ui,-apple-system,"PingFang SC",sans-serif';
  var F12 = '500 12px system-ui,-apple-system,"PingFang SC",sans-serif';
  var F13 = '500 13px system-ui,-apple-system,"PingFang SC",sans-serif';
  var F14 = '500 14px system-ui,-apple-system,"PingFang SC",sans-serif';
  var DASH = [3, 3], NDASH = [];
  var RING = null;                       /* 合并珠虚线环的颜色，懒拼接 */

  function drawBeans(){
    var i, d, m;
    var n = beans.length;
    if (!RING) RING = 'rgba(' + TC.accentRgb + ',.40)';

    /* ---- pass 0：展开层连线。虚线整个 pass 只设一次 ---- */
    ctx.globalAlpha = 1;
    ctx.setLineDash(DASH);
    ctx.strokeStyle = TC.line;
    ctx.lineWidth = 1;
    var hostMap = null;
    for (i = 0; i < n; i++){
      var b = beans[i];
      if (!b.lane || b.a < 0.05) continue;
      /* host 原来是内层再扫一遍 beans，等于每帧 O(n²) 次字符串比较（n=300 时 9 万次）。
         建一次索引就够，不用每根线都重扫。 */
      if (!hostMap){
        hostMap = {};
        for (m = 0; m < n; m++) hostMap[beans[m].key] = beans[m];
      }
      var host = hostMap[b.hostKey];
      if (!host) continue;
      ctx.beginPath();
      ctx.moveTo(host.x, host.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    ctx.setLineDash(NDASH);

    /* 被拖的那个排到最后画，否则穿过密集区会被后画的圆盖住一角 */
    var order = beans;
    if (drag && drag.moved && drag.bean){
      order = [];
      for (i = 0; i < n; i++) if (beans[i] !== drag.bean) order.push(beans[i]);
      order.push(drag.bean);
    }

    /* ---- pass 1：圆体 + 高光。
       原来每颗圆一对 save/restore（n=224 时每帧 448 次状态栈操作）。
       这里所有用到的状态都由各 pass 自己负责，不存在泄漏，
       唯一需要归位的 globalAlpha 用「用完归位」处理。 ---- */
    for (i = 0; i < order.length; i++){
      d = order[i];
      if (d.a < 0.02 || d.r < 0.4) continue;
      if (d.a < 0.999) ctx.globalAlpha = d.a;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, TAU);
      ctx.fillStyle = (hoveredKey === d.key) ? TC.dot2Hi : TC.dot2;
      ctx.fill();
      ctx.strokeStyle = (hoveredKey === d.key) ? TC.brdHi : TC.brd2;
      ctx.lineWidth = 1;
      ctx.stroke();

      /* 高光改成预生成贴图 + drawImage。
         原来是每帧给每个圆 createLinearGradient：72 个圆 × 60 帧 = 4320 次/秒，
         每次都要分配新渐变对象并触发 GC，是 Canvas2D 里最贵的调用之一。 */
      if (d.r >= 6){
        if (!HL) HL = makeHighlight();
        ctx.drawImage(HL, d.x - d.r, d.y - d.r, d.r * 2, d.r * 2);
      }
      if (d.a < 0.999) ctx.globalAlpha = 1;
    }

    /* ---- pass 2：合并珠的虚线外环。
       原来 setLineDash 在每颗合并珠里设两次 —— n 大时一帧几百次状态切换。
       现在整个 pass 只设两次。 ---- */
    ctx.setLineDash(DASH);
    ctx.strokeStyle = RING;
    ctx.lineWidth = 1;
    for (i = 0; i < order.length; i++){
      d = order[i];
      if (!d.group || d.a < 0.02 || d.r < 0.4) continue;
      if (d.a < 0.999) ctx.globalAlpha = d.a;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r + 4.5, 0, TAU);
      ctx.stroke();
      if (d.a < 0.999) ctx.globalAlpha = 1;
    }
    ctx.setLineDash(NDASH);

    /* ---- pass 3：文字。font/textAlign/textBaseline/fillStyle 变了才赋 ---- */
    var lastFont = '', lastAlign = null, lastBase = null, lastFill = null;
    for (i = 0; i < order.length; i++){
      d = order[i];
      if (d.a < 0.02 || d.r < 0.4) continue;
      if (d.a < 0.999) ctx.globalAlpha = d.a;
      if (d.lane){
        var c = Math.cos(d.ang || 0);
        var al = (c < -0.15) ? 'right' : (c > 0.15 ? 'left' : 'center');
        if (lastAlign !== al){ ctx.textAlign = al; lastAlign = al; }
        if (lastBase !== 'middle'){ ctx.textBaseline = 'middle'; lastBase = 'middle'; }
        if (lastFont !== F11){ ctx.font = F11; lastFont = F11; }
        if (lastFill !== TC.ink2){ ctx.fillStyle = TC.ink2; lastFill = TC.ink2; }
        ctx.fillText(fitText(circleLabel(d.node), 120),
          d.x + c * (d.r + 9), d.y + Math.sin(d.ang || 0) * (d.r + 9));
      } else if (d.r >= 20){
        /* 字号、行距、可用宽度三件事都由 r 现算，不再用固定倍数：
             · 字号跟 r 走四档（10.5 / 11.5 / 13 / 14）
             · 行距 = 字号 × 1.36 —— 原来固定 6px，两行之间只隔 1px，看着是糊的
             · 可用宽度 = 那个高度的弦长 × 0.92 —— 字带越厚，弦越短
           以前 maxW 是 r*1.42（直径的 71%），等于假设字永远写在圆心那条线上；
           字号一大、字带一厚，首尾两个字就伸到弧线外面去了。 */
        var fs = d.r >= 64 ? 14 : (d.r >= 44 ? 13 : (d.r >= 30 ? 11.5 : 10.5));
        var lh = fs * 1.36;
        var maxW = chordW(d.r, fs * 0.62) * 0.92;
        if (lastBase !== 'alphabetic'){ ctx.textBaseline = 'alphabetic'; lastBase = 'alphabetic'; }
        if (lastAlign !== 'center'){ ctx.textAlign = 'center'; lastAlign = 'center'; }
        if (d.group){
          var gst = groupStat(d);
          if (lastFont !== F12){ ctx.font = F12; lastFont = F12; }
          if (lastFill !== TC.ink2){ ctx.fillStyle = TC.ink2; lastFill = TC.ink2; }
          var gcap = chordW(d.r, 15) * 0.92;
          ctx.fillText(fitText(gst.n + (GK_UNIT[gst.unit] || ' 项'), gcap), d.x, d.y - 1);
          if (lastFill !== TC.sub){ ctx.fillStyle = TC.sub; lastFill = TC.sub; }
          ctx.fillText(fitText(gst.sub, gcap), d.x, d.y + 14);
        } else {
          var fnt = fontOf(fs);
          if (lastFont !== fnt){ ctx.font = fnt; lastFont = fnt; }
          if (lastFill !== TC.ink2){ ctx.fillStyle = TC.ink2; lastFill = TC.ink2; }
          /* 裁剪结果直接挂在珠子上：宽度没变、名字没变、字体没变就不重算。
             字体必须进判断 —— 同一个名字在 10.5px 和 14px 下能放的字数不同，
             只比宽度的话，r 跨过档位时会拿着旧字号的结果一直画。 */
          var nm = circleLabel(d.node);
          var mw = maxW | 0;
          if (d.__fitW !== mw || d.__fitN !== nm || d.__fitF !== fnt){
            d.__fitW = mw;
            d.__fitN = nm;
            d.__fitF = fnt;
            var one = fitText(nm, maxW);
            /* 单行被裁掉了才试两行。两行有门槛：
                 · r >= 30 才折 —— 小圆里上下两行会把整颗珠压满，比一行更难认
                 · 折出来的两行必须是「整名被拆开」，任何一行被截断就退回单行 ——
                   两行都带省略号只会比单行更挤，还看不出是谁
               判据必须看「有没有省略号」，不能看长度 —— 「模型的模型」截断后是
               「模型的模…」，长度还是 5，跟原名一样长，比长度会漏掉它。 */
            var two = null;
            if (one !== nm && one.indexOf('…') >= 0 && d.r >= 30){
              /* 两行的字带更厚，最窄处在「半行距 + 一行字高」那条线上 */
              var tw = fitText2(nm, chordW(d.r, lh * 0.5 + fs * 0.52) * 0.92);
              if (tw && tw[0].indexOf('…') < 0 && tw[1].indexOf('…') < 0) two = tw;
            }
            d.__fit2 = two;
            d.__fitT = one;
          }
          if (d.__fit2){
            /* 基线 = 圆心上下各半个行距，再加 0.36 个字高让视觉居中。
               原来写死「d.y + 4」，小字号偏下、14px 时明显偏上。 */
            ctx.fillText(d.__fit2[0], d.x, d.y - lh * 0.5 + fs * 0.36);
            ctx.fillText(d.__fit2[1], d.x, d.y + lh * 0.5 + fs * 0.36);
          } else {
            ctx.fillText(d.__fitT, d.x, d.y + fs * 0.36);
          }
        }
      }
      if (d.a < 0.999) ctx.globalAlpha = 1;
    }
  }

  function drawRipples(dt){
    for (var i = ripples.length - 1; i >= 0; i--){
      var rp = ripples[i];
      rp.t += dt * 1000;
      if (rp.t < 0) continue;
      var k = rp.t / rp.life;
      if (k >= 1){ ripples.splice(i, 1); continue; }
      var e = 1 - Math.pow(1 - k, 3);
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r0 + (rp.r1 - rp.r0) * e, 0, TAU);
      ctx.strokeStyle = 'rgba(' + TC.accentRgb + ',' + ((1 - k) * 0.45).toFixed(3) + ')';
      ctx.lineWidth = 1 + (1 - k) * 1.1;
      ctx.stroke();
    }
  }

  function step(now){
    if (needsBuild){
      var __s0 = PERF ? pfT() : 0;
      sync();
      if (PERF){ pfStat.sync = pfT() - __s0; pfStat.syncN++; }
    }

    /* 帧统计：只记账不画东西，代价是几次减法 */
    if (PERF){
      pfStat.frames++;
      if (pfStat.t1){
        var ft = now - pfStat.t1;
        if (ft > pfStat.fMax) pfStat.fMax = ft;
        /* 写进环形缓冲：p50/p99 从这 240 个数算，不被平均值糊弄 */
        pfStat.ft[pfStat.fi] = ft;
        pfStat.fi = (pfStat.fi + 1) % PF_CAP;
        if (pfStat.fn < PF_CAP) pfStat.fn++;
        var el = now - pfStat.t0;
        /* 第一次也画出来（pfStat.box 还不存在时），否则要等 600ms 才见到面板，
           而这 600ms 恰好是用户最想看的那一下。fps 要有窗口才算得准，
           el 太短时先不写，留给下一轮。 */
        if (!pfStat.box || el > 600){
          if (el > 200) pfStat.fps = pfStat.frames * 1000 / el;
          pfStat.frames = 0;
          pfStat.t0 = now;
          pfPct();
          pfShow();
        }
      } else {
        pfStat.t0 = now;
      }
      pfStat.t1 = now;
    }

    /* 树图模式下雨图不渲染。
       原来这里没有判断：切到树图以后，雨图的 rAF 循环照样每帧清屏、
       照样把上百颗珠子画一遍 —— 画的东西还在屏幕外，纯烧 CPU，
       于是树图自己也跟着卡。数据同步照跑（上面那行 sync），只是不画。 */
    if (MODE === 'tree'){
      /* 每帧擦一次画布。不擦的话，切到树图时最后一帧雨图会留在底下 ——
         两栏面板是半透明白，那些被压扁的珠子会透出来，看着像一堆细线鬼影。
         只擦不画，一次全屏填充，成本可以忽略。 */
      ctx.clearRect(0, 0, W, H);
      requestAnimationFrame(step);
      return;
    }

    var dt = lastT ? (now - lastT) / 1000 : 0.0167;
    lastT = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0.001) dt = 0.001;

    ctx.clearRect(0, 0, W, H);

    if (!root){
      /* 分两种：连本地服务（真人在用）和读 data.js（开发/示例）。
         原来只有后者那句「在 data.js 填 RAINDROP_TREE」——对真人是纯噪音：
         他既不知道 data.js 是什么，也不知道该等还是该报错。
         连服务时数据没到只可能是还在读索引（几万条会话第一次要建），
         所以直接说「正在读取」，别让人以为是坏了。 */
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = TC.sub;
      ctx.font = '13px system-ui,-apple-system,"PingFang SC",sans-serif';
      if (LIVE){
        ctx.fillText('正在读取…', CX, CY - 8);
        ctx.font = '11px system-ui,-apple-system,"PingFang SC",sans-serif';
        ctx.fillText('第一次要建索引，之后是秒开', CX, CY + 14);
      } else {
        ctx.fillText('未注入流程树', CX, CY - 8);
        ctx.font = '11px system-ui,-apple-system,"PingFang SC",sans-serif';
        ctx.fillText('在 data.js 填 RAINDROP_TREE', CX, CY + 14);
      }
      ctx.restore();
      requestAnimationFrame(step);
      return;
    }

    /* root 有、这一层却一颗珠都没有 —— 不能什么都不画。
       一片纯背景和「坏了」长得一模一样，用户没法区分「这里本来就空」
       和「加载失败」。

       但要留 800ms 宽限：sync 建珠子/入场都在头几帧里跑完，
       立刻弹「没有内容」等于每进一层都闪一下这行字，比空白更吵。 */
    var aliveNow = 0;
    for (var ai = 0; ai < beans.length; ai++) if (beans[ai].ta !== 0) aliveNow++;
    if (!aliveNow){
      if (!emptySince) emptySince = now;
      if (now - emptySince < 800){
        requestAnimationFrame(step);
        return;
      }
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = TC.sub;
      ctx.font = '13px system-ui,-apple-system,"PingFang SC",sans-serif';
      ctx.fillText('这一层没有内容', CX, CY - 8);
      ctx.font = '11px system-ui,-apple-system,"PingFang SC",sans-serif';
      ctx.fillText('退回上一层，或切到树图看结构', CX, CY + 14);
      ctx.restore();
      requestAnimationFrame(step);
      return;
    }
    emptySince = 0;

    var k = 1 - Math.pow(0.0016, dt);
    for (var i = beans.length - 1; i >= 0; i--){
      var b = beans[i];
      b.x += (b.tx - b.x) * k;
      b.r += (b.tr - b.r) * k;
      b.a += (b.ta - b.a) * k;

      /* 新到的事件：竖直坠落。坠落期间 y 直接跟住，落地后交回弹簧 */
      if (b.gy < 0){
        b.gv += 2600 * dt;
        b.gy += b.gv * dt;
        if (b.gy >= 0){
          b.gy = 0; b.gv = 0;
          spawnRipple(b.tx, b.ty, b.tr, 0.35 + Math.min(1, b.tr / 60));
        } else {
          b.y = b.ty + b.gy;
        }
      } else {
        b.y += (b.ty - b.y) * k;
      }

      if (b.ta === 0 && b.a < 0.02) beans.splice(i, 1);
    }

    /* 拖动期间：先把空位补上，再让所有圆两两让开。
       顺序不能反 —— 先推后补，补进来的那个就会压在别人身上没人管。

       ⚠️ 必须带 `drag.bean`。按住空白或中心拖时 bean 是 null，
       那时 relaxAll 里的 pinned 也是 null，于是每一对都「各让一半」——
       整层每帧向外膨胀，拖得越久散得越开，最后全被挤到屏幕外。
       按住空白拖本来不该移动任何东西，那只是「划了一下」。

       不拖动时这两个函数一次都不跑，平时零成本。

       注意这里**不能**改成「静止时每半秒自检一遍再推」：那等于给页面挂了一个
       永不停止的定时开销，而且只要判定阈值稍宽一点（比如 2px），排好的图也会
       被判成重叠，于是每半秒推一次、圆一直在微动，看着就是「很卡」。
       真正的兜底放在 restoreHome 末尾：松手那一刻量一次，有问题就重排。 */
    if (drag && drag.moved && drag.bean){
      mendHole(dt);
      relaxAll();
    }

    drawRipples(dt);

    /* 涟漪画在圆**下面**：从圆心长出来那一小截本来就该被圆盖住，
       露出来的只是外圈 —— 看着才像水面被压下去一圈，而不是圆上糊了个环。 */
    drawCenter();
    drawBeans();

    requestAnimationFrame(step);
  }

  /* ---------------- 交互 ---------------- */

  /* ============ 右键菜单 ============ */
  /* 老浏览器兜底：临时 textarea + execCommand。抽出来是因为异步复制那条路也要用它 */
  function legacyCopy(t){
    var ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) {}
    document.body.removeChild(ta);
    return ok;
  }
  function copyText(t){
    t = String(t == null ? '' : t);
    if (!t) return false;
    try{
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t);
        return true;
      }
    }catch(e){}
    return legacyCopy(t);
  }
  /* 复制发生在 fetch 回调里时，用户手势链已经断了 —— clipboard.writeText 会被拒。
     所以这条路必须等它的 Promise，失败了再退 execCommand；
     不能像 copyText 那样乐观地先返回 true，那会让用户以为复制成功、粘出来还是旧内容。 */
  function copyTextAsync(t, done){
    t = String(t == null ? '' : t);
    if (!t){ done(false); return; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t)
        .then(function(){ done(true); })
        .catch(function(){ done(legacyCopy(t)); });
      return;
    }
    done(legacyCopy(t));
  }

  /* 这颗珠子在「资料库」里的层级地址：WorkBuddy 会话 › Desktop/… › 伊万。
     和磁盘路径是两回事 —— 这条给 WorkBuddy 认（哪个工作区的哪个会话），
     那条给文件系统认（文件到底在 C 盘哪里）。 */
  /* 这颗珠子属于哪个**工作区**。工作区珠自己带 wid；会话、回合、步骤珠都没有，
     所以要往上找 —— 这正是「在工作空间中打开」要的那一层：
     不是「这个文件在哪」，而是「这堆东西属于哪个项目文件夹」。
     和 diskOwnerOfBean 的区别：那个会就近拿到 sid（落到某个 .jsonl），
     这个只要 wid，一路找到项目这一层为止。 */
  function wsWidOfBean(bean){
    if (!bean) return '';
    var n = bean.node;
    if (n && n.wid) return n.wid;
    for (var i = path.length - 1; i >= 0; i--){
      if (path[i] && path[i].wid) return path[i].wid;
    }
    return '';
  }

  /* 磁盘身份：自己没有，就往上找最近一个有的。
     回合、步骤这些节点**不带** sid —— 每条都带，一个 2000 回合的会话要多出几百 KB，
     而它们总归落在某个会话里，那个会话的 .jsonl 就是它们的磁盘位置。
     就近往上找比「一律用最外层会话」准：目录节点自己有 disk，文件节点自己有 sid。 */
  function diskOwnerOfBean(bean){
    if (!bean) return null;
    var n = bean.node, i, a;
    if (n && (n.sid || n.rel || n.wid || n.disk)) return n;
    for (i = path.length - 1; i >= 0; i--){
      a = path[i];
      if (a && (a.sid || a.rel || a.wid || a.disk)) return a;
    }
    return n;
  }
  function diskOwnerOfKey(key){
    if (!key) return null;
    var segs = String(key).split('/'), n;
    for (var i = segs.length; i >= 1; i--){
      n = treeNodeMap[segs.slice(0, i).join('/')];
      if (n && (n.sid || n.rel || n.wid || n.disk)) return n;
    }
    return null;
  }
  /* 树图版的「属于哪个工作区」：只要 wid，一路往上找到工作区那一层。
     和 diskOwnerOfKey 的分工一样 —— 那个就近落到具体文件，这个落到项目。 */
  function wsWidOfKey(key){
    if (!key) return '';
    var segs = String(key).split('/'), n;
    for (var i = segs.length; i >= 1; i--){
      n = treeNodeMap[segs.slice(0, i).join('/')];
      if (n && n.wid) return n.wid;
    }
    return '';
  }

  /* 让服务端把这一行的磁盘路径查出来。
     浏览器自己碰不到文件系统，所以前端只传身份（sid/rel/wid），路径由服务端查 ——
     反过来说，如果这里能直接指定路径，页面里任何一段脚本都能让本机弹资源管理器。
     open=true 在资源管理器打开；open=false 只把路径交回来（dry，不弹窗）。 */
  function withDiskPath(node, open, cb){
    if (!node) return;
    /* disk 是磁盘树自己报的相对位置（相对 ~/.workbuddy/projects），优先级高于 wid。
       左右两栏的同一个工作区 wid 完全一样，但真实位置不同 ——
       左栏是 projects 下那个机器命名的目录，右栏是桌面上的项目文件夹。 */
    var body = { sid: node.sid || '', rel: node.rel || '',
                 wid: node.wid || '', disk: node.disk || '' };
    if (!body.sid && !body.rel && !body.wid && !body.disk){
      flashTip('这一行没有磁盘位置（虚拟层）');
      return;
    }
    if (!open) body.dry = true;
    fetch('/api/reveal', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!d || !d.ok){ flashTip((d && d.reason) || '打不开'); return; }
      if (open) flashTip(d.dir ? '已在资源管理器打开' : '已在资源管理器选中');
      else if (cb) cb(d.path);
    }).catch(function(){ flashTip('打不开'); });
  }
  function revealNode(node){ withDiskPath(node, true); }
  /* 复制的是磁盘真路径（C:\Users\…\xxx.jsonl），不是「资料库 › GonJui › …」那种层级。
     以前 copypath 拼的是面包屑，粘到资源管理器地址栏打不开 —— 名字叫复制路径，干的不是这事。 */
  function copyDiskPath(node){
    withDiskPath(node, false, function(p){
      copyTextAsync(p, function(ok){
        flashTip(ok ? '已复制路径' : '复制失败');
      });
    });
  }

  function flashTip(text){
    tipHTML = '<div class="th">' + esc(text) + '</div>';
    tip.innerHTML = tipHTML;
    tip.style.left = ctxX + 'px';
    tip.style.top = ctxY + 'px';
    tip.style.transform = 'translate(-50%,-150%)';
    tip.style.opacity = '1';
    clearTimeout(liveTimer);
    liveTimer = setTimeout(function(){ tip.style.opacity = '0'; }, 1100);
  }

  function ctxItem(act, label, note, cls){
    return '<i data-act="' + act + '"' + (cls ? ' class="' + cls + '"' : '') + '>'
      + '<span>' + esc(label) + '</span>'
      + (note ? '<s>' + esc(note) + '</s>' : '')
      + '</i>';
  }

  /* 带二级菜单的项：右边不写说明文字，只留一个箭头 —— 说明写进下一层，
     父层再写一遍「文件 / 文件夹」就是在替下一层做决定，反而把箭头挤小。 */
  function ctxSub(label){
    return '<i data-act="addsrc" class="sub"><span>' + esc(label) + '</span></i>';
  }

  /* 「新增数据源」的两个入口。
     原来是二级子菜单（点一下「新增数据源」才弹出两个选项），
     层级多一层、多点一次。现在直接平级列出来 —— 就两行字，
     藏进子菜单反而让人先看到标题、再点一次才知道能干什么。
     位置固定在「离线/实时」那一项下面。 */
  function srcRows(){
    return ctxItem('addsrc-file', '新增数据源 · CSV', '导入成一个库') +
           ctxItem('addsrc-dir', '新增数据源 · 文件夹', '目录结构就是树');
  }

  /* 六套主题的清单：名字 / 悬停说明。色块的颜色不在这里 ——
     它取的是各套主题的「圆面色 + 圆描边」，写在 :root 的 --t-*-face/edge
     和 #ctx .sw[data-theme] 上，与雨滴本身同源，改一处两边一起变。
     顺序固定 蓝-绿-米白-粉-紫-黑；加新主题要三处一起加：
     这里一条、CSS 一块 html[data-theme=...]、一条 .sw[data-theme=...]。 */
  var THEMES = [
    ['blue',   '蓝 · 冷白底 + 蓝主色'],
    ['green',  '绿 · 草木'],
    ['beige',  '米白 · 最初那版纸色青'],
    ['pink',   '粉 · 樱'],
    ['purple', '紫 · 藕'],
    ['dark',   '黑 · 深底青主色']
  ];

  /* 主题行：左边一个词，右边六个色块。色块没字，靠 title 说清是哪套。 */
  function themeRow(){
    var s = '<div class="cxrow"><span>主题</span><div class="sww">', i;
    for (i = 0; i < THEMES.length; i++){
      s += '<b class="sw' + (themeSel === THEMES[i][0] ? ' on' : '') + '"'
        + ' data-theme="' + THEMES[i][0] + '"'
        + ' title="' + THEMES[i][1] + '"></b>';
    }
    return s + '</div></div>';
  }

  /* 把当前主题的 Canvas 色读进来。CSS 里 --cv-* 每套主题各定义了一份，
     这里只在切换时取一次，绘制循环直接用 TC，不再碰 DOM。
     高光贴图是预渲染的（带着当时的白度），换主题必须作废重建，否则换到深底那套圆点会发白。 */
  function readTheme(){
    var cs = getComputedStyle(document.documentElement);
    function v(n){ return cs.getPropertyValue(n).trim(); }
    TC.dot     = v('--cv-dot');
    TC.dotHi   = v('--cv-dot-hi');
    TC.dot2    = v('--cv-dot2');
    TC.dot2Hi  = v('--cv-dot2-hi');
    TC.brd     = v('--cv-dot-brd');
    TC.brd2    = v('--cv-dot-brd2');
    TC.brdHi   = v('--cv-dot-brd-hi');
    TC.ink     = v('--cv-ink');
    TC.ink2    = v('--cv-ink2');
    TC.sub     = v('--cv-sub');
    TC.line    = v('--cv-line');
    TC.hl      = v('--cv-hl');
    TC.accentRgb = v('--rgb-accent') || '46,125,138';
    if (RIP) RIP.rgb = TC.accentRgb;   /* 涟漪和雨丝拼 rgba 用 */
    HL = null;                          /* 高光贴图作废 */
  }

  /* 真正把主题落到位：校验名字、改属性、存档、刷选中态、重读 Canvas 色。
     非法值（旧存档里的 auto / light）落回 blue，所以调用方不用自己校验。 */
  function applyTheme(t){
    var i, ok = false;
    for (i = 0; i < THEMES.length; i++) if (THEMES[i][0] === t) ok = true;
    if (!ok) t = 'blue';

    themeSel = t;
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('rd-theme', t); } catch (e) {}
    var bs = ctxEl.querySelectorAll('.sw');
    for (i = 0; i < bs.length; i++)
      bs[i].className = 'sw' + (bs[i].getAttribute('data-theme') === t ? ' on' : '');
    readTheme();
  }

  /* 切主题。没有「跟随系统」这一档 —— 六套里选一套就是一套，系统换外观不动它。
     主题名直接就是 data-theme 的值；blue 用 :root 那套默认值，不需要单独的 CSS 块。
     动画就是整页淡入：挂 .theming 让浮层跟 body 一样在 .35s 里过渡，到点摘掉。 */
  var themeTimer = 0;
  function setTheme(t){
    var root = document.documentElement;
    root.classList.add('theming');
    applyTheme(t);

    /* 连续点几下时不叠加多个定时器，只留最后一个 —— 否则先前的会提前把类摘掉 */
    if (themeTimer) clearTimeout(themeTimer);
    themeTimer = setTimeout(function(){
      themeTimer = 0;
      root.classList.remove('theming');
    }, 420);
  }

  /* 贴边翻转：默认右下展开，空间不够就改成左上。菜单和调参面板共用。 */
  function ctxPlace(x, y){
    var w = ctxEl.offsetWidth, hh = ctxEl.offsetHeight;
    var left = x, top = y;
    if (left + w > window.innerWidth - 8) left = x - w;
    if (top + hh > window.innerHeight - 8) top = y - hh;
    if (left < 8) left = 8;
    if (top < 8) top = 8;
    ctxEl.style.left = left + 'px';
    ctxEl.style.top = top + 'px';
  }

  function showCtx(x, y, bean){
    ctxBean = bean || null;
    ctxTree = null;
    ctxX = x; ctxY = y;
    var h = ctxItem('rain', '下雨', '刷新 F5');
    if (ctxBean){
      h += '<hr>';
      h += ctxItem('pin', ctxBean.pinned ? '取消固定雨滴' : '固定雨滴',
                   ctxBean.pinned ? '松手不回归' : '松手不回归');
      h += ctxItem('branch', branchNode === ctxBean.node && ctxBean.node ? '恢复全貌' : '展开下级',
                   ctxBean.node ? '只看这一支' : '合并块不支持');
      h += '<hr>';
      h += ctxItem('copyname', '复制名称', '');
      /* 雨图里不再有「复制路径」。
         它复制的是「工作区 › 会话」这串层级文字，粘出去既不是磁盘路径
         （资源管理器打不开），也不是能喂给别处的地址 —— 只是把屏幕上的
         面包屑抄了一遍。用户在这儿真正想干的事是「去那个文件夹看看」，
         所以换成直接的「在工作空间中打开」。 */
      var own = diskOwnerOfBean(ctxBean);
      var rv = !!(own && (own.sid || own.rel || own.wid || own.disk));
      var wsw = wsWidOfBean(ctxBean);
      h += ctxItem('openws', '在工作空间中打开',
                   wsw ? '项目文件夹' : '不属于任何工作区',
                   wsw ? '' : 'off');
      h += ctxItem('reveal', '在资源管理器中打开',
                   rv ? '磁盘位置' : '虚拟层没有磁盘位置',
                   rv ? '' : 'off');
    } else {
      /* 雨图空白处只放全局项：主题 + 实时/离线。
         「调参」不在这里 —— 它调的是树图底下那层雨动画，跟雨图没有关系，
         摆在雨图里会让人以为调的是画布上的雨丝。树图右键里才有。 */
      h += '<hr>';
      h += themeRow();
    }
    /* 数据源三项：不管右键点在珠子还是空白，都固定在这一段，
       位置不变、顺序不变 —— 找东西靠肌肉记忆，不靠每次重新读菜单。 */
    h += '<hr>';
    h += ctxItem('link', offline ? 'WorkBuddy · 未连接' : 'WorkBuddy · 已连接',
                 offline ? '点击连接' : '点击断开');
    h += srcRows();
    ctxEl.innerHTML = h;
    ctxEl.className = 'on';
    ctxPlace(x, y);
  }

  /* 树图的右键：五件事固定不变 —— 调参（下方雨动画）/ 主题 / 复制名称 / 复制路径 / 离线。
     没有「下雨」「固定雨滴」「展开下级」：那些是雨图的珠子才有的动作。 */
  function showCtxTree(x, y, name, p, node, side, key){
    ctxBean = null;
    ctxTree = { name: name || '', path: p || '', node: node || null, side: side || '', key: key || '' };
    ctxX = x; ctxY = y;
    var h = ctxItem('tune', '调参', '下方雨动画');
    h += themeRow();
    h += '<hr>';
    /* 空白处不写「无」—— 「无」是在说结果（这一行没有名字），
       用户需要的是下一步做什么（去右击一个真正的名字）。所以改成指路。 */
    h += ctxItem('copyname', '复制名称', name ? '' : '请右击名称', name ? '' : 'off');
    /* 复制路径分两种含义，跟着栏走：
         左栏（磁盘视图）→ 物理路径，我要自己去 C 盘找它
         右栏（资料库视图）→ 层级地址「工作区 › 会话」，让 WorkBuddy 自己去定位
       两个是不同的问题，所以副标题直接写出来，不让人猜。 */
    var isDisk = (side === 'disk');
    var trv = node && (node.sid || node.rel || node.wid || node.disk);
    var canCopy = isDisk ? !!trv : !!p;
    h += ctxItem('copypath', '复制路径',
                 isDisk ? '磁盘路径' : '工作区路径',
                 canCopy ? '' : 'off');
    /* 副标题只说明「这是个什么东西」，不回显具体值 ——
       一长串 C:\Users\… 挂在菜单上反而把菜单撑歪，而且它每行都不一样，
       看起来像在实时播报。真值复制出来看。
       两个「打开」按栏分工：左栏是这个东西在硬盘哪儿，右栏是它属于哪个项目。
       会话行自己没有 wid，往上借所属工作区的（wsWidOfKey）。 */
    if (isDisk){
      h += ctxItem('reveal', '在资源管理器中打开',
                   trv ? '磁盘位置' : '虚拟层没有磁盘位置',
                   trv ? '' : 'off');
    } else {
      var wsw = wsWidOfKey(key);
      h += ctxItem('openws', '在工作空间中打开',
                   wsw ? '项目文件夹' : '不属于任何工作区',
                   wsw ? '' : 'off');
    }
    h += '<hr>';
    h += ctxItem('link', offline ? '实时' : '离线',
                 offline ? '重新连接 WorkBuddy' : '断开 WorkBuddy');
    h += srcRows();
    ctxEl.innerHTML = h;
    ctxEl.className = 'on';
    ctxPlace(x, y);
  }

  /* 从 keyPath 还原这一行的层级路径：d/3/0 → 资料库 › GonJui › Raindrop Chart。
     keyPath 的每一段都能在 treeNodeMap 里查到对应的节点，逐级拼就行。 */
  function treePath(key){
    if (!key) return '';
    var segs = key.split('/'), acc = '', out = [], i, n;
    for (i = 0; i < segs.length; i++){
      acc = i ? acc + '/' + segs[i] : segs[i];
      n = treeNodeMap[acc];
      /* 根那一层是表的标题（Raindrop Chart），不是清单里的一行 ——
         拼进地址只是噪音。"WorkBuddy 会话 › 工作区 › 会话" 已经足够定位了。 */
      if (n && n.name && n.kind !== 'root') out.push(n.name);
    }
    return out.join(' › ');
  }

  function hideCtx(){
    closeSub();
    ctxEl.className = '';
    ctxBean = null;
    ctxTree = null;
  }

  function ctxAct(act){
    var b = ctxBean;
    if (act === 'rain'){
      rainAgain();
      liveSeq = -1;
      livePull();
    } else if (act === 'pin' && b){
      /* 只影响「松手回不回归」这一个动作：照样能拖、照样被邻居推开 */
      b.pinned = !b.pinned;
    } else if (act === 'branch' && b && b.node){
      branchNode = (branchNode === b.node) ? null : b.node;
      openGroups = {};
      needsBuild = true;
      sync();
    } else if (act === 'copyname'){
      var nm = ctxTree ? ctxTree.name : (b && b.node ? b.node.name : '');
      if (nm && copyText(nm)) flashTip('已复制名称');
    } else if (act === 'copypath'){
      /* 只剩树图在用。磁盘视图给物理路径（我去找它），
         资料库视图给层级地址（WorkBuddy 去找它）。 */
      if (ctxTree){
        if (ctxTree.side === 'disk' || !ctxTree.path){
          copyDiskPath(ctxTree.node);
        } else if (copyText(ctxTree.path)){
          flashTip('已复制路径');
        }
      }
    } else if (act === 'openws'){
      /* 树图右栏 / 雨图共用这一个动作：定位到「这颗属于哪个工作区」。
         树图给的是行 key，雨图给的是珠子 —— 两条路各取各的身份。 */
      var wswid = ctxTree ? wsWidOfKey(ctxTree.key) : wsWidOfBean(b);
      if (!wswid){ flashTip('这一层不属于任何工作区'); return; }
      revealNode({ wid: wswid });
    } else if (act === 'reveal'){
      revealNode(ctxTree ? ctxTree.node : diskOwnerOfBean(b));
    } else if (act === 'tune'){
      openTune();
    } else if (act === 'link'){
      setLink(!offline);
    } else if (act === 'addsrc'){
      openSrcSub();
      return;                    /* 不关菜单：原地展开二级 */
    } else if (act === 'addsrc-file'){
      pickSourceFile();
    } else if (act === 'addsrc-dir'){
      pickSourceDir();
    }
    hideCtx();
  }

  /* 「新增数据源」的二级菜单：文件和文件夹是两条不同的路径，
     塞进一次系统对话框做不到（同一个 input 不能同时选两者）。
     所以父项不直接弹文件框，而是在它右侧展开这一层 ——
     两个选项同时可见，用户挑一个，不会先被系统的「打开」框锁死。 */
  var subTimer = 0;

  function subKeep(){
    if (subTimer){ clearTimeout(subTimer); subTimer = 0; }
  }
  function subLater(ms){
    subKeep();
    subTimer = setTimeout(function(){ subTimer = 0; closeSub(); }, ms);
  }

  function openSrcSub(){
    var it = ctxEl.querySelector('i.sub');
    if (!it){ return; }
    subKeep();
    /* 每次都重建：两个选项的说明跟着当前模式走（雨图/树图不共用一套措辞） */
    ctx2El.innerHTML =
      ctxItem('addsrc-file', '选一个 CSV 文件', '导入成一个库') +
      ctxItem('addsrc-dir', '选一个文件夹', '目录结构就是树');
    ctx2El.className = 'on';

    /* 贴边翻转：默认开在父项右侧，右边界不够就翻到左侧；
       纵向把二级的第一个选项对齐父项的第一个选项（父菜单内边距 5 + 描边 1 = 6）。
       两个面板之间留 -1px 的重叠，接缝看上去是一张纸折出来的两层。 */
    var r = it.getBoundingClientRect();
    var w = ctx2El.offsetWidth, hh = ctx2El.offsetHeight;
    var left = r.right - 1;
    var top = r.top - 6;
    if (left + w > window.innerWidth - 8) left = r.left - w + 1;
    if (top + hh > window.innerHeight - 8) top = window.innerHeight - 8 - hh;
    if (left < 8) left = 8;
    if (top < 8) top = 8;
    ctx2El.style.left = left + 'px';
    ctx2El.style.top = top + 'px';

    it.className = 'sub open';       /* 父项保持高亮，指出这一层从哪儿来 */
  }

  function closeSub(){
    subKeep();
    if (!ctx2El.className) return;
    ctx2El.className = '';
    var it = ctxEl.querySelector('i.sub');
    if (it) it.className = 'sub';
  }

  /* 实时 / 离线：离线就把 WorkBuddy 的数据源掐掉，画面停在当前这一帧；
     切回实时立刻强制拉一次，不用等到下一轮轮询。 */
  function setLink(toOffline){
    offline = !!toOffline;
    if (offline){
      setLive('默认数据', false);
    } else {
      liveSeq = -1;
      liveFail = 0;
      livePull();          /* 立刻补一次，setLive 会把「离线」前缀一起去掉 */
    }
  }


  /* ============ 新增数据源：选一个 CSV → 导入 → 立刻切过去 ============ */
  var srcPick = null, srcDirPick = null;

  function pickSourceFile(){
    if (!srcPick){
      srcPick = document.createElement('input');
      srcPick.type = 'file';
      srcPick.accept = '.csv,text/csv';
      srcPick.style.display = 'none';
      document.body.appendChild(srcPick);
      srcPick.addEventListener('change', function(){
        var f = srcPick.files && srcPick.files[0];
        if (f) uploadSource(f);
        srcPick.value = '';          /* 清掉，选同一个文件两次也要能触发 */
      });
    }
    srcPick.click();
  }

  /* 整个文件夹：里面每个 .csv 各自成为一个库，不合并 ——
     合并会把「订单履约」「Hello World」这类互不相干的东西塞进同一棵树，没法读。 */
  /* ============ 新增数据源 · 文件夹：导入「结构」，不导入内容 ============
     一个文件夹本身就是一棵树 —— 目录是父，文件是叶。
     所以只把「相对路径 + 字节数」发上去，不读任何文件内容。
     几千个文件也就几百 KB，而且永远看不到文件里写了什么。 */
  var srcDirPick = null;
  var DIR_MAX = 20000;        /* 再多就不是「看结构」，是在导整块硬盘 */

  function pickSourceDir(){
    if (!srcDirPick){
      srcDirPick = document.createElement('input');
      srcDirPick.type = 'file';
      srcDirPick.setAttribute('webkitdirectory', '');
      srcDirPick.setAttribute('directory', '');
      srcDirPick.multiple = true;
      srcDirPick.style.display = 'none';
      document.body.appendChild(srcDirPick);
      srcDirPick.addEventListener('change', function(){
        var fs = srcDirPick.files || [], list = [], i, cut = false;
        var rootName = '', prefix = '';
        for (i = 0; i < fs.length; i++){
          var p = fs[i].webkitRelativePath || fs[i].name;
          var seg = p.split('/');
          /* 浏览器给的相对路径第一段就是选中的那个文件夹名，
             根节点已经叫这个名字了，别重复一层 */
          if (!rootName && seg.length > 1){ rootName = seg[0]; prefix = seg[0] + '/'; }
          if (list.length >= DIR_MAX){ cut = true; break; }
          list.push([p.indexOf(prefix) === 0 ? p.slice(prefix.length) : p, fs[i].size || 0]);
        }
        srcDirPick.value = '';
        if (!list.length){ flashTip('这个文件夹里没有文件'); return; }
        importTree(rootName || '结构树', list, cut);
      });
    }
    srcDirPick.click();
  }

  function importTree(name, files, cut){
    flashTip('正在读结构 · ' + files.length + ' 个文件…');
    fetch('/api/source/tree', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, files: files })
    })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok){ flashTip('导入失败：' + ((d && d.error) || '未知错误')); return; }
        flashTip('已导入 ' + d.files + ' 个文件' + (cut ? '（超出上限，只取了前面一部分）' : ''));
        switchSource(d.key);
        colsRefresh();               /* 两栏同时多一行，不用等切到树图 */
      })
      .catch(function(e){ flashTip('导入失败：' + e.message); });
  }

  function uploadSource(file){
    var rd = new FileReader();
    rd.onload = function(){
      fetch('/api/source/add?name=' + encodeURIComponent(file.name), {
        method: 'POST',
        headers: { 'Content-Type': 'text/csv; charset=utf-8' },
        body: rd.result
      })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d && d.ok){
            switchSource(d.key);
            colsRefresh();           /* 左栏多一个地址，右栏多一个库 */
            flashTip('已导入 ' + (d.label || file.name));
          } else {
            flashTip((d && d.error) || '导入失败');
          }
        })
        .catch(function(){ flashTip('导入失败'); });
    };
    rd.onerror = function(){ flashTip('这个文件读不了'); };
    rd.readAsText(file, 'utf-8');
  }

  /* 换数据源 = 换了一整棵树。焦点、下钻路径、增量游标全要重来，
     否则新树的节点会被当成「新到的」落一串雨滴，或者卡在旧路径上。 */
  function switchSource(key){
    /* 允许传空串：空 = 回到顶级目录（Raindrop Chart）。 */
    SOURCE = key || '';
    offline = false;
    path = [];
    openGroups = {};
    liveSeq = -1;
    liveReady = false;
    lastSeenAt = 0;
    intoDone = false;
    expanded = true;
    if (qEl) qEl.value = '';
    livePull();
  }

  function setFocus(idx){
    path = path.slice(0, idx + 1);
    expanded = true;
    openGroups = {};
    drawCrumb();
    sync();
  }

  cv.addEventListener('pointermove', function(e){
    /* 拖动中：圆跟着指针走。只改这一帧的位置，不写入任何持久状态，
       松手后 sync() 会把目标位还原，圆自己弹回去。 */
    if (drag){
      var mdx = e.clientX - drag.sx, mdy = e.clientY - drag.sy;
      if (!drag.moved && mdx * mdx + mdy * mdy >= DRAG_MIN * DRAG_MIN) drag.moved = true;
      if (drag.moved && drag.bean){
        var nb = drag.bean;
        nb.x = nb.tx = e.clientX + drag.ox;
        nb.y = nb.ty = e.clientY + drag.oy;
        clampScreen(nb);                 /* 甩不出屏幕：拖到边缘就顶住 */
        nb.gy = 0; nb.gv = 0;            /* 还在下落的，抓住就落地，别再往下掉 */
        /* 推开别人不在这里做：统一交给 step() 里的 relaxAll()，
           保证「任何两个圆都不重叠」这条规则只有一处实现。 */
        cv.style.cursor = 'grabbing';
        tip.style.opacity = '0';
      }
      return;
    }
    var hit = hitTest(e.clientX, e.clientY);
    hoveredKey = null;
    if (hit){
      hoveredKey = hit.kind === 'center' ? 'center' : hit.bean.key;
      cv.style.cursor = (hit.kind === 'center') ? 'pointer' : 'grab';
      /* 副标题只放「量」，不放「怎么操作」——
         点一下进入 / 点一下加载 / 点一下收起 / 按住可拖 这些动词
         底部提示和右键菜单都已经说过一遍了，重复放在每次悬停都要跳一次的位置，
         反而让卡片宽度随圆变来变去。这里只回答「这是什么、有多大」，
         没量可说就整行不出，卡片高度也就不会忽高忽低。 */
      var name, sub = '';
      if (hit.kind === 'center'){
        name = focusNode().name;
        sub = wtext(focusNode());
      } else if (hit.bean.group){
        name = hit.bean.group.length + ' 项合并';
        sub = hit.bean.group.map(function(g){ return g.name; }).join(' · ');
      } else {
        name = dispName(hit.bean.node);
        /* 会话节点没有 children，但它的步数 / 回合数就在自己身上。
           以前这里用「有没有 children」当门槛，等于把会话的统计也一起挡掉了。 */
        sub = wtext(hit.bean.node);
      }
      /* 工作区：时间戳名字认不出内容，悬停列出里面最重的 3 个会话。
         这只是提示框里的说明，不参与层级，也不改任何树的统计口径。 */
      var extra = '';
      if (hit.kind === 'bead' && !hit.bean.group){
        var nd0 = hit.bean.node, tp = nd0 && nd0.top;
        if (tp && tp.length){
          for (var ti = 0; ti < tp.length; ti++){
            extra += '<div class="tr"><i>' + (ti + 1) + '</i><em>'
              + esc(tp[ti].name || '(无标题)') + '</em>'
              + '<s>' + (tp[ti].steps || 0) + ' 步</s></div>';
          }
        }
      }
      /* 内容没变就不重建 DOM。pointermove 每个像素都触发一次，
         无脑写 innerHTML 会让同一张卡片被反复销毁重绘，看着就像在闪。 */
      var html = '<div class="th">' + esc(name) + '</div>'
        + (sub ? '<div class="ts">' + esc(sub) + '</div>' : '')
        + (extra ? '<hr>' + extra : '');
      if (html !== tipHTML){ tip.innerHTML = html; tipHTML = html; }
      /* 内容一高就可能顶出屏幕顶部，靠近顶端时改成向下展开 */
      var hh = tip.offsetHeight || 26;
      tip.style.transform = (e.clientY - hh * 1.5 < 8)
        ? 'translate(-50%, 14px)'
        : 'translate(-50%,-150%)';
      tip.style.left = e.clientX + 'px';
      tip.style.top = e.clientY + 'px';
      tip.style.opacity = '1';
    } else {
      cv.style.cursor = 'default';
      tip.style.opacity = '0';
    }
  });

  /* 点击的真实动作都挪到这里，只有“按下 → 松开”位移小于阈值时才执行 */
  function tapHit(hit){
    if (!hit){
      if (expanded){
        expanded = false;
        openGroups = {};
        spawnRipple(CX, CY, R0(), 0.6);
        sync();
      }
      return;
    }
    if (hit.kind === 'center'){
      expanded = !expanded;
      openGroups = {};
      spawnRipple(CX, CY, R0() * 0.9, 1);
      sync();
      return;
    }
    var b = hit.bean;
    spawnRipple(b.x, b.y, b.r, 0.8);
    /* 顶级目录里的「库」珠子：点一下切到那个数据源 */
    if (b.node && b.node.kind === 'src'){
      switchSource(b.node.srcKey);
      return;
    }
    if (b.group){
      if (openGroups[b.key]) delete openGroups[b.key];
      else openGroups[b.key] = true;
      sync();
      return;
    }
    if (b.lane) return;
    /* 工作区：会话还没拉过，点下去才请求 */
    if (b.node.lazyWs && !(b.node.children && b.node.children.length)){
      wsLoad(b.node, function(){
        path.push(b.node);
        expanded = true;
        openGroups = {};
        drawCrumb();
        sync();
        spawnRipple(CX, CY, R0() * 0.8, 0.9);
      });
      return;
    }
    if (b.node.lazy && b.node.sid){
      loadSession(b.node, function(){
        path.push(b.node);
        expanded = true;
        openGroups = {};
        drawCrumb();
        sync();
        spawnRipple(CX, CY, R0() * 0.8, 0.9);
      });
      return;
    }
    if (b.node.children && b.node.children.length){
      path.push(b.node);
      expanded = true;
      openGroups = {};
      drawCrumb();
      sync();
    }
  }

  cv.addEventListener('pointerdown', function(e){
    if (e.button === 2) return;                       /* 右键交给 contextmenu */
    if (e.button === 3 || e.button === 4) return;      /* 侧键交给 window 那边 */
    var hit = hitTest(e.clientX, e.clientY);
    var bean = (hit && hit.kind === 'bead') ? hit.bean : null;
    drag = {
      bean: bean,
      key: bean ? bean.key : (hit ? '@center' : '@blank'),
      sx: e.clientX, sy: e.clientY,
      ox: bean ? bean.x - e.clientX : 0,
      oy: bean ? bean.y - e.clientY : 0,
      moved: false,
      hit: hit
    };
    if (bean){
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      cv.style.cursor = 'grab';
      /* 按下时给所有人拍一张目标位快照：拖动中推开会改 tx/ty，松手要原样还回去。
         用 key 做索引而不是数组下标 —— 拖动期间数据轮询可能让珠子增减，
         按下标存的话长度一对不上就只能全量重排，而重排会从「已经被推乱的
         当前位置」抄坐标，于是松手就留下一堆重叠。按 key 存谁都不会错位。 */
      var snap = {};
      for (var si = 0; si < beans.length; si++){
        snap[beans[si].key] = [beans[si].tx, beans[si].ty];
      }
      drag.snap = snap;
      drag.homeX = bean.x;      /* 原位，用来画那个虚线圈 */
      drag.homeY = bean.y;
      drag.homeR = bean.r;
    }
  });

  cv.addEventListener('pointerup', function(e){
    if (!drag) return;
    var d = drag;
    drag = null;
    try { cv.releasePointerCapture(e.pointerId); } catch (err) {}
    if (d.moved){
      /* 松手即回弹：把目标位还成按下时的快照，珠子自己滑回去。
         拖动不改变布局，只是临时挪开看一眼 —— 所以这里不重算 packItems。 */
      cv.style.cursor = d.bean ? 'grab' : 'default';
      if (d.bean){
        d.bean.gy = 0; d.bean.gv = 0;
        spawnRipple(d.bean.x, d.bean.y, d.bean.r * 0.8, 0.45);
      }
      restoreHome(d);
      return;
    }
    tapHit(d.hit);                     /* 没位移 → 当作点击 */
  });

  cv.addEventListener('pointercancel', function(){
    if (drag && drag.moved) restoreHome(drag);   /* 被打断也回弹，别把圆留在半路 */
    drag = null;
    cv.style.cursor = 'default';
  });

  /* 指针在画布外松开、或者直接切走了窗口 —— 兜一下。
     画布这时收不到 pointerup，drag 会一直挂着：那颗圆永远跟着鼠标走，
     松手本该做的还原也没人做，屏幕上就留下一颗顶着别人的圆。
     嵌入在 webview / iframe 里时 setPointerCapture 不一定生效，这不是理论风险。 */
  function dropDrag(){
    if (!drag) return;
    var d = drag;
    drag = null;
    cv.style.cursor = 'default';
    if (d.moved && d.bean){
      d.bean.gy = 0; d.bean.gv = 0;
      restoreHome(d);
    }
  }
  window.addEventListener('pointerup', dropDrag);
  window.addEventListener('pointercancel', dropDrag);
  window.addEventListener('blur', dropDrag);

  /* ---- 右键菜单 ---- */
  cv.addEventListener('contextmenu', function(e){
    e.preventDefault();
    var hit = hitTest(e.clientX, e.clientY);
    showCtx(e.clientX, e.clientY, (hit && hit.kind === 'bead') ? hit.bean : null);
  });

  /* 树图的右键：命中某一行就带上它的名称与路径，点在空白处两项置灰 */
  twBox.addEventListener('contextmenu', function(e){
    e.preventDefault();
    var el = e.target, cls;
    while (el && el !== twBox){
      cls = el.className || '';
      if (typeof cls === 'string' && /(^|\s)trow(\s|$)/.test(cls)) break;
      el = el.parentNode;
    }
    if (!el || el === twBox){
      showCtxTree(e.clientX, e.clientY, '', '');
      return;
    }
    var key = el.getAttribute('data-k');
    var node = key ? treeNodeMap[key] : null;
    /* keyPath 首段就是栏位：左栏从 'd' 起（disk），右栏从 'm' 起（资料库）。
       复制路径要按栏区分含义，所以这个必须传下去。 */
    var side = !key ? '' : ((key === 'd' || key.indexOf('d/') === 0) ? 'disk' : 'lib');
    /* 交给菜单的 node 是「就近有磁盘身份的那一颗」：
       回合/步骤行自己没有 sid，借所属会话的，这样每一行都点得开。
       显示名仍用本行自己的，不受影响。 */
    var own = key ? diskOwnerOfKey(key) : null;
    showCtxTree(e.clientX, e.clientY, node ? dispName(node) : '', treePath(key), own || node, side, key);
  });

  ctxEl.addEventListener('mousedown', function(e){
    e.preventDefault();
    e.stopPropagation();
    var el = e.target;
    while (el && el !== ctxEl && el.tagName !== 'I' && el.tagName !== 'B') el = el.parentNode;
    if (!el || el === ctxEl) return;
    if (el.tagName === 'B'){                 /* 主题三连：只切选中态，菜单留着不关 */
      setTheme(el.getAttribute('data-theme'));
      return;
    }
    if ((el.className || '').indexOf('off') >= 0) return;
    ctxAct(el.getAttribute('data-act'));
  });

  /* 二级菜单的悬停：指向「新增数据源」就展开，指向别的项就收起 ——
     和系统菜单一样，不用先点一次才知道里面有什么。 */
  ctxEl.addEventListener('mouseover', function(e){
    var it = ctxEl.querySelector('i.sub');
    if (it && it.contains(e.target)){ openSrcSub(); return; }
    closeSub();
  });
  /* 离开父菜单不立刻收：指针要斜着穿过接缝才能落到二级上，
     留 200ms 给它走这一段，否则总是差半帧、点不中。 */
  ctxEl.addEventListener('mouseleave', function(){ subLater(200); });

  /* 二级自己的点击：和父菜单同一套派发（off 项不响应） */
  ctx2El.addEventListener('mousedown', function(e){
    e.preventDefault();
    e.stopPropagation();
    var el = e.target;
    while (el && el !== ctx2El && el.tagName !== 'I') el = el.parentNode;
    if (!el || el === ctx2El) return;
    if ((el.className || '').indexOf('off') >= 0) return;
    ctxAct(el.getAttribute('data-act'));
  });
  ctx2El.addEventListener('mouseenter', subKeep);
  ctx2El.addEventListener('mouseleave', function(){ subLater(120); });

  /* 拖调参面板：跟着指针走，四边留 8px 不让它跑出屏幕 */
  window.addEventListener('mousemove', function(e){
    if (!tuneDrag) return;
    var w = tuneEl.offsetWidth, hh = tuneEl.offsetHeight;
    var l = e.clientX - tuneDrag.dx, t = e.clientY - tuneDrag.dy;
    l = Math.min(Math.max(8, l), Math.max(8, window.innerWidth - w - 8));
    t = Math.min(Math.max(8, t), Math.max(8, window.innerHeight - 40));
    tuneEl.style.left = l + 'px';
    tuneEl.style.top = t + 'px';
  });
  window.addEventListener('mouseup', function(){
    if (!tuneDrag) return;
    tuneDrag = null;
    if (tuneEl.className.indexOf('on') >= 0) tuneEl.className = 'on';
  });

  document.addEventListener('mousedown', function(e){
    if (ctxEl.className && !ctxEl.contains(e.target) && !ctx2El.contains(e.target)) hideCtx();
    /* 调参面板：点空白处收起，但点菜单里的「调参」不算（那一层已经 stopPropagation） */
    if (tuneEl && tuneEl.className && !tuneEl.contains(e.target)) closeTune(false);
  });
  /* 断库的二次确认：点了别处就当放弃。放在 click（不是 mousedown）——
     否则同一轮点击里 mousedown 先把状态清掉，click 又当成第一次点，永远确认不了。 */
  document.addEventListener('click', function(e){
    if (!delPending) return;
    if (e.target.closest && e.target.closest('[data-del]')) return;
    delPending = '';
    if (MODE === 'tree') drawTrees();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' || e.keyCode === 27){ hideCtx(); closeTune(true); }
    /* 面板开着时回车等于点「确定」，默认按钮该有的行为 */
    if ((e.key === 'Enter' || e.keyCode === 13) && tuneEl && tuneEl.className.indexOf('on') >= 0){
      closeTune(false);
    }
  });

  crumb.addEventListener('click', function(e){
    var t = e.target;
    if (t.tagName !== 'B') return;
    var di = t.getAttribute('data-i');
    if (di === null) return;   /* 占位说明文字不是层级，别当路径跳 */
    if (di === '-1'){ switchSource(''); return; }
    setFocus(parseInt(di, 10));
  });

  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){
      expanded = false; openGroups = {}; sync();
    }
    /* 性能角标：Shift+P 随时开关，不用去改地址栏。
       平时 PERF=false，所有记账调用都被那一行 if 挡掉，零成本；
       打开的那一刻起才开始计数，所以它不是一个常驻的计时器 ——
       想看「刚才那一下为什么卡」，就在卡完之前把它打开。 */
    if (e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey
        && (e.key === 'P' || e.key === 'p' || e.keyCode === 80)){
      e.preventDefault();
      PERF = !PERF;
      if (PERF){
        pfStat.t0 = 0; pfStat.t1 = 0; pfStat.frames = 0;
        pfStat.fn = 0; pfStat.fi = 0;
        pfStat.packN = 0; pfStat.syncN = 0; pfStat.liveN = 0;
        pfStat.fMax = 0; pfStat.p50 = 0; pfStat.p99 = 0; pfStat.max = 0;
        pfShow();
      } else if (pfStat.box){
        pfStat.box.parentNode.removeChild(pfStat.box);
        pfStat.box = null;
      }
    }
  });

  window.addEventListener('resize', function(){
    clearTimeout(window.__rt);
    window.__rt = setTimeout(resize, 120);
  });

  /* ---------------- 启动 ---------------- */

  resize();
  if (root){
    weigh(root);
    path = [root];
    var m = /s=(\d)/.exec(location.hash);
    if (m && +m[1] >= 1) expanded = true;
    if (m && +m[1] >= 2){
      var first = root.children[0];
      path = [root, first];
      expanded = true;
    }
  }
  drawCrumb();
  sync();

  if (LIVE){
    lvBox.className = 'on';
    adBox.className = 'on';

    /* 点空白处进输入态；点面包屑上的层级是跳转，不进 */
    adBox.addEventListener('click', function(e){
      var t = e.target;
      if (t.tagName === 'B' && t.getAttribute('data-i') !== null) return;   /* 面包屑层级 */
      if (t === qxEl) return;                                               /* × 自己处理 */
      if (adFocused){
        /* 已经聚焦时再点空白：重新全选整条路径；点输入框内部不抢，允许正常定位光标 */
        if (t !== qEl){ qEl.focus(); try { qEl.select(); } catch (err) {} }
        return;
      }
      adFocus();
    });

    /* ×：唯一会“全部删除”的入口，点别处不会清空 */
    qxEl.addEventListener('mousedown', function(e){ e.preventDefault(); });
    qxEl.addEventListener('click', function(e){
      e.stopPropagation();
      qEl.value = '';
      qList.className = '';
      qList.__hits = null;
      qEl.focus();
    });
    qEl.addEventListener('input', function(){
      clearTimeout(qTimer);
      qTimer = setTimeout(qRun, 130);
    });
    qEl.addEventListener('keydown', function(e){
      if (e.key === 'Escape'){ qEl.value = ''; qList.className = ''; adBlur(); }
      if (e.key === 'Enter' && qList.__hits && qList.__hits.length) qJump(qList.__hits[0]);
    });
    /* 下拉里按下鼠标时不要先失焦，否则列表先被清空、点击落空 */
    qList.addEventListener('mousedown', function(e){ e.preventDefault(); });
    qList.addEventListener('click', function(e){
      var d = e.target.closest ? e.target.closest('div[data-i]') : null;
      if (!d || !qList.__hits) return;
      var h = qList.__hits[+d.getAttribute('data-i')];
      if (h) qJump(h);
    });

    /* 第一行：三种呈现方式 */
    var mbtns = mdBox.getElementsByTagName('b');
    for (var mi = 0; mi < mbtns.length; mi++){
      mbtns[mi].addEventListener('click', function(){
        var m = this.getAttribute('data-m');
        if (m === MODE){
          /* 已经在这个模式上，再点一下＝重新开始，而不是没反应 */
          if (m === 'rain'){
            rainAgain();                                  /* 再下一场雨（O(n)） */
            liveSeq = -1; liveReady = false; intoDone = false;
            livePull();                                   /* 顺便把数据重拉一遍 */
          } else {
            treeLoaded = false; treePull();
          }
          return;
        }
        MODE = m;
        try { location.hash = (m === 'rain' ? 'view=' + VIEW : 'mode=' + m); } catch (e) {}
        modeSync();
        if (MODE === 'rain'){
          path = [root]; liveSeq = -1; liveReady = false; intoDone = false;
          rainAgain();                                    /* 从树图切回来也重新下 */
          /* 落到树图里选中的那一层。要换库时 applyAddr 自己会发请求，
             这里就不要再补一次 —— 两个请求并发回来会互相盖掉对方的树。 */
          var src0 = SOURCE;
          if (curAddr) applyAddr(curAddr);
          if (SOURCE === src0) livePull();
        }
      });
    }

    tbdEl.addEventListener('click', onTreeClick);
    tbmEl.addEventListener('click', onTreeClick);
    tbdEl.addEventListener('mouseover', onTreeHover);
    tbmEl.addEventListener('mouseover', onTreeHover);
    tbdEl.addEventListener('mouseleave', clearLink);
    tbmEl.addEventListener('mouseleave', clearLink);
    tbdEl.addEventListener('scroll', function(){ onColScroll('d', tbdEl, tbmEl); });
    tbmEl.addEventListener('scroll', function(){ onColScroll('m', tbmEl, tbdEl); });
    document.addEventListener('click', function(e){
      if (adFocused && !adBox.contains(e.target)) adBlur();
    });
    modeSync();
    livePull();
    liveTimer = setInterval(livePull, 1500);
    window.addEventListener('beforeunload', function(){ clearInterval(liveTimer); });
  } else if (location.protocol === 'file:'){
    /* 双击 html 直接打开 = 没有服务 = 只能画 data.js 里的演示数据。必须喊出来，别让人当成真的 */
    var warn = document.createElement('div');
    warn.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);'
      + 'z-index:99;background:var(--panel-solid);color:var(--ink);padding:20px 24px;border-radius:12px;'
      + 'font:13px/1.9 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;'
      + 'max-width:400px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.22)';
    warn.innerHTML = '你打开的是本地文件，不是服务。<br>'
      + '<span style="color:var(--muted)">背后画的只是 data.js 里的演示数据，不是你的会话。</span>'
      + '<div style="margin:14px 0 6px;color:var(--accent);font-weight:500">请访问 http://127.0.0.1:7788/</div>'
      + '<span style="color:var(--muted)">或双击同一层文件夹里的启动脚本（Windows 是那个 .bat，macOS / Linux 是 start.sh）</span>';
    document.body.appendChild(warn);
  } else {
    /* http 打开却没连上：服务刚挂了，或者这个端口上不是自己。
       胶囊不能再挂着「连接中…」——那会让人一直等一个不会来的东西。 */
    lvBox.className = 'on off';
    lvText.innerHTML = '<b>演示数据</b> <s>·</s> 服务没连上';
  }
  /* 主题：先用上次的选择铺上，避免亮色闪一下再变深。
     这里用 applyTheme 而不是 setTheme —— 首帧没有「旧样子」可淡出，
     挂过渡类反而会让首次绘制带着一段无意义的动画。
     不监听系统外观 —— 这套 UI 里主题是用户自己点出来的，不该被系统改掉。 */
  var savedTheme = 'blue';
  try { savedTheme = localStorage.getItem('rd-theme') || 'blue'; } catch (e) {}
  applyTheme(savedTheme);

  if (location.hash.indexOf('openall') >= 0){
    var any = false;
    for (var z = 0; z < beans.length; z++) if (beans[z].group){ openGroups[beans[z].key] = true; any = true; }
    if (any) sync();
  }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
