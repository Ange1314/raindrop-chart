         t = (ln(w+1) - ln(wmin+1)) / (ln(wmax+1) - ln(wmin+1))
         r = R_MIN * (R_MAX/R_MIN)^t
       于是**面积比恒定**（不随数据极差变化），大圆小圆分得清但不会失控。
       后端 weights.py 里有同一套公式（那边算 w，这边算半径）。 */
    var R_MIN = 26, R_MAX = 141;
    var wMin = Infinity, wMax = 0;
    for (i = 0; i < kids.length; i++){
      var wi = weigh(kids[i]);
      if (wi < wMin) wMin = wi;
      if (wi > wMax) wMax = wi;
    }
    if (!isFinite(wMin)) wMin = 0;
    if (wMax <= wMin) wMax = wMin + 1;
    var lnLo = Math.log(wMin + 1), lnHi = Math.log(wMax + 1);
    var ratio = R_MAX / R_MIN;
    var radiusOf = function (w){
      var t = (Math.log(Math.max(0, w) + 1) - lnLo) / (lnHi - lnLo);
      if (t < 0) t = 0; else if (t > 1) t = 1;
      return R_MIN * Math.pow(ratio, t);
    };

    /* 气泡云的外接半径上限 + 单位半径换算（面积正比于权重）。
       扣掉顶部两行按钮和底部提示，别让气泡顶到控件上。 */
    var avail = Math.min(W - 80, H - 190);
    var limit = Math.max(120, avail) * 0.45;
    var S = limit / 1.18;

    var items = [];
    for (i = 0; i < kids.length; i++){
      var w0 = weigh(kids[i]);
      items.push({
        /* key 用地址而不是行号：关掉一层的瞬间，后面的行号会整体前移，
           按行号做 key 会让剩下的圆全部「重新出生」一次。 */
        key: 'n:' + (kids[i].__addr || ('#' + i)) + ':' + kids[i].name,
        node: kids[i],
        group: null,
        w: w0,
        label: kids[i].name || '',
        r: Math.max(1, radiusOf(w0))
      });
    }

    /* 只合并小到点不中的：堆积没有圆周容量限制，不再按“装不下”硬并。
       跟谁合看“像不像”（名字相近 / 同族），不再只认左右邻居。

       ⚠️ 原来的 guard=400 是个硬上限，在超大会话上不够用：
       实测「路娜」会话有 2340 个回合，400 轮只压掉 400 个（合并率 17%），
       剩下 1940 颗珠子塞进一屏 → packItems 要算 11 秒 → 浏览器直接卡死。
       现在改成**时间预算**：合并是 O(n²/轮)，n 越大每轮越贵，
       所以给一个固定的毫秒上限（而不是轮数上限），到点就停。
       剩下的交给下一档：超过同屏上限时，粗合并兜底（见下方 foldOvers）。 */
    var rRead = Math.max(15, Math.min(W, H) * 0.022);
    var guard = 0;
    var skip = {};        /* 判过“没人像”的，跳过它，但别挡住别人 */
    var mergeT0 = (window.performance && performance.now) ? performance.now() : Date.now();
    var MERGE_BUDGET = 260;   /* 合并最多花这么久（毫秒）—— 超时就不合了 */
    var MERGE_ROUND = 4000;    /* 轮数上限只作为兜底，正常不会碰到 */
    while (guard++ < MERGE_ROUND && items.length > 1){
      /* 时间预算检查：每 16 轮查一次（查 performance.now 本身有开销） */
      if ((guard & 15) === 0){
        var nowMs = (window.performance && performance.now) ? performance.now() : Date.now();
        if (nowMs - mergeT0 > MERGE_BUDGET) break;
      }
      var si = -1, sv = Infinity, kk;
      for (kk = 0; kk < items.length; kk++){
        if (skip[items[kk].key]) continue;
        if (items[kk].r < sv){ sv = items[kk].r; si = kk; }
      }
      if (si < 0) break;
      if (sv >= rRead) break;

      /* 跟谁合：在同一个父体里挑“最像的一个”，不再只认左右邻居。
         打分 = 名字相近 ×2 + 同族 1.2 + 位置相邻 0.5 */
      function famOf(it){
        if (!it) return null;
        var n = it.group ? it.group[0] : it.node;
        return (n && (n.family || n.tool)) || null;
      }
      var pick = -1, best = -1e9, fa = famOf(items[si]), bestSim = 0;
      for (kk = 0; kk < items.length; kk++){
        if (kk === si) continue;
        var sc = 0;
        var fb = famOf(items[kk]);
        var sim = nameSim(items[si].label, items[kk].label);
        if (fa && fb && fa === fb) sc += 1.2;
        sc += sim * 2;
        if (Math.abs(kk - si) === 1) sc += 0.5;
        if (sc > best){ best = sc; pick = kk; bestSim = sim; }
      }
      /* 没有“像”的对象就别硬并 —— 一颗独立的小圆，好过一颗乱拼的合并珠。
         注意要 continue 而不是 break：这颗不合并，别把后面能合的也掐掉。 */
      if (pick < 0 || (bestSim < 0.5 && !(fa && famOf(items[pick]) === fa))){
        skip[items[si].key] = 1;
        continue;
      }

      var a = items[si], b = items[pick];
      var merged = {
        key: 'g:' + (a.group ? a.key : a.node.name) + '|' + (b.group ? b.key : b.node.name),
        node: null,
        group: (a.group || [a.node]).concat(b.group || [b.node]),
        w: a.w + b.w,
        label: a.label,
        r: Math.max(rRead, Math.sqrt(a.r * a.r + b.r * b.r))
      };
      var lo = Math.min(si, pick);
      items = items.filter(function(x, idx){ return idx !== si && idx !== pick; });
      items.splice(lo, 0, merged);
    }

    /* ===== 同屏上限兜底 =====
       实测（1078×600 画布）：物理布局是 O(n²)，
         n=120 → 82ms 流畅 ｜ n=300 → 365ms 明显卡 ｜ n=600 → 1.1s 卡死 ｜ n=2340 → 11s 完全卡死
       所以同屏珠子数必须有上限。超了就把**尾部最小的那些**折成一颗「其余 N 项」——
       不是丢掉它们（它们还在 group 里，点开能看到），只是先收起来。
       保留权重最大的 MAX_ON_SCREEN 颗，其余打包成一颗聚合珠。 */
    var MAX_ON_SCREEN = 150;
    if (items.length > MAX_ON_SCREEN){
      /* 按半径排序（大圆在前），把后面的折起来 */
      var byR = items.slice().sort(function(a, b){ return b.r - a.r; });
      var keep = byR.slice(0, MAX_ON_SCREEN - 1);
      var rest = byR.slice(MAX_ON_SCREEN - 1);
      var restW = 0, restMembers = [];
      for (i = 0; i < rest.length; i++){
        restW += rest[i].w;
        if (rest[i].group) restMembers = restMembers.concat(rest[i].group);
        else restMembers.push(rest[i].node);
      }
      var fold = {
        key: 'g:__rest__' + items.length,
        node: null,
        group: restMembers,
        w: restW,
        label: '其余 ' + restMembers.length + ' 项',
        r: Math.max(rRead, Math.sqrt(
            rest.reduce(function(s, x){ return s + x.r * x.r; }, 0)))
      };
      keep.push(fold);
      /* 按原顺序摆回去（保持流程流向的视觉顺序） */
      var kept = {};
      for (i = 0; i < keep.length; i++) kept[keep[i].key] = 1;
      items = items.filter(function(x){ return kept[x.key]; });
      items.splice(Math.min(items.length, MAX_ON_SCREEN - 1), 0, fold);
    }

    /* 展开过的合并珠子：成员直接进池，宿主圆让位 */
    var flat = [], j;
    for (i = 0; i < items.length; i++){
      var it0 = items[i];
      if (it0.group && openGroups[it0.key]){
        for (j = 0; j < it0.group.length; j++){
          flat.push({
            key: 'm:' + it0.key + ':' + j,
            node: it0.group[j], group: null,
            w: weigh(it0.group[j]),
            label: it0.group[j].name || ''
          });
        }
      } else {
        flat.push(it0);
      }
    }
    items = flat;

    /* 展开下级：这一层的其他兄弟全部拿掉，只留它；它自己的子体也摊到同一层，
       用虚线连回父圆 —— 不另做嵌套布局，复用现有平铺算法，层级感靠那根虚线。
       找不到它就说明已经换了层，自动解除，免得卡在一个空的过滤条件上。 */
    if (branchNode){
      var only = null, bi;
      for (bi = 0; bi < items.length; bi++){
        if (items[bi].node === branchNode){ only = items[bi]; break; }
      }
      if (only){
        var subs = only.node.children || [];
        if (subs.length){
          var out = [only];
          for (bi = 0; bi < subs.length; bi++){
            out.push({
              key: 'sub:' + bi + ':' + (subs[bi].name || ''),
              node: subs[bi],
              group: null,
              /* 子体权重打折：全额参与平铺的话，子体一多就把父圆挤成一个小点，
                 看不出「这些是谁的下级」了 */
              w: weigh(subs[bi]) * 0.6,
              label: subs[bi].name || '',
              r: 1,
              lane: true,          /* drawBeans 会给 lane 项画一根虚线到 hostKey */
              hostKey: only.key,
              sub: true
            });
          }
          items = out;
        } else {
          items = [only];          /* 末端节点，没有下级可摊 */
        }
      } else branchNode = null;
    }

    /* 半径按最终权重重算，再交给堆积。
       用的是**和雨滴视图同一套对数配平**（见 buildItems 里的 radiusOf）——
       两个视图如果各用一套半径公式，同一个东西在两处看起来大小不同，没法对比。
       这里局部重算一份：树图的 items 可能被拆过（只保留末端节点），w 的极差与原层不同。 */
    var tot2 = 0;
    for (i = 0; i < items.length; i++) tot2 += items[i].w;
    if (!tot2) tot2 = 1;
    var tMin = Infinity, tMax = 0;
    for (i = 0; i < items.length; i++){
      if (items[i].w < tMin) tMin = items[i].w;
      if (items[i].w > tMax) tMax = items[i].w;
    }
    if (!isFinite(tMin)) tMin = 0;
    if (tMax <= tMin) tMax = tMin + 1;
    var tLo = Math.log(tMin + 1), tHi = Math.log(tMax + 1);
    var tRatio = 141 / 26;
    for (i = 0; i < items.length; i++){
      var tt = (Math.log(Math.max(0, items[i].w) + 1) - tLo) / (tHi - tLo);
      if (tt < 0) tt = 0; else if (tt > 1) tt = 1;
      items[i].r = Math.max(14, 26 * Math.pow(tRatio, tt));
    }

    /* 数据一个字没变就别重排：packItems 是 O(n²×迭代)，一百个圆要一百多毫秒。
       指纹 = 画布尺寸 + 圆数 + 每个圆的 key 和半径（取到 0.1px）。
       尺寸变（resize）、层级变（key 全换）、权重变（半径变）都会让指纹不同，
       只有"同一批圆、同样大小、同样画布"才会命中，这时候位置本来就不会变。 */
    var sig = W + 'x' + H + '|' + items.length + '|';
    for (i = 0; i < items.length; i++){
      sig += items[i].key + ':' + Math.round(items[i].r * 10) + ';';
    }

    /* 少量子体（≤6 颗）固定摆成正多边形。
       packItems 是按「把椭圆铺满」设计的 —— 3 颗圆会长到两百多半径、
       在扁椭圆里必然被顶出上下边界（实测第三颗跑到 y=-171，屏幕外）。
       2 颗更夸张，直接撑满半个屏幕。
       这里不走它：位置可预测，宽屏窄屏都不用重算。 */
    if (kids.length >= 1 && kids.length <= 6){
      placeSources(items);
      lastLayoutSig = sig;
      lastBuildSig = bs; lastBuildOut = items;
      return items;
    }

    if (sig !== lastLayoutSig || !reuseLayout(items)){
      packItems(items, CX, CY + 24);
      lastLayoutSig = sig;
    }
    lastBuildSig = bs; lastBuildOut = items;
    return items;
  }

  /* 根层的固定摆位：正多边形，首颗在正上方，依次顺时针。
     半径只跟屏幕短边有关，不跟权重走 —— 库与库之间是「入口」关系，
     谁大谁小不重要，一眼能点中才重要。 */
  /* 库这一层（顶级目录里那几颗珠子）的半径 —— **按绝对刻度算**。

     不能套 max(14, S√(w/Σw)) 那套归一化：归一化等于「占本层总和的比例」，
     于是你加一个新库，所有老库的圆一起缩水一圈。库是导航入口，
     它的尺寸应该只跟自己的体量有关。

     n = 这个库的叶子总数（跨库唯一口径统一的量）。
     常数来自 V0 会话的推演：N₀=20 是「一个小示例库」的锚点，
     β=0.103 由「真实极差 ~1900 倍 → 直径 2.2 倍」反解。
     直径范围 0.184×min ~ 0.34×min，既放得下库名，也不至于吞屏。 */
  function srcRadius(n){
    var base = Math.min(W, H);
    var RMIN = base * 0.092, RMAX = base * 0.17;
    var N0 = 20, BETA = 0.103;
    var r = RMIN * Math.pow(Math.max(1, n || 1) / N0, BETA);
    return Math.max(RMIN, Math.min(RMAX, r));
  }

  function placeSources(items){
    var n = items.length, i;
    /* 这一层是固定摆位，不走 packItems，但拖动时的推挤（relaxAll）要用椭圆参数
       算「能推到哪儿」。不在这儿设一份的话，它用的还是上一次 packItems 留下的
       值 —— 刚打开页面时甚至是初始的 (0,0) / 1×1，一拖所有圆都被硬拽到左上角。 */
    packCX = CX; packCY = CY;
    packRX = Math.max(60, W / 2 - 40);
    packRY = Math.max(60, H / 2 - 50);
    packSoft = 1;
    /* 只有两个库时左右摆：屏幕是宽的，上下摆会留出两条大空白。 */
    /* 只有一颗时不铺圆周：n===1 走 ang=0，会被摆到圆心正右方 R 处，
       整块图偏到一边看起来像没对齐。一颗就老老实实放正中间。 */
    var R  = (n === 1) ? 0
           : (n === 2) ? Math.min(W * 0.22, H * 0.30) : Math.min(W * 0.30, H * 0.26);
    /* 基准半径按颗数收：6 颗还按 4 颗的尺寸画，圆周上会挤成一圈 */
    var base = Math.min(W, H) * (n <= 2 ? 0.115 : n <= 4 ? 0.095 : 0.075);
    /* 保留权重的相对大小 —— 全画成一样大，就看不出 Hello 和 H 的区别了。
       归一化到「最大那颗 = base」，最小的压到 0.5 倍，差距不至于悬殊到看不见。 */
    /* 库这一层已经由 srcRadius() 按绝对刻度算好，别再用 maxR 归一化 */
    var isSrc = !!(items[0] && items[0].node && items[0].node.kind === 'src');
    var maxR = 1;
    for (i = 0; i < n; i++) maxR = Math.max(maxR, items[i].r || 1);
    for (i = 0; i < n; i++){
      var ang = (n === 1) ? 0
              : (n === 2) ? (i === 0 ? Math.PI : 0)
              : (-Math.PI / 2 + i * TAU / n);
      var rr = isSrc ? srcRadius(items[i].node && items[i].node.n)
                     : base * Math.max(0.5, (items[i].r || 1) / maxR);
      items[i].r   = rr;
      items[i].tr  = rr;
      items[i].tx  = CX + Math.cos(ang) * R;
      items[i].ty  = CY + Math.sin(ang) * R + 8;
      items[i].ang = ang;
    }
  }

  /* 把上一轮的落点抄回来。key 对不上就返回 false，调用方会退回全量重排。 */
  function reuseLayout(items){
    var m = {}, i, b;
    for (i = 0; i < beans.length; i++) m[beans[i].key] = beans[i];
    for (i = 0; i < items.length; i++) if (!m[items[i].key]) return false;
    for (i = 0; i < items.length; i++){
      b = m[items[i].key];
      items[i].tx = b.tx;
      items[i].ty = b.ty;
      /* 必须用 b.tr（packItems 长大之后的最终半径），
         不能用 items[i].r（那是长大前的初始值），否则圆会缩一圈。 */
      items[i].tr = b.tr;
      items[i].ang = b.ang || 0;
    }
    return true;
  }

  /* 气泡堆积：重叠就推开、贴到边界就收拢，跑到边缘贴合为止（初版的规则） */
  /* 一次"沉降"：推离重叠 + 沿径向拉回椭圆边界，两种约束交替迭代。
     分开做会互相打架（收边界把圆挤重叠，推离又把圆顶出界），交错才会收敛。

     soft = 边界松紧倍数。1 = 严格不越界；>1 = 允许圆溢出到「soft 倍椭圆」以内。
     为什么要有它：屏幕窄的时候椭圆就那么点大，硬边界会把圆压得互相叠上。
     与其硬压，不如让它溢出一点 —— 溢出的圆照样有引力（越远拉得越狠），
     不会飞走，只是不再被硬顶回来。 */
  function settle(order, cx, cy, rx, ry, iters, soft){
    var n = order.length;
    var PUSH = 0.55, PULL = 0.7;
    if (!soft || soft < 1) soft = 1;
    var i, j, iter, it, dx, dy, d, ux, uy, Rb, over;

    for (iter = 0; iter < iters; iter++){
      var moved = 0;

      for (i = 0; i < n; i++){
        var a = order[i];
        for (j = i + 1; j < n; j++){
          var b = order[j];
          dx = b.x - a.x; dy = b.y - a.y;
          var need = a.r + b.r + 2.0;
          var d2 = dx * dx + dy * dy;
          if (d2 >= need * need) continue;
          d = Math.sqrt(d2);
          if (d < 0.01){ dx = 0.01 * (j - i); dy = 0.01; d = 0.02; }
          var push = (need - d) / d * PUSH;
          ux = dx * push; uy = dy * push;
          var ma = a.r * a.r, mb = b.r * b.r, sw = ma + mb;
          a.x -= ux * (mb / sw); a.y -= uy * (mb / sw);
          b.x += ux * (ma / sw); b.y += uy * (ma / sw);
          moved++;
        }
      }

      for (i = 0; i < n; i++){
        it = order[i];
        dx = it.x - cx; dy = it.y - cy;
        d = Math.sqrt(dx * dx + dy * dy);
        if (d < 1e-6) continue;
        ux = dx / d; uy = dy / d;
        Rb = 1 / Math.sqrt((ux / rx) * (ux / rx) + (uy / ry) * (uy / ry)) * soft;

        /* 圆心不许跑出屏幕。圆本身可以溢出（半个圆贴着边被裁掉，照样认得出来），
           但圆心一旦在屏外，这个圆就点不到、也拖不回来 —— 数据等于丢了。
           所以越界的天花板是「圆心贴到屏幕边」，到这儿还挤就交给外面的缩小逻辑。 */
        var lx = ux > 1e-6 ? (W - cx) / ux : (ux < -1e-6 ? -cx / ux : 1e9);
        var ly = uy > 1e-6 ? (H - cy) / uy : (uy < -1e-6 ? -cy / uy : 1e9);
        var lsc = Math.min(lx, ly) - it.r * 0.35;   /* 留一点，标题还能认出是谁 */
        if (lsc > 0 && Rb > lsc) Rb = lsc;

        over = d + it.r - Rb;
        if (over > 0){
          it.x -= ux * over * PULL;
          it.y -= uy * over * PULL;
          moved++;
        }
      }

      if (!moved) break;
    }
  }

  /* 把一堆圆铺满一个椭圆区域。
     圆是等比的，所以“铺满”= 所有人一起长大，比例不变 —— 面积仍正比权重。
     只撒点不改半径是填不满椭圆的：缝隙一多，贴合规则又会把它们挤回圆团。 */
  function packItems(items, cx, cy){
    var n = items.length;
    if (!n) return;
    var __pt = PERF ? pfT() : 0;

    var order = items.slice().sort(function(a, b){ return b.r - a.r; });
    var GA = Math.PI * (3 - Math.sqrt(5));
    var i, it, round;

    /* 目标区域＝椭圆：横向吃满屏宽，纵向吃满顶部按钮与底部提示之间的高度 */
    var rx = Math.max(80, (W - 80) / 2);
    var ry = Math.max(80, (H - 160) / 2);
    var rCap = Math.min(rx, ry) * 0.88;      /* 单个圆的直径上限（相对短半轴） */
    packCX = cx; packCY = cy; packRX = rx; packRY = ry;
    packSoft = 1;                            /* 先按严格边界试，装不下再放宽 */

    /* 播种：黄金角螺旋，直接按椭圆轴比撒，省得先成圆再说 */
    for (i = 0; i < n; i++){
      it = order[i];
      var u = n === 1 ? 0 : Math.sqrt(i / n) * 1.05;
      it.x = cx + Math.cos(i * GA) * u * rx * 0.7;
      it.y = cy + Math.sin(i * GA) * u * ry * 0.7;
    }

    var iters = n > 60 ? 70 : (n > 25 ? 110 : 180);
    var TARGET = 0.56;                        /* 椭圆里被圆盖住的比例 */

    /* 长大 → 沉降，循环到填满 */
    for (round = 0; round < 7; round++){
      settle(order, cx, cy, rx, ry, iters);

      var cov = 0;
      for (i = 0; i < n; i++) cov += order[i].r * order[i].r;
      cov = cov / (rx * ry);                  /* Σπr² ÷ π·rx·ry */
      if (cov >= TARGET) break;

      var f = Math.min(1.30, Math.sqrt(TARGET / Math.max(cov, 1e-4)));
      /* 长大的倍率必须全员一致，否则大圆被上限卡住、小圆继续长，
         “面积正比步数”就被悄悄改掉了。所以先用最大圆算出允许的倍率。 */
      var rmaxNow = order[0].r;
      if (rmaxNow * f > rCap) f = rCap / rmaxNow;
      if (f <= 1.001) break;
      for (i = 0; i < n; i++) order[i].r *= f;
    }

    /* 收尾：装不下时按「先溢出、再缩小」两级降级，绝不重叠。
       ① 边界分三档放松（1 → 1.15 → 1.30）：圆可以溢出到屏幕外一点，越界后照样
          有引力把它拉回来，只是不再被硬顶住。比例完全不动 —— 大小比例是用户
          认可的，所以这是首选。
       ② 放到最松还挤：全员等比缩小。等比缩放不改变任何比例关系，
          只是整体小一圈，「大圆小圆一眼分得开」依然成立。

       ⚠️ 这里绝对不能写成「每次缩 5% 再重排、循环二十几轮」：
       settle 是 O(n²×iters)，n=500 时一次就 30ms，二十几轮直接 1.6 秒，
       整个页面像死了一样。所以改成：边界三档各试一次，仍不行就按「最差那一对」
       把需要的缩放倍率一次算出来，最多再修 3 次。总 settle 次数 ≤ 6。 */
    var SOFT_MAX = 1.30;
    var soft = 1, worst = 1e9, wsum = 1, p;

    /* 量一遍最差间隙，顺手记下那一对的半径和 —— 算缩放倍率要用它 */
    function scanWorst(){
      var w = 1e9, sm = 1;
      for (var ia = 0; ia < n; ia++){
        var A = order[ia];
        for (var ib = ia + 1; ib < n; ib++){
          var B = order[ib];
          var ddx = B.x - A.x, ddy = B.y - A.y;
          var rs = A.r + B.r;
          var gp = Math.sqrt(ddx * ddx + ddy * ddy) - rs;
          if (gp < w){ w = gp; sm = rs; }
        }
      }
      wsum = sm;
      return w;
    }

    /* ① 边界三档。绝大多数层在第一档就结束了（一次 settle 就够）。 */
    var SOFT_STEPS = [1, 1.15, SOFT_MAX];
    for (var st = 0; st < SOFT_STEPS.length; st++){
      soft = SOFT_STEPS[st];
      settle(order, cx, cy, rx, ry, iters, soft);
      worst = scanWorst();
      if (worst > -1.0) break;
    }

    /* ② 最松还挤：按最差那一对算出倍率，一次缩到位。
       用解析倍率而不是固定 0.94 磨，是因为每磨一次都要重排一轮 settle。 */
    for (var gd = 0; gd < 3 && worst <= -1.0; gd++){
      var k = (wsum + worst - 2) / wsum;       /* 让最差那对刚好留 2px 缝 */
      if (!(k > 0.5)) k = 0.5;
      if (k > 0.99) k = 0.99;
      for (i = 0; i < n; i++) order[i].r *= k;
      settle(order, cx, cy, rx, ry, iters, soft);
      worst = scanWorst();
    }
    /* 记下最终用的边界松紧：拖动时的钳制要用同一个值，
       否则松手回弹到「严格椭圆」里，又把人挤成一堆。 */
    packSoft = soft;

    /* 横向铺开：竖向已经被最大的圆吃满，横向还剩空档。
       把 x 方向沿中心拉开，再用沉降修掉新挤出来的重叠，反复到接近椭圆轴比。
       拉开只会让缝变大不会造成重叠，所以这一步是安全的。

       但只在「边界没放宽」时才做：soft>1 说明本来就装不下、已经溢出，
       这时候再把圆往两边拉，会散得更开，跟「聚成一颗雨滴」相反。 */
    var wantAsp = rx / ry;
    for (round = 0; round < 5 && soft <= 1.001; round++){
      var bx0 = 1e9, bx1 = -1e9, by0 = 1e9, by1 = -1e9;
      for (i = 0; i < n; i++){
        it = order[i];
        bx0 = Math.min(bx0, it.x - it.r); bx1 = Math.max(bx1, it.x + it.r);
        by0 = Math.min(by0, it.y - it.r); by1 = Math.max(by1, it.y + it.r);
      }
      var bw = Math.max(1, bx1 - bx0), bh = Math.max(1, by1 - by0);
      if (bw / bh >= wantAsp * 0.92) break;

      var g = Math.min(1.22, Math.sqrt(wantAsp * bh / bw));
      var mcx = (bx0 + bx1) / 2;
      for (i = 0; i < n; i++) order[i].x = mcx + (order[i].x - mcx) * g;
      settle(order, cx, cy, rx, ry, iters, soft);
    }

    for (i = 0; i < n; i++){
      it = order[i];
      it.tx = it.x; it.ty = it.y; it.tr = it.r;
      it.ang = Math.atan2(it.y - cy, it.x - cx);
    }
    if (PERF){ pfStat.pack = pfT() - __pt; pfStat.packN++; }
  }

  /* 一颗珠子「刚出生」的样子。sync() 建新圆和 rainAgain() 重置都走这里 ——
     出生参数只维护一份，免得哪天加了字段漏掉一头，
     又变成「刷新页面丝滑、点雨图突兀」这种一半对一半不对的状态。 */
  function birthBean(b, i){
    b.x = CX; b.y = CY;                 /* 从画布中心出发，水平飞向各自目标位 */
    b.r = 0; b.a = 0;                   /* 零半径 + 零透明，长出来那一下才是渐进的 */
    b.ta = 1;
    /* 入场前那一下「弹起再落下」的初速度（负 = 向上）。
       300 + i*45 是定下来的观感：i 越大越晚落 —— 大圆先落、小圆后落，
       层级感就来自这个先后。**这个数不要动。**

       已知代价：深层最后几十颗会飞很高、滞空很久（i=150 时初速 -7000，
       重力 2600 下要 5.5 秒才落回，而屏幕只有 1019 高），
       那几秒画布上没有圆。这是用户看过取舍之后选择保留的，
       不是遗漏 —— 不要再自作主张加封顶、压缩系数或取模散列。 */
    b.gy = (LIVE && !SNAP) ? -(300 + i * 45 + Math.random() * 70) : 0;
    b.gv = 0;
  }

  /* 再下一场雨：把每颗珠子退回出生状态，布局（tx/ty/tr）原样留着。
     成本是一轮 O(n) 赋值，点多少次都不卡；
     packItems 完全不用跑 —— 圆的大小和落点都没变。 */
  function rainAgain(){
    for (var i = 0; i < beans.length; i++) birthBean(beans[i], i);
  }

  function sync(){
    /* 当前层随时跟着焦点走：树图切过来时读的就是这一个值 */
    curAddr = (path.length && focusNode() && focusNode().__addr) || '';
    var targets = buildItems();
    navTick();          /* 层级变了就写一条历史，侧键才有东西可退 */
    var seen = {};
    /* 先建 key -> bean 索引。原来每个 target 都要线性扫一遍 beans，
       72 个圆就是 72×72 = 5184 次字符串比较，每次轮询都跑。 */
    var byKey = {};
    var i;

    for (i = 0; i < beans.length; i++) byKey[beans[i].key] = beans[i];

    var pulsed = 0;
    for (i = 0; i < targets.length; i++){
      var t = targets[i];
      seen[t.key] = 1;
      var b = byKey[t.key] || null;
      if (!b){
        b = {
          key: t.key, node: t.node, group: t.group, w: t.w, lane: t.lane, hostKey: t.hostKey,
          tx: t.tx, ty: t.ty, tr: t.tr
        };
        birthBean(b, i);          /* 出生状态只由这一个函数决定，见下 */
        /* 出生本身就是「它来了」的反馈，不用再补一圈；
           标记留着的话会在后面某一帧突然冒出来，看着像无故闪一下。 */
        if (t.node){ delete t.node.__fresh; delete t.node.__pulse; }
        beans.push(b);
      } else {
        /* 这一颗刚有数据进来，就给它一圈和出生落地时完全相同的涟漪，
           位置和大小都不动，只是标记「这里更新了」。
           · 主判据是 __pulse：applyLive 顺着祖先链打上来的「这一支有新事件」。
             不能只靠半径 —— 半径按对数压过，加几百步可能只动 0.1px，
             永远够不到阈值，表现就是「对话在动、图一点反应都没有」。
           · 半径判据保留作为兜底：窗口缩放之类不经过 __pulse 的路径也能冒，
             但只在数据轮询刚刷过（pulseAt）的 400ms 内算，
             否则拖窗口会让几十颗一起冒圈，纯噪音。
           · 用此刻的 x/y/r 而不是目标值：万一它同时也在挪位，涟漪要从它现在所在的地方起。 */
        var pulse = !!(t.node && t.node.__pulse);
        if (!SNAP && (pulse || (Date.now() - pulseAt < 400 && Math.abs(t.tr - b.tr) > 0.2))){
          spawnRipple(b.x, b.y, b.r, 0.35 + Math.min(1, b.r / 60));
        }
        if (pulse){ pulsed++; delete t.node.__pulse; }

        b.node = t.node; b.group = t.group; b.w = t.w; b.lane = t.lane; b.hostKey = t.hostKey;
        b.tx = t.tx; b.ty = t.ty; b.tr = t.tr; b.ta = 1;
      }
      if (SNAP){ b.x = b.tx; b.y = b.ty; b.r = b.tr; b.a = 1; }
    }
    for (i = 0; i < beans.length; i++) if (!seen[beans[i].key]) beans[i].ta = 0;
    /* 更新发生在这一屏看不见的地方（打开的是会话、新数据还没装进来），
       就给中心那颗冒一圈 —— 否则「子体更新」传到这里就断了。
       有珠子已经冒过就不重复冒，免得一下两圈。 */
    var fn = focusNode();
    if (fn && fn.__pulse){
      delete fn.__pulse;
      if (!pulsed && !SNAP) spawnRipple(CX, CY, R0() * 0.72, 0.7);
    }
    /* 定态快照：没有动画帧可依赖，直接剔除退场的珠子 */
    if (SNAP){
      for (i = beans.length - 1; i >= 0; i--) if (!seen[beans[i].key]) beans.splice(i, 1);
    }
    /* 布局落地前把规则过一遍：任何两颗珠子的**目标位**都不许叠着。

       为什么必须有这一步：packItems 只在「输入指纹变了」时才重排，
       而数据更新最常见的形态是**半径变大、位置不动**（珠子一个没多，
       只是那颗的步数涨了 → tr 变大）。这时旧位置配新半径，
       原地就会压住邻居 —— 用户看到的就是「一更新就重叠」。

       ⚠️ 但它不能带 SHOVE_GAP。带缝的话，packItems 刚排好的每一对
       都算「重叠 2px」，于是每叫一次就整体撑开一圈，最后贴到椭圆边界 ——
       那才是「圆被拆成上下两团、中间空一大块」的真正来源。
       不加缝时，布局本身不重叠 → 第一轮扫描 hit=0 直接 break，
       一次都不推；只有真的被撑开了才动，而且只推到刚好不重叠。

       代价一次 O(n²) 扫描（n=150 约 0.1ms），只在布局真的变了的时候跑。 */
    relaxTargets();

    needsBuild = false;
    if (PERF) pfStat.n = beans.length;
  }

  /* ===== 拖动期间的全局不重叠（布局的核心规则，拖动时也不例外）=====
     任何两个圆都不许叠着。唯一区别：被手指按住的那个是「钉子」，
     位置由指针说了算，只能让对方让开；其余两两之间各让一半。
     一次完整遍历是 O(n²/2)：n=300 时约 45000 次距离判断（≈0.9ms），
     跑两遍 ≈1.8ms，在 16.7ms 的一帧里还有的是余量；圆特别多时降成一遍。
     tx/ty 和 x/y 一起改：只改 x/y 会被 step() 的缓动拽回去，两边打架会抖。
     这些改动都是临时的，松手时 restoreHome() 一次性还原。 */
  /* 拖动时的屏幕钳制：不许把圆拖出可视区。
     上下各留 80，和 packItems 的 `ry = (H-160)/2` 是同一个口径 ——
     上面那 80 躲胶囊按钮，下面那 80 躲「点开看圆圈…」那行提示。

     为什么只在拖动期间钳：松手后布局由 packItems 决定，它在装不下时会
     故意放松边界（packSoft 1.15/1.30）来换「不重叠」。那是布局的取舍，
     不该被拖动逻辑覆盖。但手指拖的时候，把一颗圆甩到屏幕外什么也看不见，
     那不是取舍，是丢了。 */
  function clampScreen(b){
    var r = b.r || 0;
    var x0 = r, x1 = W - r, y0 = 80 + r, y1 = H - 80 - r;
    /* 圆比可视区还大（超大工作区）：区间会反过来，钉在中间 */
    if (x0 > x1){ x0 = x1 = W / 2; }
    if (y0 > y1){ y0 = y1 = H / 2; }
    if (b.x < x0) b.x = x0; else if (b.x > x1) b.x = x1;
    if (b.y < y0) b.y = y0; else if (b.y > y1) b.y = y1;
  }

  function relaxAll(){
    var n = beans.length;
    if (n < 2) return;
    var passes = n > 600 ? 1 : 2;
    var pinned = (drag && drag.moved) ? drag.bean : null;
    var PUSH = 0.72;              /* 一次只解掉七成重叠，剩下的交给后续帧，看着像在流 */
    /* 单帧位移上限。密集区里两颗重叠几十像素，按 0.72 一帧就能推出十几像素，
       连着几帧就是「整层炸开、往外跑」。让开是必要的（否则被拖的那颗会压着人），
       但没必要一步到位 —— 限到 2.5px/帧，看着是慢慢让出一条道。 */
    var MAXSTEP = 2.5;
    var i, j, pass;

    for (pass = 0; pass < passes; pass++){
      var hit = 0;
      for (i = 0; i < n; i++){
        var a = beans[i];
        if (a.a < 0.05 || a.r < 0.5) continue;
        for (j = i + 1; j < n; j++){
          var b = beans[j];
          if (b.a < 0.05 || b.r < 0.5) continue;
          var dx = b.x - a.x, dy = b.y - a.y;
          var need = a.r + b.r + SHOVE_GAP;
          var d2 = dx * dx + dy * dy;
          if (d2 >= need * need) continue;
          var d = Math.sqrt(d2);
          if (d < 0.01){
            dx = 0.01 * (j - i + 1); dy = 0.012;
            d = Math.sqrt(dx * dx + dy * dy);
          }
          var over = (need - d) * PUSH;
          if (over > MAXSTEP) over = MAXSTEP;
          var ux = dx / d, uy = dy / d;
          if (a === pinned){
            b.x += ux * over; b.y += uy * over;
            b.tx += ux * over; b.ty += uy * over;
          } else if (b === pinned){
            a.x -= ux * over; a.y -= uy * over;
            a.tx -= ux * over; a.ty -= uy * over;
          } else {
            var hx = ux * over * 0.5, hy = uy * over * 0.5;
            a.x -= hx; a.y -= hy; a.tx -= hx; a.ty -= hy;
            b.x += hx; b.y += hy; b.tx += hx; b.ty += hy;
          }
          hit++;
        }
      }
      if (!hit) break;
    }

    /* 收尾：别让谁被挤出可用范围。只做一次近似钳制，代价 O(n)；
       拉回来可能又压到人，交给下一帧继续推。

       可用范围 = 椭圆 × packSoft：布局时放多松，拖动时就得放多松。
       这里原来用 `1 - r / packRX` 同时对 x、y 生效，是个错 —— 纵向按横向的
       尺度缩，窄屏（rx 远小于 ry）时纵向会被过早拉回中间，一堆圆挤成竖排。
       改成两个方向各按自己的轴内缩，才是真正的椭圆内切。 */
    for (i = 0; i < n; i++){
      var c = beans[i];
      if (c.a < 0.05) continue;
      /* 被按住那颗也钳：它跟着手指走，但同样不许出屏 */
      if (c === pinned){ clampScreen(c); continue; }
      var ex = c.x - packCX, ey = c.y - packCY;
      var arx = Math.max(4, packRX * packSoft - c.r);
      var ary = Math.max(4, packRY * packSoft - c.r);
      var q = Math.sqrt((ex / arx) * (ex / arx) + (ey / ary) * (ey / ary));
      if (q > 1){
        c.x = packCX + ex / q; c.y = packCY + ey / q;
        c.tx = c.x; c.ty = c.y;
      }
      /* 椭圆松到 1.15/1.30 时会比屏幕大，只按椭圆钳它们照样跑出去了 ——
         所以椭圆钳完再过一遍屏幕钳。顺序不能反：先椭圆保住形状，
         再屏幕兜住绝对边界。 */
      clampScreen(c);
      c.tx = c.x; c.ty = c.y;
    }
  }

  /* 松手复原：把所有人的目标位还成按下时的快照。
     布局结果压根没变（半径没动过），所以不需要再跑一次 packItems ——
     那才是松手一顿的根源（最坏 15 次全量 settle）。

     按 key 找快照：拖动期间珠子可能被增删（新数据进来 / 有珠子淡出），
     用下标对位会出现「张冠李戴」—— A 的位置还给了 B，出来就是一堆重叠。 */
  function restoreHome(d){
    if (!d.bean) return;      /* 拖的是空白或中心，没有谁的位置被改过，不用还原 */
    var snap = d.snap || {};
    var put = 0;
    for (var i = 0; i < beans.length; i++){
      var b = beans[i];
      if (b.pinned){
        /* 固定雨滴：目标位就设成它此刻的位置，停在拖到的地方不回归。
           它照样参与 relaxAll 的推挤，只是不再被拉回原处。 */
        b.tx = b.x;
        b.ty = b.y;
        continue;
      }
      var s = snap[b.key];
      if (!s) continue;                 /* 拖动期间新生的珠子，位置本来就干净 */
      b.tx = s[0];
      b.ty = s[1];
      put++;
    }
    /* 一个都对不上（整层被换掉了）或拖动期间来过新数据：只能老实重排一次。
       ⚠️ 这里必须把 buildItems 的两个缓存一起清掉。
       只清 lastLayoutSig 是白清 —— buildItems 第一行就按「输入指纹」直接把上一次
       的 items 还回去，压根走不到用 lastLayoutSig 的那段布局代码。
       表现就是：画面上明明有重叠、代码「调了 sync()」，却一颗圆都没动过。 */
    if (!put || needsBuild){
      lastLayoutSig = '';
      lastBuildSig = '';
      lastBuildOut = null;
      sync();
      /* 重排也不保证完美（同一批数据排两遍，第二遍就可能差几像素），
         所以两条路都以「目标位互不重叠」收尾，规则只在这里落一次地。 */
      relaxTargets();
      return;
    }
    /* 还原完再收一次尾：目标位之间不许有重叠。
       快照还原本身是不够的 —— 拖动期间出生的珠子不在快照里、
       key 变过的珠子对不上、固定珠还会压着别人。
       这一步只动目标位，所以只要「有点重叠」它就跑，代价是一次 O(n²) 扫描。 */
    relaxTargets();
  }

  /* 目标位之间的分离：只动 tx/ty，不碰 x/y，也不做椭圆钳制。
     为什么不借 relaxAll：那个函数量的是**此刻的位置**、并且连带改 x/y。
     松手那一刻珠子全在半路上，拿它来收目标位会把整层推散
     （实测：3 对重叠 → 1067 对）。两个场景要的是两件事，不能共用一套。
     为什么不用「重排一次」兜底：重排等于把这一层从头排一遍，用户刚才看的位置全变；
     而且实测在「刚拖完」这个状态下重排反而更差（92 对重叠，同一份数据在静止时重排是 0 对）。
     已经排好的层不该被推倒重来，差几像素推一推就够了。 */
  function relaxTargets(){
    var n = beans.length, i, j, pass, hit;
    if (n < 2) return;
    for (pass = 0; pass < 40; pass++){
      hit = 0;
      for (i = 0; i < n; i++){
        var a = beans[i];
        if (a.ta === 0 || a.pinned) continue;
        var ar = a.tr || a.r;
        if (ar < 2) continue;
        for (j = i + 1; j < n; j++){
          var b = beans[j];
          if (b.ta === 0 || b.pinned) continue;
          var br = b.tr || b.r;
          if (br < 2) continue;
          var dx = b.tx - a.tx, dy = b.ty - a.ty;
          /* 不加 SHOVE_GAP：这个函数是「松手后把重叠收掉」，
             不是「给每两颗之间塞一条缝」。加缝会让它和 packItems 的
             口径不一致，于是每叫一次就把整层撑大一点。 */
          var need = ar + br;
          var d2 = dx * dx + dy * dy;
          if (d2 >= need * need) continue;
          var d = Math.sqrt(d2);
          if (d < 0.01){ dx = 0.01 * (j - i + 1); dy = 0.012; d = Math.hypot(dx, dy); }
          var over = (need - d) * 0.5;           /* 两边各让一半，一次解掉一半 */
          var ux = dx / d, uy = dy / d;
          a.tx -= ux * over; a.ty -= uy * over;
          b.tx += ux * over; b.ty += uy * over;
          hit++;
        }
      }
      if (!hit) break;
    }
  }

  /* ===== 拖动时：空出来的位置让邻居滑进去 =====
     圆被手拖走，原位就秃了一块。把那个洞当成一个吸引源：离洞最近的邻居
     朝洞心滑过去占位，滑的过程中它挤到谁就把谁让开。
     松手时 restoreHome() 把所有目标位一次性还原，所以这一整段只是视觉流动。

     为什么只让「最近的那一个」动：如果让所有碰到洞的圆一起往里挤，
     它们会全部收敛到洞心叠成一坨。一个占位，多帧迭代就够了。 */
  function mendHole(dt){
    if (!drag || !drag.moved || !drag.bean) return;
    var vx = drag.homeX, vy = drag.homeY, vr = drag.homeR;
    var n = beans.length, i;
    var best = null, bestGap = 1e9, bd = 0;

    for (i = 0; i < n; i++){
      var b = beans[i];
      if (b === drag.bean || b.a < 0.05 || b.r < 0.5) continue;
      var dx = vx - b.x, dy = vy - b.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      var gap = d - b.r - vr;            /* 离洞表面还有多远，负数＝已经压进洞里了 */
      if (gap < bestGap){ bestGap = gap; best = b; bd = d; }
    }
    if (!best || bd < 0.5) return;
    if (bestGap > 90) return;            /* 太远就不硬拉，否则会看到一颗圆从屏幕那头飞过来 */

    /* 朝洞心走「剩余距离」的一个比例，指数收敛，永远不会冲过头 */
    var PULL = Math.min(0.45, dt * 3.4);
    var ux = (vx - best.x) / bd, uy = (vy - best.y) / bd;
    var stp = bd * PULL;
    best.x += ux * stp; best.y += uy * stp;
    best.tx += ux * stp; best.ty += uy * stp;
    /* 它挤到谁，由同一帧的 relaxAll() 统一处理，这里不重复推 */
  }

  function R0(){ return Math.min(W, H) * P.ring; }

  /* ============ 双树对照：左=磁盘真实，右=映射后所见 ============ */
  var treeLoaded = false;
  var treeNodeMap = {};

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function fmtSize(n){
    if (!n) return '';
    return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB';
  }
  /* 两列描述的是同一批东西，展开状态必须共用。
     左列 key 形如 d/3/0，右列 m/3/0 —— 去掉首字母就是同一地址，天然联动。 */
  function treeAddr(key){
    return (key.charAt(0) === 'd' || key.charAt(0) === 'm') ? key.slice(1) : key;
  }

  /* ============ 当前层 / 隐藏层：雨图和树图共用同一份状态 ============
     两个界面描述的是同一棵树，所以「现在在哪一层」只能有一个变量（curAddr），
     谁动了都写它，另一边切过去时按它重建 —— 不需要两套状态互相对表。 */

  var curAddr = '';        /* 空串 = 顶级。形如 workbuddy/c-Users-…/sid */
  var pendAddr = '';       /* 切完数据源之后才落得下去的目标 */
  var pendReveal = '';     /* 切到树图后要滚到的行 */
  var hiddenAddr = {};     /* 被眼睛关掉的层（可多层同时关；子层跟着一起不画） */
  var delPending = '';     /* × 已经点过一次，等第二下 */
  var LOCK_STATE = { has_pwd: false };   /* 有没有设过密码 —— 决定点锁是「设密码」还是「验密码」 */
  var lockSet = {};        /* 已锁的 uid。只用来判断图标状态，真正的拦截在后端 */
  var lockBusy = false;    /* 密码派生要 0.2~0.4 秒，期间不许重复提交 */

  /* 眼睛和叉都用 SVG 描线：换字号不会变成半个字符，也不受字体影响 */
  var EYE_ON = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"'
    + ' stroke-linecap="round"><path d="M1.1 6S3 2.9 6 2.9 10.9 6 10.9 6 9 9.1 6 9.1 1.1 6 1.1 6z"/>'
    + '<circle cx="6" cy="6" r="1.4"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"'
    + ' stroke-linecap="round"><path d="M1.1 6S3 2.9 6 2.9 10.9 6 10.9 6 9 9.1 6 9.1 1.1 6 1.1 6z" opacity=".5"/>'
    + '<path d="M2.4 9.6 9.6 2.4"/></svg>';

  /* 锁：和眼睛完全不同的一件事。
     眼睛 = 「这一层在雨图里不画」（数据还在，接口照给）。
     锁   = 「接口一律不返回」（AI、搜索、MCP 全拿不到）。

     ★ 两个图标互斥，一个状态一个符号，不许共用：
       LOCK_OFF = 没锁（线框、锁梁悬空、灰）→ 点它上锁
       LOCK_ON  = 已锁（实心、锁梁闭合、红）→ 点它解锁
     共用的话，人就分不清「点下去会锁」还是「它已经锁了」——
     2026-11-11 犯过这个错：把每行都涂成红实心，信号直接作废。 */
  var LOCK_OFF = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"'
    + ' stroke-linecap="round"><rect x="2.6" y="5.4" width="6.8" height="5.1" rx="1.2"/>'
    + '<path d="M4.35 5.4V4.05a1.65 1.65 0 0 1 3.3 0"/></svg>';
  var LOCK_ON = '<svg viewBox="0 0 12 12" fill="currentColor" stroke="none">'
    + '<rect x="2.25" y="5.15" width="7.5" height="5.65" rx="1.5"/>'
    + '<path d="M4.3 5.15V3.9a1.7 1.7 0 0 1 3.4 0v1.25" fill="none"'
    + ' stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>';

  /* 一个节点在「地址」里占哪一段。和 rowsOf 里拼 keyPath 用的是同一套规则，
     否则树图的行和雨图的圆会对不上号。 */
  /* 显示名：后端发现同层重名时会补一个 disp（比如 dist/…/live_server.py、
     「系统通知 · 11-03 10:26」）。这里是唯一的读口 —— 所有画字的地方都走它，
     否则有的地方用了、有的地方没用，看起来还是重名。 */
  function dispName(node){
    if (!node) return '';
    return node.disp || node.name || '';
  }

  function addrSeg(node, idx){
    /* 后端算好的稳定身份优先。回合节点没有 rel/sid/wid，原来只能靠名字兜底 ——
       24 个「系统通知」因此拿到同一个地址，被算成同一颗圆（不是重名，是并成一颗）。 */
    if (node.uid) return 'u' + encodeURIComponent(node.uid);
    if (node.srcKey) return encodeURIComponent(node.srcKey);
    if (node.wid) return encodeURIComponent(node.wid);
    /* 文件节点的稳定身份：相对主目录的路径（后端 rel 字段）。
       为什么不用 name：库里十几个 index.html 会撞成同一个点。
       为什么不用 sid：那是**会话**的 id，同一个会话里的两个文件会撞。
       为什么排在这俩后面：文件节点本来就没有 srcKey/wid，顺序无所谓，
       但放在前面更明确 —— 谁有 rel 谁就是文件。 */
    if (node.rel) return encodeURIComponent(node.rel);
    if (node.sid) return node.sid;
    /* 兜底绝不能用位置序号：列表按 count 排序，次数一变顺序就变，
       同一个东西的身份也跟着变，圆会莫名其妙「重新出生」。
       退回名字 —— 可能重名，但至少不会自己跳。 */
    return 'n' + encodeURIComponent(node.name || '?');
  }
  /* 给整棵树盖上地址。两套接口（/api/roots 或 /api/tree 与 /api/columns）
     拿到的对象不同，但结构同源、顺序一致，所以盖出来的地址能一一对上。 */
  function stampAddr(node, prefix){
    node.__addr = prefix;
    var kids = node.children || [];
    for (var i = 0; i < kids.length; i++)
      stampAddr(kids[i], prefix ? prefix + '/' + addrSeg(kids[i], i) : addrSeg(kids[i], i));
  }
  /* 懒加载挂上来的孩子必须立刻盖地址。
     不盖的话 buildItems 会退回 '#位置' 兜底 —— 位置一变圆就「重新出生」，
     而且树图那边每次 drawTrees 都会全量重盖，两边就对不上了。 */
  function stampKids(node){
    if (!node) return;
    var kids = node.children || [], base = node.__addr || '', i;
    for (i = 0; i < kids.length; i++)
      stampAddr(kids[i], base ? base + '/' + addrSeg(kids[i], i) : addrSeg(kids[i], i));
  }
  /* 自己或任何一层祖先被关掉 = 不画。关掉父层等于关掉整支 ——
     否则用户会在雨图里看到「明明关了的库又从别的地方冒出来」。 */
  function isHidden(addr){
    if (!addr) return false;
    var parts = addr.split('/'), acc = '';
    for (var i = 0; i < parts.length; i++){
      acc = acc ? acc + '/' + parts[i] : parts[i];
      if (hiddenAddr[acc]) return true;
    }
    return false;
  }
  function loadHide(){
    try {
      var a = JSON.parse(localStorage.getItem('rd-hidden') || '[]');
      for (var i = 0; i < a.length; i++) if (a[i]) hiddenAddr[a[i]] = 1;
    } catch (e) {}
  }
  function saveHide(){
    try { localStorage.setItem('rd-hidden', JSON.stringify(Object.keys(hiddenAddr))); } catch (e) {}
  }

  /* ============ 锁 ============
     密码只在输入框里存在，前端算完就扔，本地磁盘上只留 salt + check。
     点锁 -> 没有密码就先设（设完直接锁上，省一步）-> 之后每次都要验。
     被锁的节点后端一律不返回，所以锁完这一行会消失 —— 这是有意的，
     不是 bug。解锁入口是右下角那颗锁（列出所有锁定项）。 */
  function lockLoad(){
    return fetch('/api/lock', { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d) return;
        LOCK_STATE.has_pwd = !!d.has_pwd;
        lockSet = {};
        var a = d.locked || [];
        for (var i = 0; i < a.length; i++) lockSet[a[i]] = 1;
        lockBtnSync();
        drawTrees();
      })
      .catch(function(){});
  }
  /* 这一行在 lockSet 里对应哪个键。
     后端的身份有几种写法（rel:xxx / wid:xxx / sid:xxx / 原值），
     按同一优先级逐一试，命中哪个就返回哪个 —— 解锁时原样送回去。 */
  function lockKeyOf(node){
    if (!node || !node.__addr) return '';
    var c = [];
    if (node.rel) c.push('rel:' + node.rel);
    if (node.uid) c.push(String(node.uid));
    if (node.wid) c.push(String(node.wid));
    if (node.sid) c.push(String(node.sid));
    if (node.srcKey) c.push(String(node.srcKey));
    for (var i = 0; i < c.length; i++) if (lockSet[c[i]]) return c[i];
    return '';
  }

  /* 表头上的锁定统计。纯统计：不占一行、不进树、没锁定时零占位。
     点它才弹清单 —— 树上能看见的东西接口就得返回，AI 也就读得到，
     所以「哪些被锁了」只能停在这层皮上，不能落进数据里。 */
  function lockBtnSync(){
    var el = document.getElementById('thlock');
    if (!el) return;
    if (!el.__bound){ el.__bound = 1; el.addEventListener('click', lockPanel); }
    var n = Object.keys(lockSet).length;
    el.className = n ? 'thlock on' : 'thlock';
    el.innerHTML = n
      ? (LOCK_ON + '<span>已锁定 ' + n + ' 项 · 禁止 AI 读取</span>')
      : '';
  }
  function isLocked(addr){ return !!lockSet[addr]; }

  /* 一张卡片解决所有情况，不写多套 UI。
     forgot 传函数时才显示左下角「忘记密码」——设密码那一步没有忘记这回事。 */
  function lockDialog(title, hint, okText, onSubmit, forgot){
    var old = document.getElementById('lockmask');
    if (old) old.parentNode.removeChild(old);
    var m = document.createElement('div');
    m.id = 'lockmask';
    m.className = 'lockmask';
    m.innerHTML = '<div class="lockcard">'
      + '<div class="lh">' + esc(title) + (hint ? ' <em>' + esc(hint) + '</em>' : '') + '</div>'
      + '<input type="password" class="lpin" autocomplete="new-password" spellcheck="false">'
      + '<div class="lerr"></div>'
      + '<div class="lf">'
      + (forgot ? '<b data-lk="forgot" class="lforgot">忘记密码</b>' : '')
      + '<b data-lk="cancel">取消</b><b data-lk="ok">' + esc(okText) + '</b></div>'
      + '</div>';
    document.body.appendChild(m);
    var inp = m.querySelector('.lpin');
    var err = m.querySelector('.lerr');
    var ok = m.querySelector('[data-lk="ok"]');
    var cancel = m.querySelector('[data-lk="cancel"]');

    function close(){ if (m.parentNode) m.parentNode.removeChild(m); }
    function submit(){
      var v = inp.value || '';
      if (v.length < 4){ err.textContent = '至少 4 位'; inp.focus(); return; }
      if (lockBusy) return;
      lockBusy = true;
      ok.className = 'busy';
      ok.textContent = '验证中…';
      onSubmit(v, function(msg){
        lockBusy = false;
        ok.className = '';
        ok.textContent = okText;
        if (msg){ err.textContent = msg; inp.select(); }
        else close();
      });
    }
    ok.addEventListener('click', submit);
    cancel.addEventListener('click', close);
    var fg = m.querySelector('[data-lk="forgot"]');
    if (fg) fg.addEventListener('click', function(){
      close();
      askReset(function(){ if (forgot) forgot(); });
    });
    m.addEventListener('mousedown', function(e){ if (e.target === m) close(); });
    inp.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); submit(); }
      else if (e.key === 'Escape'){ e.preventDefault(); close(); }
    });
    setTimeout(function(){ inp.focus(); }, 30);
  }

  /* 忘记密码 = 重置。没有找回，也不假装有。
     锁防的是「AI 读不到」，不是「防你自己」；你能碰这台机器，
     就能直接删掉 _lock.json。所以这里唯一诚实的做法是：说清后果，一次点掉。 */
  function askReset(after){
    var m = document.getElementById('lockmask');
    if (m) m.parentNode.removeChild(m);
    var n = Object.keys(lockSet).length;
    var box = document.createElement('div');
    box.id = 'lockmask';
    box.className = 'lockmask';
    box.innerHTML = '<div class="lockcard" style="width:312px">'
      + '<div class="lh">重置密码</div>'
      + '<div class="lbody">忘记密码只能重置：密码会被清空，'
      + (n ? '当前锁定的 <b>' + n + '</b> 项全部解开，' : '')
      + '之后重新设一个。</div>'
      + '<div class="lnote">重置不需要密码 —— 密钥就在硬盘上。</div>'
      + '<div class="lf"><b data-lk="cancel">取消</b>'
      + '<b data-lk="ok">重置</b></div></div>';
    document.body.appendChild(box);
    box.querySelector('[data-lk="cancel"]').addEventListener('click', function(){
      box.parentNode.removeChild(box);
    });
    box.addEventListener('mousedown', function(e){
      if (e.target === box) box.parentNode.removeChild(box);
    });
    box.querySelector('[data-lk="ok"]').addEventListener('click', function(){
      box.parentNode.removeChild(box);
      fetch('/api/lock/reset', { method: 'POST' })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (!d || !d.ok){ flashTip('重置失败'); return; }
          LOCK_STATE.has_pwd = false;
          lockSet = {};
          lockBtnSync();
          drawTrees();
          lockRefreshAll();
          flashTip('已重置 · 密码和锁定都清空了');
          if (after) after();
        })
        .catch(function(){ flashTip('重置失败'); });
    });
  }

  /* 点某一行的锁。传元素而不是地址：后端要的是 rel/sid/wid 原值，
     地址是编码过的，对不上。 */
  function lockTargetOf(el){
    return {
      rel: el.getAttribute('data-lrel') || '',
      sid: el.getAttribute('data-lsid') || '',
      wid: el.getAttribute('data-lwid') || '',
      uid: el.getAttribute('data-luid') || '',
      srcKey: el.getAttribute('data-lsrc') || ''
    };
  }
  function askLock(el){
    var addr = el.getAttribute('data-lock') || '';
    var tgt = lockTargetOf(el);
    if (!tgt.rel && !tgt.sid && !tgt.wid && !tgt.uid && !tgt.srcKey){
      flashTip('这一行没有稳定身份，锁不了');
      return;
    }
    if (!LOCK_STATE.has_pwd){
      lockDialog('先设一个密码', '只存校验值，密码本身不进磁盘', '设置并锁定', function(pwd, done){
        fetch('/api/lock/pwd', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ old: '', new: pwd })
        }).then(function(r){ return r.json(); }).then(function(d){
          if (!d || !d.ok){ done((d && d.error) || '设置失败'); return; }
          LOCK_STATE.has_pwd = true;
          lockApply(pwd, tgt, addr, done);
        }).catch(function(){ done('设置失败'); });
      });
      return;
    }
    lockDialog('输入密码以禁止 AI 使用', '', '锁定', function(pwd, done){
      lockApply(pwd, tgt, addr, done);
    }, function(){ flashTip('密码已清空，再点一次锁就能重新设'); });
  }
  function lockApply(pwd, tgt, addr, done){
    fetch('/api/lock/toggle', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pwd: pwd, target: tgt })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!d || !d.ok){ done((d && d.error) || '操作失败'); return; }
      var _k = d.uid || addr;
      if (d.locked) lockSet[_k] = 1; else delete lockSet[_k];
      lockBtnSync();
      done('');
      flashTip(d.locked ? '已锁定 · AI 读不到，你照常看' : '已解锁 · AI 可以读了');
      /* 只重画：这一行本来就没从数据里消失（本人照常看得见），
         变的只是那颗图标。整棵树重拉反而会闪一下。 */
      drawTrees();
    }).catch(function(){ done('操作失败'); });
  }

  /* 解锁：只有一个入口形状，锁清单和树上那条折叠都走它 */
  function askUnlock(uid){
    lockDialog('输入密码为 AI 解锁使用', lockLabel(uid), '解锁', function(pwd, done){
      lockApply(pwd, { uid: uid }, uid, done);
    }, function(){ flashTip('密码已清空，锁定全部解开'); });
  }

  /* 解锁入口：右下角那颗锁。列出所有被锁的项，点一下验密码就能解。

  function lockPanel(){
    var m = document.getElementById('lockmask');

      h += '<div class="lplist">';

  }
  /* uid 是可读的（工作区名 / rel 路径）就直接显示，sid 这种就截一段 */
  function lockLabel(uid){
    var s = String(uid || '');
    return s.length > 42 ? s.slice(0, 20) + '…' + s.slice(-14) : s;
  }
  /* 锁变了之后整棵树要重拉：被锁的节点已经不在接口结果里了，重画没用 */
  function lockRefreshAll(){
    if (SOURCE) switchSource(SOURCE);
    else if (typeof livePull === 'function') livePull();
  }
  loadHide();
  lockLoad();      /* 拉一次锁状态：表头那颗统计和图标提示都要它 */

  /* 眼睛：只切这一层。可以连着关好几层，互不影响；雨图立刻跟着少那几颗。 */
  function toggleHidden(addr){
    if (!addr) return;
    if (hiddenAddr[addr]) delete hiddenAddr[addr];
    else hiddenAddr[addr] = 1;
    saveHide();
    drawTrees();
    if (MODE !== 'rain') return;
    /* 关掉的正好是当前层（或它的祖先）→ 退到最近一个还看得见的层 */
    while (path.length > 1 && isHidden(focusNode().__addr)) path.pop();
    openGroups = {};
    drawCrumb();
    sync();
  }

  /* 树图里选中的那一行 = 当前层。切到雨图就落在这里。 */
  function setCur(addr){
    curAddr = addr || '';
    var boxes = [tbdEl, tbmEl], i, j, rows;
    for (i = 0; i < boxes.length; i++){
      rows = boxes[i].getElementsByClassName('trow');
      for (j = 0; j < rows.length; j++)
        rows[j].className = rows[j].className.replace(/\s*\bsel\b/g, '')
          + ((rows[j].getAttribute('data-addr') || '') === curAddr && curAddr ? ' sel' : '');
    }
  }

  /* ×：断开一个导入库。第一下只把叉变红（等第二下），第二下才真断 ——
     删的是用户自己导进来的东西，一次误点就没了，这一步不能省。
     文件不真删，移到 sources/_归档/ —— 谁都有点错的时候。 */
  function askDel(addr){
    if (delPending !== addr){
      delPending = addr;
      drawTrees();
      flashTip('再点一次，断开这个库');
      return;
    }
    delPending = '';
    fetch('/api/source/remove?key=' + encodeURIComponent(addr), { method: 'POST' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok){
          drawTrees();
          flashTip((d && d.error) || '断开失败');
          return;
        }
        /* 这个库身上的「隐藏」状态一起清掉，否则以后同名导回来会凭空是灰的 */
        var pre = addr + '/', kk;
        for (kk in hiddenAddr) if (kk === addr || kk.indexOf(pre) === 0) delete hiddenAddr[kk];
        saveHide();
        if (curAddr === addr || curAddr.indexOf(pre) === 0) curAddr = '';
        if (SOURCE === addr) switchSource('');
        colsRefresh();

      })
      .catch(function(){ drawTrees(); flashTip('断开失败'); });
  }
  function treeIsOpen(key, depth){
    var v = treeOpen[treeAddr(key)];
    /* 默认只展开根（资料库/projects），工作区那一层一律收起 */
    return v === undefined ? depth < 1 : !!v;
  }
  function rowsOf(node, depth, keyPath, out, acts){
    var kids = node.children || [];
    /* 会话节点是懒加载的：此刻没加载过明细，但它一定有下钻，所以照样给箭头 */
    var lazy = (node.kind === 'session' && node.sid);
    var has = kids.length > 0 || lazy;
    var open = has && treeIsOpen(keyPath, depth);
    treeNodeMap[keyPath] = node;

    var ad = node.__addr || '';
    /* 这一行锁没锁 —— 只影响图标，不影响这一行的任何其他东西。

    var lkKey = lockKeyOf(node);
    var cls = 'trow' + (has ? ' hit' : '')
      + (isHidden(ad) ? ' hid' : '')
      + (ad && ad === curAddr ? ' sel' : '');
    var h = '<div class="' + cls + '" data-k="' + esc(keyPath) + '" data-d="' + depth + '"'
      + ' data-addr="' + esc(ad) + '"';
    h += ' style="padding-left:' + (8 + depth * 13) + 'px">';
    h += '<span class="tw">' + (has ? (open ? '\u25be' : '\u25b8') : '') + '</span>';
    h += '<span class="tn' + (node.mono ? ' tmono' : '') + '">' + esc(dispName(node)) + '</span>';
    if (node.note) h += '<span class="tq">' + esc(node.note) + '</span>';
    /* 根行不写数字：表头报的已经是同一个数，隔一行再报一遍像两套口径 */
    if (node.right && depth > 0) h += '<span class="tm">' + esc(node.right) + '</span>';
    /* 行尾两列按钮只出现在右列（雨图显示的样子）：眼睛管「这一层在雨图里显不显示」，
       × 管「断开这个库」。根行没有按钮 —— 根不是一个可以被藏掉或删掉的东西。 */
    if (acts && depth > 0 && ad){
      var own = !!hiddenAddr[ad];
      var isLib = (node.kind === 'src' && ad.indexOf('/') < 0);
      h += '<span class="tacts">';
      h += '<b class="teye' + (own ? ' on' : '') + '" data-eye="' + esc(ad) + '" title="'
        + (own ? '取消隐藏：让它在雨滴图中重新出现' : '隐藏：在雨滴图中隐藏')
        + '">' + (own ? EYE_OFF : EYE_ON) + '</b>';
      /* 锁：**只有这一个图标随状态变**，这一行的其余部分一点不动。
         已锁 = 红色实心 + 点它解锁；未锁 = 灰线框 + 点它上锁。
         未锁那条要把原始字段一起带上 —— 地址是编码过的（Desktop%2F…），
         后端的身份是 rel:/wid:/sid: 三种原值，拿地址去比对永远对不上。 */
      if (lkKey){
        h += '<b class="tlk on" data-unlock="' + esc(lkKey) + '"'
          + ' title="已锁定：禁止 AI 搜索和操作。点它输密码解锁">' + LOCK_ON + '</b>';
      } else {
        h += '<b class="tlk" data-lock="' + esc(ad) + '"'
          + ' data-lrel="' + esc(node.rel || '') + '"'
          + ' data-lsid="' + esc(node.sid || '') + '"'
          + ' data-lwid="' + esc(node.wid || '') + '"'
          + ' data-luid="' + esc(node.uid || '') + '"'
          + ' data-lsrc="' + esc(node.srcKey || '') + '"'
          + ' title="锁定：禁止 AI 搜索和操作，你自己照常用'
          + (LOCK_STATE.has_pwd ? '' : '（首次需先设密码）')
          + '">' + LOCK_OFF + '</b>';
      }
      /* 示例库和本机会话不是「链接」，没有可断的东西 —— 但槽位照留，图标才对齐 */
      if (isLib && ad !== 'workbuddy' && ad !== 'csv'){
        h += '<b class="tdel' + (delPending === ad ? ' on' : '') + '" data-del="' + esc(ad) + '" title="'
          + (delPending === ad ? '再点一次，断开这个库' : '断开这个库') + '">'
          + '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2">'
          + '<path d="M3 3l6 6M9 3l-6 6"/></svg></b>';
      } else {
        h += '<b class="tgap"></b>';
      }
      h += '</span>';
    }
    out.push(h + '</div>');
    /* 「任务」是透视层：它的子节点直接挂到上一级路径，不额外占一层键身份，
       这样左列的 c-Users-…-2026-09-26-08-40-05 和右列的任务行仍对得上。 */
    var base = node.transparent
      ? keyPath.slice(0, Math.max(1, keyPath.lastIndexOf('/')))
      : keyPath;
    if (open) for (var i = 0; i < kids.length; i++){
      /* 子节点路径用稳定身份（工作区名 / 会话 sid），不用行号 ——
         左右两列排序一变，行号就会连错行。
         工作区名里带 /（GonJui/Raindrop Chart），必须编码，否则切分路径会错。 */
      /* 必须和雨图用同一个 addrSeg。以前这里只认 wid/sid，
         文件节点落到行号 i —— 于是两个视图各有一套身份：
         树图的行和雨图的圆对不上号，排序一变文件行的地址也跟着变。 */
      rowsOf(kids[i], depth + 1, base + '/' + addrSeg(kids[i], i), out, acts);
    }
  }
  /* 悬停联动：两列说的是同一批东西，鼠标压在哪一行，另一边同一行也亮。
     按共用地址（去掉 d/m 前缀）匹配，不按行号 —— 排序变了也不会亮错。 */
  var linkRows = [];
  var linkAddr = null;
  function clearLink(){
    for (var i = 0; i < linkRows.length; i++){
      linkRows[i].className = linkRows[i].className.replace(/\s*link\b/g, '');
    }
    linkRows = [];
    linkAddr = null;
  }
  function onTreeHover(e){
    var row = e.target.closest ? e.target.closest('.trow') : null;
    if (!row){ clearLink(); return; }
    var k = row.getAttribute('data-k');
    if (!k) return;
    var addr = treeAddr(k);
    if (addr === linkAddr) return;      /* 在同一行内部移动，不重复扫 */
    var boxes = [tbdEl, tbmEl], i, j, rows;
    clearLink();
    linkAddr = addr;
    for (i = 0; i < boxes.length; i++){
      rows = boxes[i].getElementsByClassName('trow');
      for (j = 0; j < rows.length; j++){
        if (treeAddr(rows[j].getAttribute('data-k') || '') === addr){
          rows[j].className += ' link';
          linkRows.push(rows[j]);
        }
      }
    }
  }
  /* 滚动联动：滚哪一列，另一列跟到同一行。
     不按 scrollTop 比例对齐 —— 右边展开会话后会比左边高，比例会越滚越偏；
     改成“找出顶部那一行，把另一列滚到同一行”。 */
  var scrollLock = 0, scrollOwner = '';
  function syncScroll(which, src, dst){
    var sRect = src.getBoundingClientRect();
    var rows = src.getElementsByClassName('trow'), pick = null, i, rr;

    for (i = 0; i < rows.length; i++){
      rr = rows[i].getBoundingClientRect();
      if (rr.bottom > sRect.top + 1){ pick = rows[i]; break; }
    }
    if (!pick) return;

    var addr = treeAddr(pick.getAttribute('data-k') || '');
    var drows = dst.getElementsByClassName('trow');
    for (i = 0; i < drows.length; i++){
      if (treeAddr(drows[i].getAttribute('data-k') || '') === addr){
        var dRect = dst.getBoundingClientRect();
        var off = pick.getBoundingClientRect().top - sRect.top;   /* 保留半截的偏移 */
        dst.scrollTop += (drows[i].getBoundingClientRect().top - dRect.top) - off;
        break;
      }
    }
  }
  function onColScroll(which, src, dst){
    if (scrollOwner && scrollOwner !== which && Date.now() < scrollLock) return;
    scrollOwner = which;
    scrollLock = Date.now() + 120;
    syncScroll(which, src, dst);
  }

  function drawTrees(){
    clearLink();                       /* 行被重建了，旧的引用作废 */
    var keep1 = tbdEl.scrollTop, keep2 = tbmEl.scrollTop;
    if (diskTree){ var a = []; stampAddr(diskTree, ''); rowsOf(diskTree, 0, 'd', a, false); tbdEl.innerHTML = a.join(''); }
    if (libTree){ var b = []; stampAddr(libTree, ''); rowsOf(libTree, 0, 'm', b, true); tbmEl.innerHTML = b.join(''); }
    tbdEl.scrollTop = keep1; tbmEl.scrollTop = keep2;
  }
  function loadTreeSession(node){
    node.__loaded = true;
    /* 加载过程不再改状态胶囊：它只报「已连接 + 统计」，
       过程话会让那一格一直在跳，反而看不清现在到底连没连上 */
    fetch('/api/session?id=' + encodeURIComponent(node.sid), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.tree && d.tree.children && d.tree.children.length){
          node.children = d.tree.children;
          stampKids(node);
          treeOpen[treeAddr(node.__key)] = true;
          drawTrees();
        } else {
          node.__loaded = false;
          /* 静默：到底了不是异常，胶囊继续报统计，不弹这类提示 */
        }
      })
      .catch(function(){ node.__loaded = false; setLive('未识别会话', true); });
  }
  function onTreeClick(e){
    /* 行尾按钮先接：它们不能再触发「点行」—— 点眼睛不该顺手把这一行展开 */
    var btn = e.target.closest ? e.target.closest('[data-eye],[data-del],[data-lock],[data-unlock]') : null;
    if (btn){
      e.stopPropagation();
      if (btn.hasAttribute('data-eye')) toggleHidden(btn.getAttribute('data-eye'));
      else if (btn.hasAttribute('data-lock')) askLock(btn);
      else if (btn.hasAttribute('data-unlock')) askUnlock(btn.getAttribute('data-unlock'));
      else askDel(btn.getAttribute('data-del'));
      return;
    }
    var row = e.target.closest ? e.target.closest('.trow') : null;
    if (!row) return;
    var k = row.getAttribute('data-k');
    var node = treeNodeMap[k];
    if (!node) return;
    /* 点哪一行，当前层就是哪一行 —— 切到雨图就落在这里 */
    if (row.getAttribute('data-addr')) setCur(row.getAttribute('data-addr'));
    if (node.kind === 'session' && node.sid && !node.__loaded){
      loadTreeSession(node);
      return;
    }
    if (!(node.children && node.children.length)) return;
    /* 深度从 data-d 读：「任务」是透视层，键路径不涨，切分算出来的深度会偏 */
    var d = parseInt(row.getAttribute('data-d'), 10);
    if (isNaN(d)) d = k.split('/').length - 1;
    /* 用共用地址存状态，点左列右列一起展开（本来就是同一个东西） */
    treeOpen[treeAddr(k)] = !treeIsOpen(k, d);
    drawTrees();
  }
  /* ============ 树图底部的水面波纹 ============
     现在只做「波纹扩散」这一层：雨滴还没有下落，波纹是定时凭空激起的，
     用来先把节奏、扁度、消散曲线调顺。手感参数全集中在 RIP 里，改数值即可。
     等这层定稿，再接「雨滴从上方落到水面、落点处激波」那一层。 */
  var RIP = {
    /* 雨丝 */
    gap: 100,           /* 两根雨丝的间隔(ms)，越小雨越密。实际在 0.6~1.4 倍之间抖 */
    dropSpeed: 1100,    /* 下落速度(px/s) */
    dropLen: 22,        /* 雨丝长度(px) */
    dropAlpha: 0.28,    /* 雨丝透明度 */
    dropWidth: 1.1,     /* 雨丝线宽 */
    spread: 0.16,       /* 允许落到屏幕外多少（占宽比例，两端各一半）。
                           全落在中间会让两侧永远空着，很假 */
    /* 涟漪 */
    ring: 2,            /* 一次落水激起几圈同心波 */
    ringGap: 200,       /* 同心圈之间的时间差(ms) */
    maxR: 110,          /* 长半轴最多散到多远(px) */
    squash: 0.30,       /* 压扁比：短半轴 = 长半轴 × 它，越小透视越强 */
    life: 1800,         /* 一圈从生到完全消失(ms) */
    width: 1.1,         /* 起始线宽，随扩散变细 */
    alpha: 0.30,        /* 起始透明度，末端衰减到 0 */
    rgb: '46,125,138'   /* 和圆点、滑块同一种青 */
  };
  var ripEl = document.getElementById('rip');
  var ripCtx = ripEl ? ripEl.getContext('2d') : null;
  var ripW = 0, ripH = 0, ripDPR = 1;
  var ripples = [], drops = [];
  var ripAcc = 0, ripLast = 0, ripRAF = 0, ripTarget = 130;
  var ripBase = 0;             /* 水面那条线的 y：雨丝落到这里就换成一圈涟漪 */

  /* ---- 调参面板：只暴露最影响水波手感的那几个数 ---- */
  var TUNE_SPEC = [
    ['gap',       '密度',   60,  900,  10, 'ms'],
    ['dropSpeed', '雨速',  400, 2400,  50, 'px/s'],
    ['ring',      '圈数',    1,    5,   1, '圈'],
    ['maxR',      '半径',   40,  240,   4, 'px'],
    ['squash',    '扁度', 0.10, 0.60, 0.01, ''],
    ['life',      '寿命',  600, 4000, 100, 'ms'],
    ['alpha',     '浓度', 0.05, 0.70, 0.01, '']
  ];
  var TUNE_DEF = {};
  for (var _ts = 0; _ts < TUNE_SPEC.length; _ts++) TUNE_DEF[TUNE_SPEC[_ts][0]] = RIP[TUNE_SPEC[_ts][0]];

  var tuneEl = document.getElementById('tune');
  var tuneBuilt = false;
  var tuneDrag = null;         /* 拖表头时记下指针与面板左上角的偏移 */
  var tuneSnapshot = null;     /* 打开面板那一刻的参数快照，× 退出时用它回滚 */

  function tuneFmt(v, step){
    return step < 0.1 ? (+v).toFixed(2) : String(Math.round(v));
  }
  function tuneSpecOf(k){
    for (var i = 0; i < TUNE_SPEC.length; i++) if (TUNE_SPEC[i][0] === k) return TUNE_SPEC[i];
    return null;
  }

  function buildTune(){
    var h = '<div class="tth"><span>下方雨动画</span><b data-t="cancel" title="直接退出">×</b></div>', i, s, k;
    for (i = 0; i < TUNE_SPEC.length; i++){
      s = TUNE_SPEC[i]; k = s[0];
      h += '<div class="tr"><label>' + s[1] + '</label>'
        + '<input type="range" data-k="' + k + '" min="' + s[2] + '" max="' + s[3]
        + '" step="' + s[4] + '" value="' + RIP[k] + '">'
        + '<b data-v="' + k + '">' + tuneFmt(RIP[k], s[4]) + (s[5] ? ' ' + s[5] : '') + '</b></div>';
    }
    h += '<div class="tfoot"><b data-t="reset">恢复默认</b><b data-t="ok">确定</b></div>';
    tuneEl.innerHTML = h;
    tuneBuilt = true;

    tuneEl.addEventListener('mousedown', function(e){
      e.stopPropagation();
      /* 只有表头能拖 —— 滑块和按钮上按下时不能带动整个面板。
         表头内部还有标题和 ×，所以要往上找最近的 .tth，不能只看直接目标 */
      var t = e.target;
      while (t && t !== tuneEl && String(t.className || '').indexOf('tth') < 0) t = t.parentNode;
      if (!t || t === tuneEl) return;
      tuneDrag = {
        dx: e.clientX - tuneEl.offsetLeft,
        dy: e.clientY - tuneEl.offsetTop
      };
      tuneEl.className = 'on drag';
      e.preventDefault();
    });
    tuneEl.addEventListener('input', function(e){
      var el = e.target;
      if (!el || el.tagName !== 'INPUT') return;
      var k = el.getAttribute('data-k'), s = tuneSpecOf(k);
      if (!s) return;
      RIP[k] = parseFloat(el.value);
      var box = tuneEl.querySelector('b[data-v="' + k + '"]');
      if (box) box.textContent = tuneFmt(RIP[k], s[4]) + (s[5] ? ' ' + s[5] : '');
    });
    tuneEl.addEventListener('click', function(e){
      var t = e.target.getAttribute('data-t'), i, k;
      if (t === 'ok'){ closeTune(false); return; }        /* 保留这次改的 */
      if (t === 'cancel'){ closeTune(true); return; }     /* 回到打开面板前的值 */
      if (t !== 'reset') return;
      for (i = 0; i < TUNE_SPEC.length; i++){
        k = TUNE_SPEC[i][0];
        RIP[k] = TUNE_DEF[k];
      }
      syncTuneUI();
    });
  }

  /* 把 RIP 的当前值写回滑块和数字。回滚和恢复默认都要用，所以单拎出来。 */
  function syncTuneUI(){
    if (!tuneBuilt) return;
    for (var i = 0; i < TUNE_SPEC.length; i++){
      var s = TUNE_SPEC[i], k = s[0];
      var inp = tuneEl.querySelector('input[data-k="' + k + '"]');
      if (inp) inp.value = RIP[k];
      var b = tuneEl.querySelector('b[data-v="' + k + '"]');
      if (b) b.textContent = tuneFmt(RIP[k], s[4]) + (s[5] ? ' ' + s[5] : '');
    }
  }

  function openTune(){
    if (!tuneBuilt) buildTune();
    /* 记下打开前的值：× 或 Esc 退出时原样还回去 */
    tuneSnapshot = {};
    for (var i = 0; i < TUNE_SPEC.length; i++) tuneSnapshot[TUNE_SPEC[i][0]] = RIP[TUNE_SPEC[i][0]];
    syncTuneUI();
    tuneEl.className = 'on';
    /* 居中弹出。右上角那个位置太偏，离水面也远，看着像挂件不像面板 */
    var w = tuneEl.offsetWidth, hh = tuneEl.offsetHeight;
    tuneEl.style.left = Math.round((window.innerWidth - w) / 2) + 'px';
    tuneEl.style.top = Math.round((window.innerHeight - hh) / 2) + 'px';
  }

  /* cancel=true 表示不保存：把参数还原成打开面板时的样子。
     点面板外面关闭算「确定」—— 调完参数顺手点一下空白是最常见的收尾动作，
     这时候把改动全撤掉会很恼人。 */
  function closeTune(cancel){
    if (!tuneEl) return;
    if (cancel && tuneSnapshot){
      for (var k in tuneSnapshot) if (tuneSnapshot.hasOwnProperty(k)) RIP[k] = tuneSnapshot[k];
      syncTuneUI();
    }
    tuneSnapshot = null;
    tuneEl.className = '';
  }

  function ripResize(){
    if (!ripEl) return;
    var r = ripEl.getBoundingClientRect();
    if (!r.width || !r.height) return;         /* 还在 display:none，等下次 */
    ripDPR = Math.min(window.devicePixelRatio || 1, 2);
    ripW = Math.round(r.width); ripH = Math.round(r.height);
    ripEl.width = Math.round(ripW * ripDPR);
    ripEl.height = Math.round(ripH * ripDPR);
    ripCtx.setTransform(ripDPR, 0, 0, ripDPR, 0, 0);
    /* 水面那条线 = 画布底部往上，留出树图的下留白那么高。
       这个值跟着 padding 走，窗口变高变矮都自动对得上。 */
    var padBot = 0;
    try { padBot = parseFloat(getComputedStyle(twBox).paddingBottom) || 0; } catch (e) {}
    /* 涟漪中心不能压在「列底边」那条线上，否则椭圆上半截会钻进列表里。
       水面区 = 底部留白那一段，中心取它的 55% 处，整个椭圆才落得住。 */
    var waterH = padBot || 110;
    ripBase = Math.max(60, ripH - waterH) + waterH * 0.55;
  }

  /* 某点落水：一圈主波 + 几圈余波，半径和时间都递减 */
  function ripSpawn(now, x, y){
    for (var i = 0; i < RIP.ring; i++){
      ripples.push({
        x: x, y: y,
        t0: now + i * RIP.ringGap,
        dur: RIP.life * (1 - i * 0.14),
        maxR: RIP.maxR * (1 - i * 0.22)
      });
    }
    /* 涟漪叠太多会糊成一片，超过上限就丢最老的 */
    var cap = RIP.ring * 14;
    if (ripples.length > cap) ripples.splice(0, ripples.length - cap);
  }

  /* 一根雨丝：从屏幕上方之外出发，落到水面为止 */
  function rainSpawn(){
    var pad = ripW * RIP.spread;
    drops.push({
      x: -pad + Math.random() * (ripW + pad * 2),
      y: -Math.random() * ripBase * 0.5 - 12,
      v: RIP.dropSpeed * (0.85 + Math.random() * 0.3),
      len: RIP.dropLen * (0.7 + Math.random() * 0.6),
      a: RIP.dropAlpha * (0.6 + Math.random() * 0.7)
    });
  }

  function ripTick(now){
    if (!ripCtx) return;
    if (!ripW || !ripH) ripResize();
    if (!ripW || !ripH){ ripRAF = requestAnimationFrame(ripTick); return; }

    /* 切回标签页时 now 会跳一大段。不钳住的话所有雨丝会瞬移到水面，
       同时炸出一片涟漪，看着像卡了一下。 */
    var dt = Math.min(64, Math.max(0, now - ripLast));
    ripLast = now;

    ripAcc += dt;
    var guard = 0;
    while (ripAcc >= ripTarget && guard++ < 12){
      ripAcc -= ripTarget;
      ripTarget = RIP.gap * (0.6 + Math.random() * 0.8);
      rainSpawn();
    }

    ripCtx.clearRect(0, 0, ripW, ripH);

    var i, d, keepDrops = [], keep = [], r, k, ease, rx, ry, a, lw, cap;

    /* 雨丝：一条竖线，落到水面就消失并激起涟漪 */
    ripCtx.lineWidth = RIP.dropWidth;
    for (i = 0; i < drops.length; i++){
      d = drops[i];
      d.y += d.v * dt / 1000;
      if (d.y >= ripBase){
        ripSpawn(now, d.x, ripBase);
        continue;
      }
      keepDrops.push(d);
      ripCtx.beginPath();
      ripCtx.moveTo(d.x, d.y);
      ripCtx.lineTo(d.x, d.y - d.len);
      ripCtx.strokeStyle = 'rgba(' + RIP.rgb + ',' + d.a.toFixed(3) + ')';
      ripCtx.stroke();
    }
    drops = keepDrops;

    /* 涟漪：先快后慢地散开，同时淡出 */
    for (i = 0; i < ripples.length; i++){
      r = ripples[i];
      if (now < r.t0){ keep.push(r); continue; }
      k = (now - r.t0) / r.dur;
      if (k >= 1) continue;
      keep.push(r);
      ease = 1 - Math.pow(1 - k, 2.4);
      rx = r.maxR * ease;
      ry = rx * RIP.squash;
      a = RIP.alpha * Math.pow(1 - k, 1.5);
      lw = RIP.width * (1 - k * 0.7);
      ripCtx.beginPath();
      ripCtx.ellipse(r.x, r.y, rx, Math.max(ry, 0.4), 0, 0, Math.PI * 2);
      ripCtx.strokeStyle = 'rgba(' + RIP.rgb + ',' + a.toFixed(3) + ')';
      ripCtx.lineWidth = Math.max(lw, 0.35);
      ripCtx.stroke();
    }
    ripples = keep;

    ripRAF = requestAnimationFrame(ripTick);
  }

  function ripStart(){
    if (!ripCtx || ripRAF) return;
    ripResize();
    ripples = [];
    drops = [];
    ripAcc = RIP.gap;              /* 进来先落一滴，不用干等一个间隔 */
    ripTarget = RIP.gap;
    /* 预热：撒几根已经在半空的雨丝 + 两圈刚散开的涟漪。
       不预热的话，进树图要干等半秒才见到第一滴水，像卡住了。 */
    for (var wi = 0; wi < 12; wi++){
      rainSpawn();
      drops[drops.length - 1].y = Math.random() * ripBase;
    }
    var t0 = performance.now();
    ripSpawn(t0, ripW * 0.34, ripBase);
    ripSpawn(t0 + 90, ripW * 0.69, ripBase);
    ripLast = t0;
    ripRAF = requestAnimationFrame(ripTick);
  }

  function ripStop(){
    if (ripRAF) cancelAnimationFrame(ripRAF);
    ripRAF = 0;
    ripples = [];
    drops = [];
    if (ripCtx && ripW) ripCtx.clearRect(0, 0, ripW, ripH);
  }

  /* 两栏一次拉全（/api/columns）：左=磁盘上的链接地址，右=雨图里的库。
     以前是两次请求（/api/disk + /api/library?source=），只描述当前那一个库 ——
     新导入的库在这一页上根本不出现，两侧表头数的也是目录/会话，跟「有几个库」无关。 */
  function treePull(){
    if (treeLoaded) return;
    treeLoaded = true;
    fetch('/api/columns', { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        diskTree = d.disk || null;
        libTree = d.lib || null;
        /* 表头只报一件事：这一栏下面有几个「东西」。
           左栏 = 几个链接地址（每个库在磁盘上的位置），右栏 = 几个库。
           再往下每行自己带量，表头不重复算第二遍。 */
        thdEl.textContent = (diskTree && diskTree.right) || '';
        thmEl.textContent = (libTree && libTree.right) || '';
        drawTrees();
        /* 从雨图切过来：把当前层这一支展开、滚到眼前，选中的行常亮 */
        if (pendReveal){ var pr = pendReveal; pendReveal = ''; treeReveal(pr); }
      })
      .catch(function(){
        tbdEl.innerHTML = '<div class="trow"><span class="tn tq">请双击启动脚本</span></div>';
        tbmEl.innerHTML = '<div class="trow"><span class="tn tq">请双击启动脚本</span></div>';
      });
  }

  /* 新增一个库之后重拉两栏：两栏必须同时多一行，不能只更新一边。
     展开状态清掉 —— 多了一个库，旧的行号地址已经不可信。 */
  function colsRefresh(){
    treeLoaded = false;
    treeOpen = {};
    treePull();
  }

  /* 从「地址」落到雨图的同一层。
     地址的第一段是库 key，后面每段是那一层的 wid / sid（跟树图拼 keyPath 同一个规则）。
     库不同就先切库 —— 数据回来之后 applyLive 会拿 pendAddr 再来一遍，不需要回调队列。 */
  function applyAddr(addr){
    addr = addr || '';
    var parts = addr ? addr.split('/') : [];
    var lib = parts.length ? parts[0] : '';
    if (lib !== SOURCE){
      pendAddr = addr;
      switchSource(lib);
      return;
    }
    if (!root) return;
    var chain = [root], cur = root, i, j;
    for (i = 1; i < parts.length; i++){
      var kids = cur.children || [], hit = null;
      for (j = 0; j < kids.length; j++){
        if (addrSeg(kids[j], j) === parts[i]){ hit = kids[j]; break; }
      }
      if (!hit) break;                     /* 段接不上（还没加载 / 已被删）→ 停在上一层 */
      if (hit.lazyWs && !(hit.children || []).length){
        wsLoad(hit, function(){ applyAddr(addr); });
        return;
      }
      if (hit.lazy && hit.sid && !(hit.children || []).length){
        loadSession(hit, function(){ applyAddr(addr); });
        return;
      }
      chain.push(hit);
      cur = hit;
    }
    path = chain;
    expanded = true;
    openGroups = {};
    drawCrumb();
    sync();
  }

  /* 切到树图时把当前层这一支展开并滚到眼前。地址的每一级都存成「展开」，
     否则选中行可能藏在收起的父行里 —— 看得到高亮，却看不到它在哪。 */
  function treeReveal(addr){
    if (!addr) return;
    var parts = addr.split('/'), acc = '', i;
    for (i = 0; i < parts.length; i++){
      acc = acc ? acc + '/' + parts[i] : parts[i];
      treeOpen['/' + acc] = true;
    }
    drawTrees();
    var box = tbmEl;
    var row = box.querySelector('.trow[data-k="m/' + addr + '"]');
    if (!row) return;
    box.scrollTop = Math.max(0, row.offsetTop - box.clientHeight / 2);
    setCur(addr);
  }
  /* 把水滴挪到选中的那个按钮下面。
     每次都用「按钮相对父容器」实时算，不缓存任何基准 ——
     之前缓存过一次绝对坐标，结果滑动动画进行中被 resize 里的重测读到，
     量到的是动画中间值，于是每次落点都偏一点、还会累积漂移。
     注意只能量 btn 和 mdBox（它们没有 transform），绝不能量 pill 自己。 */
  function movePill(btn){
    if (!pillEl || !btn) return;
    var pr = mdBox.getBoundingClientRect();
    var br = btn.getBoundingClientRect();
    if (!pr.width) return;               /* 还没上屏 */
    /* pill 的 left:0 落在父容器的 padding box 左边缘（即 border 内侧），
       所以要减掉左边框宽度，才对得上按钮的实测位置 */
    var bl = parseFloat(getComputedStyle(mdBox).borderLeftWidth) || 0;
    pillEl.style.left = Math.round(br.left - pr.left - bl) + 'px';
    pillEl.style.width = btn.offsetWidth + 'px';
  }

  /* 两种呈现方式互斥，切模式 = 切显示的容器 + 停/启对应的拉取 */
  function modeSync(){
    var isRain = (MODE === 'rain');
    var isTree = (MODE === 'tree');
    mdBox.className = 'on';
    twBox.className = isTree ? 'on' : '';
    cv.style.display = isRain ? 'block' : 'none';
    adBox.className = 'on' + (adFocused ? ' focus' : '');
    /* 搜索框静息时就是路径栏；树图没有层级路径，给个位置说明占着 */
    if (isRain){
      /* 别写死库名：换了数据源（CSV）还顶着「WorkBuddy资料库」就是在撒谎 */
      if (path.length) drawCrumb();
      else crumb.innerHTML = '<b>' + esc(root && root.name ? root.name : '资料库') + '</b>';
    } else {
      crumb.innerHTML = '<b style="color:var(--muted)">树图 · 全库</b>';
    }
    crumb.style.display = adFocused ? 'none' : 'flex';
    var mbts = mdBox.getElementsByTagName('b'), i;
    for (i = 0; i < mbts.length; i++)
      mbts[i].className = (mbts[i].getAttribute('data-m') === MODE) ? 'on' : '';
    movePill(mdBox.querySelector('b.on'));
    /* 底部提示按模式换：树图里没有圆周、也不能拖圆，
       还写「点开看圆周 · 按住拖动」就是在说另一张页面的事。 */
    if (hintEl) hintEl.textContent = isTree
      ? '点行展开 · 悬停看两侧联动 · 右键更多'
      : '点开看圆周 · 按住拖动 · 右键更多';
    if (isTree){
      /* 从雨图切过来：把当前层记下来，两栏拉回来之后展开到那一行 */
      pendReveal = curAddr || '';
      treeLoaded = false; treePull(); ripStart();
    }
    else ripStop();
    /* 直接用 #mode=tree 进来时，胶囊可能一次都没被写过 —— 补一次，
       否则左上角会空一块，看着像“状态栏丢了”。 */
    if (LIVE && !lvBox.className){
      setLive(statLine() || '', false);
    }
    if (isRain){ resize(); }
  }

  /* ============ 浏览器历史：侧键 / Alt+← / 后退按钮 统一走 popstate ============
     旧做法是拦 mousedown/mouseup 的 button 3/4 —— 不可靠：
     浏览器把侧键解释成历史导航时，mousedown 的 preventDefault 拦不住，
     mouseup 甚至可能不派发。表现就是「有时候管用，有时候直接退出页面」。

     改成接管历史：每次层级变化 pushState 一条，侧键退回时浏览器发 popstate，
     我们只接这一种事件。鼠标侧键、键盘 Alt+←、浏览器后退按钮、触控板手势
     全部自动生效，不需要逐个设备适配。

     快照只存「名字路径」，不存对象引用 —— 1.5 秒轮询会重换整棵树。 */
  var navSig = '', navLock = false, navInit = false, navPending = null;

  function navSigOf(){
    var names = [], i;
    for (i = 0; i < path.length; i++) names.push((path[i] && path[i].name) || '');
    return SOURCE + '\u0001' + names.join('\u0001');
  }

  function navTick(){
    if (navLock) return;
    var s2 = navSigOf();
    if (s2 === navSig) return;
    navSig = s2;
    try {
      if (!navInit){ history.replaceState({ rd: s2 }, ''); navInit = true; }
      else history.pushState({ rd: s2 }, '');
    } catch (e) {}
  }

  /* 按名字逐级重建 path。找不到就停在能到的那一层，不抛错。 */
  function navApply(names){
    if (!root) return false;
    path = [root];
    for (var i = 1; i < names.length; i++){
      var kids = path[path.length - 1].children || [], hit = null;
      for (var j = 0; j < kids.length; j++){
        if (kids[j].name === names[i]){ hit = kids[j]; break; }
      }
      if (!hit) break;
      path.push(hit);
    }
    expanded = true;
    openGroups = {};
    drawCrumb();
    sync();
    return true;
  }

  function navGoto(st){
    var rd = st && st.rd;
    if (!rd) return;
    var parts = rd.split('\u0001');
    var src = parts[0], names = parts.slice(1);
    navLock = true;
    try {
      if (src !== SOURCE){
        /* 跨数据源后退：先切源，路径等树回来再补（applyLive 里认领 navPending） */
        switchSource(src);
        navPending = names;
      } else {
        navApply(names);
      }
    } catch (e) {
      /* 恢复失败就停在原地，总比整页白掉好 */
    }
    navSig = rd;
    setTimeout(function(){ navLock = false; }, 120);
  }

  window.addEventListener('popstate', function(e){
    navGoto(e.state);
  });


  /* ============ 搜索框：会话标题 + 文件名都能搜 ============ */
  function qBuild(cb){
    if (qIndex) return cb(qIndex);
    Promise.all([
      fetch('/api/library?source=' + SOURCE, { cache: 'no-store' }).then(function(r){ return r.json(); }),
      fetch('/api/disk', { cache: 'no-store' }).then(function(r){ return r.json(); })
    ]).then(function(arr){
      var out = [], lib = arr[0] || {}, dsk = arr[1] || {};
      var ws = (lib.tree && lib.tree.children) || [], i, j, k;
      for (i = 0; i < ws.length; i++){
        var top = ws[i], ks = top.children || [];
        for (j = 0; j < ks.length; j++){
          if (ks[j].sid){                       /* 直接是会话 */
            out.push({
              kind: 'session', name: ks[j].name || '(无标题)',
              ws: top.name, chain: [top.name],
              alias: top.wid || '',          /* 显示名改过，原始键仍要能搜到 */
              sid: ks[j].sid, steps: ks[j].steps || 0
            });
          } else {                              /* 任务：下面还有一层会话 */
            var ss = ks[j].children || [];
            for (k = 0; k < ss.length; k++){
              out.push({
                kind: 'session', name: ss[k].name || '(无标题)',
                ws: top.name + ' › ' + ks[j].name,
                chain: [top.name, ks[j].name],
                alias: (top.wid || '') + ' ' + (ks[j].wid || ''),
                sid: ss[k].sid, steps: ss[k].steps || 0
              });
            }
          }
        }
      }
      var dirs = (dsk.tree && dsk.tree.children) || [];
      for (i = 0; i < dirs.length; i++){
        var fs = dirs[i].children || [];
        for (j = 0; j < fs.length; j++){
          out.push({
            kind: 'file', name: fs[j].name || '',
            ws: dirs[i].name, sid: fs[j].sid,
            alias: dirs[i].wid || '',
            note: String(fs[j].note || '').replace(/^→\s*/, '')
          });
        }
      }
      qIndex = out;
      cb(out);
    }).catch(function(){ cb([]); });
  }

  function qRender(hits){
    if (!hits.length){
      qList.innerHTML = '<em>没有匹配</em>';
      qList.className = 'on';
      qList.__hits = [];
      return;
    }
    var out = [], i, h;
    for (i = 0; i < hits.length; i++){
      h = hits[i];
      if (h.kind === 'file'){
        out.push('<div data-i="' + i + '"><u class="mono">' + esc(h.name) + '</u>'
          + '<s>' + esc(h.note.slice(0, 20)) + '</s></div>');
      } else {
        out.push('<div data-i="' + i + '"><u>' + esc(h.name) + '</u>'
          + '<s>' + esc(h.ws) + ' · ' + h.steps + ' 步'
          + (h.where && h.where !== '标题' ? ' · ' + esc(h.where) : '') + '</s>'
          + (h.snippet ? '<p class="qsnip">' + esc(h.snippet) + '</p>' : '')
          + '</div>');
      }
    }
    qList.innerHTML = out.join('');
    qList.className = 'on';
    qList.__hits = hits;
  }

  function qRun(){
    var kw = (qEl.value || '').trim().toLowerCase();
    if (!kw){ qList.className = ''; qList.__hits = null; return; }
    qBuild(function(arr){
      var hits = [], i, h;
      for (i = 0; i < arr.length && hits.length < 40; i++){
        h = arr[i];
        if (String(h.name).toLowerCase().indexOf(kw) >= 0
          || String(h.ws).toLowerCase().indexOf(kw) >= 0
          || String(h.alias || '').toLowerCase().indexOf(kw) >= 0) hits.push(h);
      }
      /* 标题命中先在本地算完就画（索引已经在内存里，这是即时的）；
         正文命中交给服务端算，回来再补 —— 两边合起来才画的话，
         打字时会有一段什么都看不见的空档。 */
      if (hits.length) qRender(hits);
      else { qList.innerHTML = '<em>搜索正文…</em>'; qList.className = 'on'; qList.__hits = []; }
      qBodySearch(kw, hits);
    });
  }

  /* 正文搜索：标题那一层搜的是「这条会话叫什么」，这一层搜的是「里面说过什么」。
     语料留在服务端（见 live_server 的 /api/search），只回命中会话和上下文片段 ——
     全库正文几 MB，随首屏下发等于把「打开就卡」写进架构。
     qSeq 用来丢过期结果：边打边搜时，慢回来的旧请求不能盖住新结果。 */
  var qSeq = 0;
  function qBodySearch(kw, base){
    var my = ++qSeq;
    fetch('/api/search?limit=40&q=' + encodeURIComponent(kw), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (my !== qSeq) return;                    /* 已经又打了字，这批作废 */
        var seen = {}, out = [], got = (d && d.hits) || [], i, h;
        for (i = 0; i < base.length; i++){ seen[base[i].sid] = 1; out.push(base[i]); }
        for (i = 0; i < got.length && out.length < 40; i++){
          h = got[i];
          if (!h.sid || seen[h.sid]) continue;      /* 标题已经列过，不要出现两遍 */
          seen[h.sid] = 1;
          out.push({
            kind: 'session', name: h.name, ws: h.ws, chain: [h.ws],
            alias: '', sid: h.sid, steps: h.steps,
            where: h.where, snippet: h.snippet
          });
        }
        /* 一条都没多出来就不重绘：标题那批已经在屏幕上了，白重绘会闪 */
        if (!base.length || out.length > base.length) qRender(out);
      })
      .catch(function(){ /* 服务没起就算了，标题那批还留着 */ });
  }

  function qJump(h){
    qList.className = '';
    qList.__hits = null;
    qEl.value = '';
    adBlur();
    if (MODE !== 'rain' || VIEW !== 'library'){
      MODE = 'rain'; VIEW = 'library';
      modeSync();
    }
    function go(){
      if (!root || !root.children) return;
      path = [root];
      expanded = true;
      openGroups = {};
      var chain = h.chain || [h.ws];      /* 任务里的会话要下两层 */
      var step = 0;

      function finish(){
        var cur = path[path.length - 1], sNode = null, j;
        for (j = 0; j < (cur.children || []).length; j++)
          if (cur.children[j].sid === h.sid){ sNode = cur.children[j]; break; }
        if (sNode){
          path.push(sNode);
          drawCrumb();
          if (sNode.lazy && sNode.sid) loadSession(sNode, function(){ sync(); });
          else sync();
        } else {
          drawCrumb();
          sync();
        }
        spawnRipple(CX, CY, 120, 0.7);
      }

      function descend(){
        if (step >= chain.length){ finish(); return; }
        var cur = path[path.length - 1], kids = cur.children || [], hit = null, i2;
        for (i2 = 0; i2 < kids.length; i2++)
          if (kids[i2].name === chain[step]){ hit = kids[i2]; break; }
        if (!hit){ finish(); return; }         /* 找不到就停在当前层 */
        if (hit.lazyWs && !(hit.children && hit.children.length)){
          wsLoad(hit, function(){ path.push(hit); step++; descend(); });
          return;
        }
        path.push(hit); step++; descend();
      }

      descend();
    }
    if (!root || !root.children || !root.children.length){
      livePull();
      setTimeout(go, 700);
    } else {
      go();
    }
  }

  /* 把当前层级拼成一行路径，像资源管理器的地址栏 */
  function pathText(){
    var arr = [], i;
    for (i = 0; i < path.length; i++){
      if (path[i] && path[i].name) arr.push(path[i].name);
    }
    if (arr.length) return arr.join(' › ');
    /* 树图没有层级路径，退回用说明文字 */
    return (crumb.textContent || '').trim();
  }

  function adFocus(){
    if (adFocused) return;
    adFocused = true;
    adBox.className = 'on focus';
    crumb.style.display = 'none';
    /* 点空白处＝把整条路径装进输入框并全选：直接打字就是替换，不用先删 */
    qEl.value = pathText();
    qList.className = '';
    qEl.focus();
    try { qEl.select(); } catch (e) {}
  }

  function adBlur(){
    if (!adFocused) return;
    adFocused = false;
    adBox.className = 'on';
    crumb.style.display = 'flex';
    qList.className = '';
    qEl.value = '';                 /* 退出输入态就还原成路径显示 */
    if (qEl.blur) qEl.blur();
  }

  /* 从服务端拉一次；seq 没变就什么都不做（避免每 1.5 秒抖动一遍） */
  /* 报到 + 取命令。心跳必须发在 livePull 最前面：
     树图模式会提前 return，要是心跳放在后面，一切到树图 AI 就以为「雨图关了」。 */
  function beatPull(){
    fetch('/api/beat', { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.cmd) applyCmd(d.cmd); })
      .catch(function(){ /* 服务没起就算了，下一轮再试 */ });
  }

  /* AI 让雨图跳到某一层。只跳，不做任何高亮 ——
     qJump 结尾本来就会放一圈波纹，那就是「跳到了」的反馈，再加亮边反而乱。 */
  function applyCmd(c){
    if (!c || !c.chain || !c.chain.length) return;
    if (adFocused) return;                 /* 正在搜索框里打字，别抢焦点 */
    qJump({ chain: c.chain, sid: c.sid || '' });
  }

  function livePull(){
    if (offline) return;                   /* 离线：不拉新数据，画面冻住 */
    beatPull();
    if (MODE === 'tree'){ treePull(); return; }
    var url = (!SOURCE) ? '/api/roots'
      : (VIEW === 'library')
        ? '/api/shelves?source=' + SOURCE
        : '/api/tree?view=' + VIEW;
    fetch(url, { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.tree) return;
        liveFail = 0;
        /* 服务端可能把 workbuddy 退成了 csv（对方机器没装 WorkBuddy）。
           以它返回的 source 为准，否则后续请求会一直带着旧源名。 */
        if (d.source && d.source !== SOURCE) SOURCE = d.source;
        var sq = d.seq || d.scanned || 0;
        if (sq === liveSeq) return;
        liveSeq = sq;
        var __l0 = PERF ? pfT() : 0;
        applyLive(d);
        if (PERF){ pfStat.live = pfT() - __l0; pfStat.liveN = (pfStat.liveN || 0) + 1; }
      })
      .catch(function(){
        liveFail++;
        setLive('请双击启动脚本', true);
      });
  }

  /* 会话是个懒加载节点：点开才去读它的明细，不然 99 个会话一次性拉过来是几 MB */
  var SESSION_PAGE = 200;   /* 一次取多少个回合 —— 超过这个数就分页 */
  function loadSession(node, cb){
    if (!node || !node.sid || node.loading) return;
    node.loading = true;
    /* tail=1：取**最后** 200 个回合，不是最前面 200 个。
       原来取头部，一个 240 回合的会话里最新 40 回合压根没装进来 ——
       点开看到的是三天前的开头，而且再怎么轮询也不会动。
       回合数不超过一页时，服务端算出来的 offset 就是 0，行为跟以前一样。 */
    fetch('/api/session?id=' + encodeURIComponent(node.sid) +
          '&limit=' + SESSION_PAGE + '&tail=1',
          { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        node.loading = false;
        if (d && d.tree && d.tree.children && d.tree.children.length){
          node.children = d.tree.children;
          stampKids(node);
          node.lazy = false;
          /* 前面还有多少个回合没装进来（滑出窗口的老回合） */
          node.more = d.tree._offset || 0;
          cb && cb();
        } else {
          /* 静默：到底了不是异常，胶囊继续报统计，不弹这类提示 */
        }
      })
      .catch(function(){
        node.loading = false;
        setLive('未识别会话', true);
      });
  }

  /* 点工作区时才拉它的会话列表：首屏不再扛 100 个会话 */
  function wsLoad(node, cb){
    if (!node || node.__loading) return;
    node.__loading = true;
    /* 显示名可能是「任务 · xxx」这类标签，查询要用原始键 wid */
    fetch('/api/ws?wid=' + encodeURIComponent(node.wid || node.name), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        node.__loading = false;
        node.children = (d && d.children) || [];
        stampKids(node);
        node.lazyWs = false;
        if (!node.children.length){
          setLive('无会话', false);
          return;
        }
        cb && cb();
      })
      .catch(function(){
        node.__loading = false;
        setLive('未识别工作区', true);
      });
  }
