<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raindrop Chart · 点与周长</title>
<!-- 标签页图标：和桌面快捷方式同一张图。放在这里而不是根目录，
     因为静态服务只认当前目录这一层。直接双击打开（file://）时找不到也无所谓，
     浏览器会退回默认的空白页图标。 -->
<link rel="icon" type="image/x-icon" href="icon.ico">
<style>
  /* ---- 主题 token：蓝（默认） ----
     材质配方来自「天时-风格参考 iPhone透明风格」：模糊 + 增色 + 叠白 + 亮边。
     六套主题 = :root(蓝) + 五个 html[data-theme="..."] 覆盖块（绿/米白/粉/紫/黑）。
     任何组件都不许再写死色值，否则换主题时会剩下几块没跟着变。 */
  :root{
    /* ---- 六套主题的「圆面色 / 圆描边」 ----
       右键菜单那六个色块要用的是「各套主题里雨滴长什么样」，可它必须同时
       显示六种不同颜色 —— 直接读 --cv-dot 只能读到当前主题那一套。
       所以在这里各存一份，下面每套主题的 --cv-dot / --cv-dot-brd 也指向
       同一份常量。要调某套的圆面颜色，只改这里一处，主题和色块一起变。 */
    --t-blue-face:#E4EAF4;   --t-blue-edge:rgba(146,162,190,.9);
    --t-green-face:#E1EDE5;  --t-green-edge:rgba(139,168,149,.9);
    --t-beige-face:#EEEBE5;  --t-beige-edge:rgba(196,192,182,.95);
    --t-pink-face:#F7E3E9;   --t-pink-edge:rgba(198,148,161,.9);
    --t-purple-face:#E7E1F7; --t-purple-edge:rgba(158,146,190,.9);
    --t-dark-face:#262E3B;   --t-dark-edge:rgba(255,255,255,.24);

    /* 底与字 —— 冷调：底是冷白、字是冷黑，配蓝主色才不打架 */
    --paper:#F1F4F9;                 /* 页面底 */
    --surface:rgba(255,255,255,.58); /* 列/卡片：半透明，让背景光晕透上来 */
    --surface-hi:rgba(255,255,255,.62);  /* 表头，比列底实一点 */
    --ink:#1B2029;                   /* 主文字 */
    --muted:#6B7383;                 /* 次文字 */
    --axis:#D3D9E4;                  /* 分割线 / 描边 */
    --hair:#B9C1CF;                  /* 更浅的分隔符、面包屑斜线 */
    --ghost:#A6AEBC;                 /* 占位、禁用、数字后缀 */
    --ghost2:#98A1B0;
    --rule:#EDF0F5;                  /* 列表行的分隔线，几乎看不见那种 */

    /* 主色与语义色 */
    --accent:#0A6CFF;                /* 蓝：比参考图的 #0071ff 略深，白字压上去才够对比 */
    --accent-ink:#0052CC;            /* 强调文字，比主色深一档 */
    --on-accent:#fff;                /* 压在 accent 上的字色 */
    --danger:#D93A2B;
    --ok:#2FBFA6;
    --track:rgba(10,108,255,.18);    /* 滑块轨道 */

    /* 玻璃材质 */
    --panel:rgba(255,255,255,.84);         /* 顶栏控件 */
    --panel-soft:rgba(255,255,255,.72);
    --panel-strong:rgba(255,255,255,.93);  /* 必须挡字的浮层 */
    --panel-solid:#fff;
    --panel-brd:rgba(211,217,228,.95);
    --panel-brd-soft:rgba(211,217,228,.75);
    --glass:blur(16px) saturate(180%);
    --glass-sm:blur(8px) saturate(180%);
    --shadow:0 14px 38px rgba(20,30,50,.16);
    --shadow-sm:0 10px 28px rgba(20,30,50,.12);
    --shadow-lg:0 20px 48px rgba(20,30,50,.22);
    /* 树图两栏专用：面积大、又是并排两块，同样浓度的阴影会显得很重，
       所以单独一档更浅更短的。别拿 --shadow-sm 凑合。 */
    --shadow-col:0 6px 18px rgba(20,30,50,.075);
    --hl:inset 0 1px 0 rgba(255,255,255,.60);   /* 玻璃上沿那道亮边 */
    --hover:rgba(10,108,255,.10);
    --hover-soft:rgba(10,108,255,.07);
    --hover-strong:rgba(10,108,255,.13);
    --press:rgba(20,30,50,.07);

    /* Canvas 专用：雨图的圆和线是画上去的，读不到上面的变量，单独一组 */
    --cv-dot:var(--t-blue-face);
    --cv-dot-hi:#CFE0FB;
    --cv-dot2:#D9E1ED;
    --cv-dot2-hi:#C3D8F7;
    --cv-dot-brd:var(--t-blue-edge);
    --cv-dot-brd2:rgba(128,146,176,.95);
    --cv-dot-brd-hi:rgba(10,108,255,.85);
    --cv-ink:rgba(27,32,41,.88);
    --cv-ink2:rgba(27,32,41,.86);
    --cv-sub:rgba(107,115,131,.95);
    --cv-line:rgba(150,160,178,.85);
    --cv-hl:rgba(255,255,255,.34);
    --rgb-accent:10,108,255;         /* 涟漪和雨丝要拼动态 alpha，只能存三元组 */

    /* 背景三团光的颜色。以前整条 background 写死在 body 上，
       每加一套主题就得复制一遍那四行 radial-gradient；抽成变量后
       换主题只改这三个值，body 只写一次。 */
    --glow1:rgba(60,130,255,.10);
    --glow2:rgba(120,110,255,.07);
    --glow3:rgba(40,180,220,.07);

    /* 浮层圆角：搜索框 / 状态胶囊 / 下拉 / 模式按钮组共用同一个值，
       免得各写各的、并排时能看出不齐。16 已接近这些元素半高，两端接成胶囊。 */
    --r-panel:16px;
    /* 黄金比。目前只用在一处：树图版式的上下留白（上 : 下 = 1 : φ）。
       改这一个数，底部留白跟着变，不用翻两处。 */
    --phi:1.618;
  }

  /* ---- 暗色琉璃 ----
     不是把亮色反相。暗色面板几乎透明，轮廓全靠那 1px 亮边给出，
     所以描边和 --hl 在这里更不能省；主色要提亮一档，否则压在深底上发脏。 */
  html[data-theme="dark"]{
    --paper:#0B0E13;
    --surface:rgba(30,36,47,.62);
    --surface-hi:rgba(40,48,62,.55);
    --ink:#E8EBF1;
    --muted:#8D95A1;
    --axis:rgba(255,255,255,.13);
    --hair:rgba(255,255,255,.30);
    --ghost:rgba(255,255,255,.38);
    --ghost2:rgba(255,255,255,.28);
    --rule:rgba(255,255,255,.07);

    --accent:#4FB8C2;
    --accent-ink:#8FE3E8;
    --on-accent:#06181C;             /* 亮青上当白字看不清，压深字 */
    --danger:#FF7A5E;
    --ok:#7FE0D2;
    --track:rgba(79,184,194,.24);

    --panel:rgba(38,45,58,.70);
    --panel-soft:rgba(38,45,58,.58);
    --panel-strong:rgba(26,32,42,.92);
    --panel-solid:#161B24;
    --panel-brd:rgba(255,255,255,.15);
    --panel-brd-soft:rgba(255,255,255,.10);
    --glass:blur(20px) saturate(170%);
    --glass-sm:blur(10px) saturate(170%);
    --shadow:0 16px 40px rgba(0,0,0,.62);
    --shadow-sm:0 10px 26px rgba(0,0,0,.52);
    --shadow-lg:0 22px 52px rgba(0,0,0,.72);
    --shadow-col:0 6px 20px rgba(0,0,0,.36);
    --hl:inset 0 1px 0 rgba(255,255,255,.18);
    --hover:rgba(79,184,194,.16);
    --hover-soft:rgba(79,184,194,.12);
    --hover-strong:rgba(79,184,194,.20);
    --press:rgba(255,255,255,.08);

    --cv-dot:var(--t-dark-face);
    --cv-dot-hi:#2E4050;
    --cv-dot2:#2B3341;
    --cv-dot2-hi:#354555;
    --cv-dot-brd:var(--t-dark-edge);
    --cv-dot-brd2:rgba(255,255,255,.20);
    --cv-dot-brd-hi:rgba(79,184,194,.85);
    --cv-ink:rgba(232,235,241,.92);
    --cv-ink2:rgba(232,235,241,.86);
    --cv-sub:rgba(160,168,180,.92);
    --cv-line:rgba(255,255,255,.22);
    --cv-hl:rgba(255,255,255,.10);
    --rgb-accent:79,184,194;

    --glow1:rgba(43,92,255,.15);
    --glow2:rgba(122,60,255,.12);
    --glow3:rgba(0,194,209,.10);
  }

  /* ================= 其余四套主题 =================
     只有亮色系这一层在变：底面、字色、主色、Canvas 圆点色。
     玻璃材质（--glass / --shadow / --hl / --panel-*）在亮色系里通用，
     统一沿用 :root，不在这里重复 —— 重复一次就多一处要同步维护。
     每套都必须带齐 --glow1~3，否则会残留上一套的光斑，看着像没换干净。 */

  /* ---- 绿：草木 ---- */
  html[data-theme="green"]{
    --paper:#EFF4F0;
    --ink:#17211A;
    --muted:#5E6E63;
    --axis:#CDDCD2;
    --hair:#B2C3B7;
    --ghost:#A1B1A5;
    --ghost2:#93A498;
    --rule:#E8F0EA;
    /* 面板描边跟着底走，不然暖绿底上一条冷灰边会显脏 */
    --panel-brd:rgba(205,220,210,.95);
    --panel-brd-soft:rgba(205,220,210,.75);

    --accent:#12855A;
    --accent-ink:#0A6642;
    --on-accent:#fff;
    --track:rgba(18,133,90,.18);
    --hover:rgba(18,133,90,.10);
    --hover-soft:rgba(18,133,90,.07);
    --hover-strong:rgba(18,133,90,.13);

    --cv-dot:var(--t-green-face);
    --cv-dot-hi:#CEE6D6;
    --cv-dot2:#D7E5DC;
    --cv-dot2-hi:#C1DBC9;
    --cv-dot-brd:var(--t-green-edge);
    --cv-dot-brd2:rgba(120,152,130,.95);
    --cv-dot-brd-hi:rgba(18,133,90,.85);
    --cv-ink:rgba(23,33,26,.88);
    --cv-ink2:rgba(23,33,26,.86);
    --cv-sub:rgba(94,110,99,.95);
    --cv-line:rgba(148,170,156,.85);
    --cv-hl:rgba(255,255,255,.34);
    --rgb-accent:18,133,90;

    --glow1:rgba(30,170,110,.11);
    --glow2:rgba(120,200,150,.07);
    --glow3:rgba(40,180,190,.06);
  }

  /* ---- 米白：最初那版纸色青（其余主题都是后来从蓝改出来的） ---- */
  html[data-theme="beige"]{
    --paper:#F6F4F0;
    --ink:#33312D;
    --muted:#8A867C;
    --axis:#D8D4CB;
    --hair:#C4C0B6;
    --ghost:#ADA89D;
    --ghost2:#A09B90;
    --rule:#EFECE5;
    --panel-brd:rgba(216,212,203,.95);
    --panel-brd-soft:rgba(216,212,203,.75);

    --accent:#2E7D8A;
    --accent-ink:#0F6E56;
    --on-accent:#fff;
    --track:rgba(46,125,138,.18);
    --hover:rgba(46,125,138,.10);
    --hover-soft:rgba(46,125,138,.07);
    --hover-strong:rgba(46,125,138,.13);

    --cv-dot:var(--t-beige-face);
    --cv-dot-hi:#DFEDEA;
    --cv-dot2:#DAD6CE;
    --cv-dot2-hi:#D2DEDA;
    --cv-dot-brd:var(--t-beige-edge);
    --cv-dot-brd2:rgba(158,153,143,.95);
    --cv-dot-brd-hi:rgba(46,125,138,.85);
    --cv-ink:rgba(51,49,45,.88);
    --cv-ink2:rgba(51,49,45,.86);
    --cv-sub:rgba(138,134,124,.95);
    --cv-line:rgba(180,175,163,.85);
    --cv-hl:rgba(255,255,255,.34);
    --rgb-accent:46,125,138;

    --glow1:rgba(60,150,160,.09);
    --glow2:rgba(205,180,140,.10);
    --glow3:rgba(90,140,120,.06);
  }

  /* ---- 粉：樱 ---- */
  html[data-theme="pink"]{
    --paper:#F9F0F2;
    --ink:#291D21;
    --muted:#7D6870;
    --axis:#E7D2D8;
    --hair:#D6BAC1;
    --ghost:#C1A9B0;
    --ghost2:#B49CA3;
    --rule:#F6E9ED;
    --panel-brd:rgba(231,210,216,.95);
    --panel-brd-soft:rgba(231,210,216,.75);

    --accent:#CF3A72;
    --accent-ink:#A62558;
    --on-accent:#fff;
    --track:rgba(207,58,114,.18);
    --hover:rgba(207,58,114,.10);
    --hover-soft:rgba(207,58,114,.07);
    --hover-strong:rgba(207,58,114,.13);

    --cv-dot:var(--t-pink-face);
    --cv-dot-hi:#F5D1DD;
    --cv-dot2:#EFD5DD;
    --cv-dot2-hi:#EAC1CD;
    --cv-dot-brd:var(--t-pink-edge);
    --cv-dot-brd2:rgba(180,130,145,.95);
    --cv-dot-brd-hi:rgba(207,58,114,.85);
    --cv-ink:rgba(41,29,33,.88);
    --cv-ink2:rgba(41,29,33,.86);
    --cv-sub:rgba(125,104,112,.95);
    --cv-line:rgba(192,162,172,.85);
    --cv-hl:rgba(255,255,255,.34);
    --rgb-accent:207,58,114;

    --glow1:rgba(240,90,140,.10);
    --glow2:rgba(180,120,255,.07);
    --glow3:rgba(255,170,120,.07);
  }

  /* ---- 紫：藕 ---- */
  html[data-theme="purple"]{
    --paper:#F2EFFA;
    --ink:#241E33;
    --muted:#6D6583;
    --axis:#DAD2EB;
    --hair:#C4B8D9;
    --ghost:#AEA3C3;
    --ghost2:#A196B5;
    --rule:#EEE9F6;
    --panel-brd:rgba(218,210,235,.95);
    --panel-brd-soft:rgba(218,210,235,.75);

    --accent:#6C4BD1;
    --accent-ink:#5433B8;
    --on-accent:#fff;
    --track:rgba(108,75,209,.18);
    --hover:rgba(108,75,209,.10);
    --hover-soft:rgba(108,75,209,.07);
    --hover-strong:rgba(108,75,209,.13);

    --cv-dot:var(--t-purple-face);
    --cv-dot-hi:#DBD0F2;
    --cv-dot2:#DED7EE;
    --cv-dot2-hi:#CFC5E9;
    --cv-dot-brd:var(--t-purple-edge);
    --cv-dot-brd2:rgba(140,126,176,.95);
    --cv-dot-brd-hi:rgba(108,75,209,.85);
    --cv-ink:rgba(36,30,51,.88);
    --cv-ink2:rgba(36,30,51,.86);
    --cv-sub:rgba(109,101,131,.95);
    --cv-line:rgba(163,153,188,.85);
    --cv-hl:rgba(255,255,255,.34);
    --rgb-accent:108,75,209;

    --glow1:rgba(110,80,255,.11);
    --glow2:rgba(180,110,255,.07);
    --glow3:rgba(60,140,255,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  /* 背景不是纯色，是几团低饱和光斑 —— 玻璃得有东西可透，纯色底上做玻璃就是灰纸。
     光斑极淡（alpha .09~.10），只在纸色上带一点点冷暖，不抢内容。 */
  body{
    background:
      radial-gradient(58% 48% at 12% 16%, var(--glow1), transparent 72%),
      radial-gradient(52% 44% at 88% 26%, var(--glow2), transparent 72%),
      radial-gradient(58% 52% at 64% 92%, var(--glow3), transparent 72%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
    transition:background-color .35s ease,color .35s ease;
  }
  /* ---- 换主题：整页淡入 ----
     底色和文字色由 body 上那条 .35s transition 负责（见 body 规则）。
     但菜单 / 胶囊 / 搜索框 / 列这些浮层自己没有过渡，底色在渐变、它们
     「啪」地跳变会显得不齐。切主题时给 html 挂 .theming，把这几个补上过渡；
     只挂 420ms 就摘掉 —— 平时不留全局过渡，免得雨图高频重绘被无谓的过渡拖累。 */
  html.theming #modes,html.theming #live,html.theming #addr,html.theming #qlist,
  html.theming #ctx,html.theming #ctx i,html.theming #ctx hr,
  html.theming #ctx .sw,html.theming #tune,html.theming #tip,
  html.theming .tcol{
    transition:background-color .35s ease,color .35s ease,border-color .35s ease,
               box-shadow .35s ease;
  }
  @media (prefers-reduced-motion:reduce){
    body,html.theming #modes,html.theming #live,html.theming #addr,html.theming #qlist,
    html.theming #ctx,html.theming #ctx i,html.theming #ctx hr,
    html.theming #ctx .sw,html.theming #tune,html.theming #tip,
    html.theming .tcol{transition:none}
  }

  #cv{display:block;width:100vw;height:100vh;touch-action:none;cursor:default}
  /* ---- 正上方的搜索框：静息显示路径，点击变输入 ---- */
  #addr{
    /* top 20 = 与两个胶囊同一条基线。高度都收到 30 之后，三者中线才对得齐
       （原来搜索框 34 高踩 18，中心也是 35，是另一套算法） */
    position:fixed;top:20px;left:50%;transform:translateX(-50%);
    /* 两侧各留 280：左边状态胶囊文案最长时能到 260 上下，原来留 220 会贴上去 */
    width:420px;max-width:calc(100vw - 560px);min-width:200px;height:30px;
    z-index:31;display:none;align-items:center;gap:7px;padding:0 12px;
    background:var(--panel);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
    /* 两端全圆：radius 拉到大于半高，浏览器会钳成 17（34 的一半），两端成正半圆。
       用 999 而不是写死 17 —— 以后改高度也不用回来改这里。 */
    border:1px solid var(--panel-brd);border-radius:999px;
    box-shadow:var(--hl);
    font-size:12px;color:var(--muted);user-select:none;
  }
  #addr.on{display:flex}
  #addr.focus{border-color:var(--accent);background:var(--panel-solid);user-select:text}
  /* 左端那一格：放大镜和 × 叠在同一位置，同一时刻只露一个。
     静止时放大镜＝「这里能搜」；一旦进入输入就换成 ×＝「清空」。
     两者做成同格绝对定位，切换时不会让后面的文字左右挪位。 */
  #addr .ico{position:relative;flex:0 0 auto;width:14px;height:14px}
  #addr .mag{
    position:absolute;left:1px;top:1px;
    width:12px;height:12px;opacity:.5;
  }
  #crumb{
    flex:1 1 auto;min-width:0;
    font-size:12px;color:var(--muted);
    display:flex;align-items:center;gap:2px;
    overflow:hidden;white-space:nowrap;cursor:text;
  }
  #addr.focus #crumb{display:none}
  #crumb b{
    font-weight:500;color:var(--ink);cursor:pointer;
    padding:2px 4px;border-radius:4px;transition:.15s;
    overflow:hidden;text-overflow:ellipsis;max-width:170px;
  }
  #crumb b:hover{background:var(--hover);color:var(--accent-ink)}
  #crumb i{font-style:normal;color:var(--hair)}
  #q{
    display:none;flex:1 1 auto;min-width:0;height:26px;
    border:none;outline:none;background:none;
    font:12px/1 system-ui,-apple-system,"PingFang SC",sans-serif;color:var(--ink);
  }
  #addr.focus #q{display:block}
  #q::placeholder{color:var(--ghost)}
  /* × 只在输入态出现，且只负责“全部删除” —— 点别处不会清空 */
  /* × 和放大镜同格（见上面的 .ico）。只在输入态出现，负责「全部删除」 */
  #qx{
    display:none;
    position:absolute;left:0;top:0;
    width:14px;height:14px;border-radius:50%;
    align-items:center;justify-content:center;
    font-size:14px;line-height:1;color:var(--ghost2);cursor:pointer;
  }
  #addr.focus #qx{display:flex}
  #addr.focus .mag{display:none}
  #qx:hover{background:var(--press);color:var(--ink)}
  #qlist{
    position:absolute;top:34px;left:0;right:0;max-height:320px;overflow:auto;
    display:none;background:var(--panel-solid);border:1px solid var(--panel-brd);border-radius:var(--r-panel);
    box-shadow:var(--shadow-sm);z-index:32;
  }
  #qlist.on{display:block}
  #qlist div{padding:7px 11px;font-size:11.5px;cursor:pointer;line-height:1.5;
    border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #qlist div:last-child{border-bottom:none}
  #qlist div:hover{background:var(--hover-soft)}
  #qlist u{text-decoration:none;color:var(--accent-ink)}
  #qlist s{text-decoration:none;color:var(--ghost);font-size:10.5px;margin-left:6px}
  #qlist em{font-style:normal;color:var(--muted);padding:8px 11px;font-size:11px;display:block}
  /* 正文命中的上下文片段：最多两行，超出打点 —— 搜索框只有一列窄条，
     片段要是铺开三行，一次就只能看见一条结果，反而更难挑。 */
  #qlist p.qsnip{margin:2px 0 0;padding:0;font-size:10.5px;color:var(--ghost);
    line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  #qlist .mono{font-family:ui-monospace,Consolas,monospace}
  /* ---- 悬浮提示：与右键菜单同一套材质（白玻璃 / 细边 / 大阴影 / 同心圆角） ---- */
  #tip{
    position:fixed;left:0;top:0;z-index:55;pointer-events:none;opacity:0;
    transform:translate(-50%,-150%);
    /* 同心：外 16 − 边框 1 − 内边距 5 = 内 10，和 #ctx 完全一致 */
    --ctx-r:var(--r-panel);
    --ctx-pad:5px;
    background:var(--panel-strong);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
    border:1px solid var(--panel-brd);
    border-radius:var(--ctx-r);padding:var(--ctx-pad);
    box-shadow:var(--hl),var(--shadow);
    color:var(--ink);
    font-size:11.5px;line-height:1.5;white-space:nowrap;
    /* 给个下限：只有一行的卡片不会窄成一条，悬停移动时宽度不会一路缩窄 */
    min-width:128px;max-width:300px;
    transition:opacity .12s ease;
  }
  #tip hr{
    border:none;border-top:1px solid var(--panel-brd-soft);
    margin:4px 6px;
  }
  /* 标题行：比菜单项略大一号，但不加粗到抢眼 */
  #tip .th{
    font-weight:500;font-size:12px;padding:2px 12px 0;
    overflow:hidden;text-overflow:ellipsis;max-width:264px;
  }
  /* 副标题缺席时（末端节点没有量可说），标题自己撑满，补一点下边距 */
  #tip .th:last-child{padding-bottom:4px}
  /* 副标题行：跟菜单项的 <s> 同级灰度，读起来是“注释”而不是“内容” */
  #tip .ts{
    color:var(--muted);font-size:10.5px;padding:0 12px 3px;
    overflow:hidden;text-overflow:ellipsis;max-width:264px;
  }
  /* 前三个会话：沿用菜单「左边名字 / 右边数字」的行式，只去掉悬停与手型 */
  #tip .tr{
    display:flex;align-items:center;gap:8px;
    padding:4px 12px;font-size:11px;
    border-radius:calc(var(--ctx-r) - var(--ctx-pad) - 1px);
  }
  #tip .tr i{
    font-style:normal;width:9px;flex:0 0 auto;text-align:right;
    color:var(--ghost);font-size:10px;
  }
  #tip .tr em{
    font-style:normal;flex:1 1 auto;min-width:0;max-width:196px;
    overflow:hidden;text-overflow:ellipsis;
  }
  #tip .tr s{
    text-decoration:none;flex:0 0 auto;
    color:var(--ghost);font-size:10.5px;
  }
  /* ---- 右键菜单 ----
     #ctx2 是它的二级菜单（子项浮层）。两者共用同一套材质、内边距与圆角，
     只有位置和 z-index 不同：二级必须压在父菜单之上，否则会被父菜单的
     阴影糊住一条边。 */
  #ctx,#ctx2{
    position:fixed;z-index:60;display:none;min-width:176px;
    background:var(--panel-strong);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
    border:1px solid var(--panel-brd);
    /* 同心：外 16 − 边框 1 − 内边距 5 = 内 10 */
    --ctx-r:var(--r-panel);
    --ctx-pad:5px;
    border-radius:var(--ctx-r);padding:var(--ctx-pad);
    box-shadow:var(--hl),var(--shadow);
    font-size:11.5px;color:var(--ink);user-select:none;
  }
  #ctx.on{display:block}
  #ctx2{z-index:61}
  #ctx2.on{display:block}
  #ctx i,#ctx2 i{
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    padding:7px 12px;white-space:nowrap;
    border-radius:calc(var(--ctx-r) - var(--ctx-pad) - 1px);
    font-style:normal;cursor:pointer;transition:background .12s;
  }
  #ctx i:hover,#ctx2 i:hover{background:var(--hover)}
  #ctx i.off,#ctx2 i.off{color:var(--ghost);cursor:default}
  #ctx i.off:hover,#ctx2 i.off:hover{background:transparent}
  #ctx i s,#ctx2 i s{text-decoration:none;color:var(--ghost);font-size:10.5px;font-weight:400}
  /* 有二级菜单的项：右端一个细箭头，和系统菜单同一个位置、同一个方向。
     用边框画（而不是字符 ›），字号变了也不会跟着变粗细。 */
  #ctx i.sub::after{
    content:'';flex:0 0 auto;
    width:5px;height:5px;margin-left:2px;
    border-right:1.4px solid var(--ghost2);
    border-bottom:1.4px solid var(--ghost2);
    transform:rotate(-45deg);
  }
  /* 二级展开时父项保持高亮，指出「这一层是从哪儿来的」 */
  #ctx i.sub.open{background:var(--hover)}
  #ctx i em{
    font-style:normal;width:6px;height:6px;border-radius:50%;
    background:var(--accent);flex:0 0 auto;
  }
  /* 分区横线属于描边体系，直接引用面板描边色 —— 以前用 soft 那一档，
     在深底上几乎看不见分区，菜单读起来是一整块。 */
  #ctx hr{
    border:none;border-top:1px solid var(--panel-brd);
    margin:4px 6px;
  }
  /* 主题：六个色块。比文字三连好认 —— 「亮色/暗色」这种词在不同人心里
     指的是不同配色，色块不会读错。块本身的颜色写在内联 --sw 上（见 themeRow），
     不参与主题变量，所以无论当前是哪套主题，六个块看起来都是同样六个颜色。 */
  #ctx .cxrow{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:5px 12px 6px;
  }
  #ctx .cxrow>span{color:var(--ink);font-size:11.5px}
  #ctx .sww{display:flex;align-items:center;gap:10px;padding:2px 5px}
  /* 色块 = 该主题里的一颗雨滴：面用 --cv-dot、边用 --cv-dot-brd，
     形状取圆角矩形，好和上下那些文字菜单项区分开。
     圆角 6 是按 18px 块的手感定的 —— 全局的 --r-panel(16) 在这个尺寸上
     就是半个圆，和「圆面」本来的圆形没区别，所以按比例收到 1/3 档。 */
  #ctx .sw{
    display:block;flex:0 0 auto;
    width:18px;height:18px;padding:0;
    border-radius:6px;
    background:var(--sw-face);
    border:1px solid var(--sw-edge);
    /* 上沿一道高光，和雨滴圆是同一套玻璃语言；黑块在深色面板上
       本来就只剩轮廓，这道光让它还有个形体，不至于是个洞。 */
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
    cursor:pointer;
    transition:transform .14s ease,outline-color .16s ease;
  }
  /* 每块固定取自己那套的圆面色 / 圆描边，不跟随当前主题 */
  #ctx .sw[data-theme="blue"]  {--sw-face:var(--t-blue-face);  --sw-edge:var(--t-blue-edge)}
  #ctx .sw[data-theme="green"] {--sw-face:var(--t-green-face); --sw-edge:var(--t-green-edge)}
  #ctx .sw[data-theme="beige"] {--sw-face:var(--t-beige-face); --sw-edge:var(--t-beige-edge)}
  #ctx .sw[data-theme="pink"]  {--sw-face:var(--t-pink-face);  --sw-edge:var(--t-pink-edge)}
  #ctx .sw[data-theme="purple"]{--sw-face:var(--t-purple-face);--sw-edge:var(--t-purple-edge)}
  #ctx .sw[data-theme="dark"]  {--sw-face:var(--t-dark-face);  --sw-edge:var(--t-dark-edge)}
  #ctx .sw:hover{transform:scale(1.1)}
  /* 选中环用 --ink：它跟着当前主题走，六种底上都有足够对比。
     若用块自己的浅色做环，在浅底上等于没有选中态。 */
  #ctx .sw.on{
    transform:scale(1.1);
    outline:2px solid var(--ink);
    outline-offset:2px;
  }
  /* ---- 调参面板：调的是树图底部那层水面的手感 ---- */
  #tune{
    position:fixed;z-index:58;display:none;
    --ctx-r:var(--r-panel);
    --ctx-pad:5px;
    width:272px;padding:var(--ctx-pad);
    background:var(--panel-strong);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
    border:1px solid var(--panel-brd);
    border-radius:var(--ctx-r);
    box-shadow:var(--hl),var(--shadow);
    font-size:11.5px;color:var(--ink);user-select:none;
  }
  #tune.on{display:block}
  #tune .tth{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    /* 上下 6/6 对称：原来 5/7 让标题和 × 都偏上，视觉重心飘 */
    font-weight:500;font-size:12px;padding:6px 12px;
    border-bottom:1px solid var(--panel-brd-soft);margin-bottom:4px;
    cursor:move;                     /* 表头是拖动把手，光标要说明这件事 */
  }
  /* 表头右边的 ×：不保存退出。它压在拖动把手上，所以要单独一套 hover */
  #tune .tth b{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:7px;
    font-weight:400;font-size:15px;line-height:1;color:var(--ghost2);
    cursor:pointer;transition:background .14s,color .14s;
  }
  #tune .tth b:hover{color:var(--ink);background:var(--press)}
  #tune.drag{box-shadow:var(--hl),var(--shadow-lg)}
  /* 确定是主操作，给它主色；恢复默认保持次要 */
  #tune .tr{
    display:grid;grid-template-columns:40px 1fr 46px;
    align-items:center;gap:10px;padding:6px 12px;
  }
  #tune .tr label{color:var(--muted);font-size:11px}
  #tune .tr b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
  #tune input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:3px;
    border-radius:2px;background:var(--track);outline:none;
  }
  #tune input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:var(--accent);cursor:pointer;transition:transform .12s;
  }
  #tune input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
  /* 底部按钮按 macOS 对话框的排法：
     次要/重置靠左、主操作靠右，两者拉到两端，中间留空 —— 不并排挤在一侧。
     控件本身用 HIG 的尺寸：高 26、左右内边距 12、圆角 8。 */
  #tune .tfoot{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    /* 左右下都是 10：加上面板自身的 5px 内边距和 1px 边框，按钮到三条边都是 16px。
       注意代价：上面的表格行左右是 12，所以底栏比它们多伸出 2px，
       「恢复默认」的块左沿会落在 16，比标签文字（18）靠外 2px。
       这是 16 这个数带来的必然结果，二者不可兼得。 */
    padding:8px 10px 10px;margin-top:3px;
    border-top:1px solid var(--panel-brd-soft);
  }
  #tune .tfoot b{
    display:inline-flex;align-items:center;justify-content:center;
    height:26px;padding:0 12px;border-radius:8px;
    font-weight:500;font-size:11px;color:var(--muted);cursor:pointer;
    /* 次要也给它一个形体：常驻一层很淡的主色底。
       全透明的话，左边轻得像个标签、右边是个实心块，两端重量对不上。 */
    background:var(--hover-soft);
    transition:background .14s,color .14s;
  }
  #tune .tfoot b:hover{color:var(--ink);background:var(--hover)}
  /* 左右两个按钮到面板边缘都是 18px —— 对称靠的是**块**的外沿，
     所以这里不能再让它探出去（之前 -6px 是把块推到 12 换文字共线的）。
     代价：文字从 18 退到 24，比上面的标签右缩 6px。
     6 是按钮内边距能做到的最小值（再小字就贴到块边上了），
     这点错位在 272 宽的面板上基本看不出来，而左右各 18 的对称是整块能看出来的。 */
  #tune .tfoot b[data-t="reset"]{padding:0 6px}
  /* 确认是默认按钮：实心主色 + 回车可直接触发，和 macOS 那套一致 */
  #tune .tfoot b[data-t="ok"]{color:var(--on-accent);background:var(--accent)}
  #tune .tfoot b[data-t="ok"]:hover{color:var(--on-accent);background:var(--accent-ink)}
  #modes{
    /* 同心圆角（Apple HIG 的 concentric radius）：
         内圆角 = 外圆角 − 内容到外沿的距离（border + padding）
       这里 16 − 1 − 3 = 12，内外两个圆角的圆心才落在同一点，
       看着是「一个整体挖出来的槽」，而不是「一个大圆角里套了几个小圆角」。
       16 已经接近容器半高，两个圆角会在中间接上，形成胶囊端。 */
    --md-r:var(--r-panel);   /* 跟搜索框、状态胶囊用同一个外圆角 */
    --md-pad:3px;
    position:fixed;right:24px;z-index:30;
    display:none;gap:2px;
    background:var(--panel-soft);backdrop-filter:var(--glass-sm);-webkit-backdrop-filter:var(--glass-sm);
    border:1px solid var(--panel-brd);
    box-shadow:var(--hl);
    padding:var(--md-pad);border-radius:var(--md-r);
    user-select:none;
  }
  #modes{top:20px}
  #modes.on{display:flex}
  #modes b{
    position:relative;z-index:1;
    font-weight:500;font-size:11px;color:var(--muted);cursor:pointer;
    padding:4px 10px;border-radius:calc(var(--md-r) - var(--md-pad) - 1px);
    transition:color .22s;
  }
  #modes b:hover{color:var(--ink)}
  #modes b.on{color:var(--on-accent)}
  /* 选中块的底色改成一块会滑动的「水滴」：
     cubic-bezier 后段过冲，落位时轻轻回弹一下，不是硬切。
     用 left 而不是 transform —— 因为定位必须每次实时算（见 movePill），
     transform 在过渡中会被 getBoundingClientRect 读到，量出来的是动画中间值。 */
  #modes .pill{
    position:absolute;top:3px;bottom:3px;left:0;width:0;z-index:0;
    border-radius:calc(var(--md-r) - var(--md-pad) - 1px);
    background:var(--accent);pointer-events:none;
    transition:left .42s cubic-bezier(.34,1.56,.64,1),
               width .42s cubic-bezier(.34,1.56,.64,1);
  }
  /* 苹果的圆角不是纯圆弧，是连续曲率（squircle）—— 拐角过渡更平缓。
     支持的浏览器自动启用，不支持的退回普通圆角，不影响任何布局和交互。
     搜索框 #addr 不在这条里：它要的是两端全圆（radius 拉到半高），
     而 squircle 会把胶囊端压成略方的超椭圆，反倒不是正圆。 */
  @supports (corner-shape:squircle){
    #modes,#modes b,#modes .pill,#live,#qlist,.tcol{corner-shape:squircle}
    #addr{corner-shape:round}
  }
  #live{
    /* 层级必须显式写：树图容器 #treewrap 铺满全屏且不透明，
       不写这一条，胶囊在树图模式下会被整块盖住（雨图下靠 DOM 顺序反而看得见）。 */
    position:fixed;top:20px;left:24px;z-index:30;
    display:none;align-items:center;gap:8px;
    font-size:11px;color:var(--muted);
    background:var(--panel-soft);backdrop-filter:var(--glass-sm);-webkit-backdrop-filter:var(--glass-sm);
    border:1px solid var(--panel-brd);
    box-shadow:var(--hl);
    padding:7px 14px;border-radius:var(--r-panel);
    font-variant-numeric:tabular-nums;user-select:none;
  }
  /* 胶囊里不再放「＋」：新增数据源只留右键菜单一个入口。
     一个动作两个入口、两个入口行为还不一样（直接弹文件框 / 先问文件和文件夹），
     是这套界面里最容易让人点错的地方。 */
  #live.on{display:flex}
  #live .dot{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 0 rgba(var(--rgb-accent),.55);
    animation:pulse 2s infinite;
  }
  #live.stale .dot{background:var(--danger);animation:none}
  #live.off .dot{background:var(--ghost);animation:none}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(var(--rgb-accent),.5)}
    70%{box-shadow:0 0 0 7px rgba(var(--rgb-accent),0)}
    100%{box-shadow:0 0 0 0 rgba(var(--rgb-accent),0)}
  }
  #live b{font-weight:500;color:var(--ink)}
  #live s{text-decoration:none;color:var(--hair)}
  /* ---- 双树对照视图 ----
     版式取手抄本 / 早期印本（Gutenberg 圣经那一路，Tschichold 归纳成 2:3:4:6）的规矩：
     版心居中、左右留白完全相等，上下留白不等且下边距最宽。
     这里把上下收成黄金比：上留白随窗口在 68~96 之间浮动，下留白恒为它的 1.618 倍。
     下留白更宽，是因为视觉重心天然偏上 —— 底部多留一点，整块才「坐」得住。 */
  #treewrap{
    position:fixed;inset:0;z-index:20;display:none;
    /* 不铺自己的底色：body 那几团光斑要从两列背后透出来，玻璃才有东西可透 */
    /* 上留白跟着窗口高度走：矮窗不压缩内容，高窗也不会空太多 */
    --tw-top:clamp(68px, 7vh, 96px);
    padding:var(--tw-top) 22px calc(var(--tw-top) * var(--phi));gap:14px;
    justify-content:center;          /* 超宽屏时两列居中，两侧留白自动等分 */
    font-size:12px;color:var(--ink);
  }
  #treewrap.on{display:flex}

  /* ---- 窄屏顶栏：一行三块 → 两行 ----
     宽屏是「状态胶囊 — 搜索框 — 模式胶囊」一行排开，靠 #addr 的
     max-width 在两侧各让出一块位。窗口一窄，这条护栏被压到底，
     三块就叠在一起了。
     所以窄屏不硬挤，直接换版式：搜索框独占一行、左右各留 14 横贯整幅，
     两个胶囊下移一行 —— 上「找」下「看」，比三个都缩窄好读。 */
  /* 断点 960 不是拍的：状态胶囊实测约 230 宽，右沿到 254；
     搜索框居中要左沿 > 254，即窗口得大于 928，留点余量取 960。 */
  @media (max-width:960px){
    #addr{
      top:14px;left:14px;right:14px;
      width:auto;max-width:none;min-width:0;
      transform:none;           /* 居中那条 translate 必须撤掉，否则整条右移半个屏幕 */
    }
    #live{top:58px;left:14px}
    #modes{top:58px;right:14px}
    /* 顶栏长高了约 40，树图的上留白要跟着让，否则第一行会被压在胶囊底下 */
    #treewrap{--tw-top:110px}
  }
  /* ---- 更窄：树图两栏改成上下 ----
     并排的门槛是量出来的：一栏里最长的 UUID.jsonl 要 ~300px 才不被截断，
     两栏加上 22×2 的边距和 14 的缝，窗口窄于 720 就只能上下堆。
     上下之后每栏各占一半高度、各自滚动 —— min-height:0 是必须的，
     flex 子项默认 min-height:auto，内容会把两栏一起撑出屏幕。 */
  @media (max-width:720px){
    #treewrap.on{
      flex-direction:column;
      /* 上下堆叠时必须从顶部起排：默认的 center 在 column 方向是「垂直居中」，
         内容不满时两栏会浮在中间，看起来就是「没对齐上方」。 */
      justify-content:flex-start;
    }
    #treewrap{
      --tw-top:96px;
      /* 底部留一个顶部的量（原来是两倍，实测下栏离底太高、白得像没画完） */
      padding-bottom:var(--tw-top);
    }
    .tcol{max-width:none;min-height:0}
  }
  /* 底部水面：横贯整个视口宽度，只占下留白那一条，不压到两列。
     用 fixed 而不是 absolute —— absolute 的 100% 只到 padding box，
     左右各会缺 22px 的边距；fixed 的 100% 是视口宽，两端齐边。
     width 必须显式写：canvas 是替换元素，固有宽度是 attribute 里的 300，
     只给 left/right 它不会被拉伸，水面会缩成左下角一小块。 */
  /* 雨丝从屏幕顶部落到水面，所以画布要盖满整页，不再只是底部那一条。
     z-index 25：压在两边列表之上（雨丝是前景），但低于顶栏(30)和菜单(60)。 */
  #rip{
    position:fixed;inset:0;
    width:100%;height:100%;
    pointer-events:none;z-index:25;
  }
  /* 两栏严格等宽 —— 左右对称是这套版式的前提。
     1.618 只用在留白节奏上，不再拿来分栏：分栏一不对称，「对照」这件事就不成立了。
     max-width 是给超宽屏的护栏：两列各封顶 860，居中，不至于拉成两条长纸带。 */
  .tcol{
    flex:1 1 0;min-width:0;max-width:860px;
    display:flex;flex-direction:column;
    background:var(--surface);
    backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
    border:1px solid var(--panel-brd);border-radius:var(--r-panel);overflow:hidden;
    box-shadow:var(--hl),var(--shadow-col);
  }
  .thead{
    padding:9px 13px;border-bottom:1px solid var(--axis);
    /* 不用 space-between：表头现在有第三项（锁定统计），
       均分会把「N 个库」挤到中间。改成标题吃掉剩余空间，右边几项自然贴右 */
    display:flex;justify-content:flex-start;align-items:baseline;gap:8px;
    background:var(--surface-hi);
    white-space:nowrap;                 /* 表头也不许换行，否则两列高度不一致 */
  }
  .thead b{font-weight:500;font-size:12px;color:var(--ink);margin-right:auto}
  .thead span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tbody{flex:1;overflow:auto;padding:7px 5px 24px}
  .trow{
    display:flex;align-items:center;gap:5px;
    padding:3px 8px;border-radius:5px;cursor:default;
    /* 行高必须写死 px：原来 1.55 是乘各自字号，
       左列等宽 11px、右列 12px，每行差 1.6px，18 行就错位近 30px */
    line-height:18px;min-height:24px;
    white-space:nowrap;
  }
  .trow > span{line-height:18px}
  .trow.hit{cursor:pointer}
  .trow.hit:hover{background:var(--hover-soft)}
  /* 另一列被联动的同一行：常亮，不依赖鼠标是否停在上面 */
  .trow.link{background:var(--hover-strong)}
  .trow.link .tn{color:var(--accent-ink)}
  .trow .tw{
    flex:0 0 11px;width:11px;text-align:center;
    font-size:8px;color:var(--ghost);transition:.15s;
  }
  .trow .tn{overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .trow .tm{margin-left:auto;padding-left:10px;color:var(--ghost);font-size:10.5px;flex:0 0 auto}
  .trow .tg{color:var(--accent)}
  .trow .tq{color:var(--ghost2)}
  /* 右列行尾的两列按钮：眼睛（这一层显不显示）+ ×（断开这个库）。
     宽度写死两格，即使某一行没有 ×，右边缘也不会参差 —— 一列数字、一列眼睛、一列叉，
     竖着扫下去是一条直线。 */
  .trow .tacts{
    flex:0 0 auto;display:flex;align-items:center;gap:2px;margin-left:2px;
  }
  /* 两个槽位宽度写死：没有 × 的行留一个空槽，
     否则「眼睛」会滑到叉的位置上，一列图标变成两种对齐。 */
  .trow .tacts b.tgap{width:18px;height:18px;visibility:hidden}
  .trow .tacts b{
    display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;border-radius:5px;flex:0 0 auto;
    color:var(--ghost2);cursor:pointer;transition:color .14s,background .14s;
  }
  .trow .tacts b:hover{color:var(--ink);background:var(--press)}
  .trow .tacts b svg{width:12px;height:12px;display:block}
  /* 隐藏的层级：整行退到背景里，但还认得出来 —— 它只是不画在雨图里，没有消失 */
  .trow.hid .tn{color:var(--ghost2);text-decoration:line-through}
  .trow.hid .tm{color:var(--hair)}
  .trow.hid .tacts b.teye{color:var(--accent)}
  /* 当前层：树图里选中的那一行，切到雨图就是它 */
  .trow.sel{background:var(--hover-strong)}
  .trow.sel .tn{color:var(--accent-ink)}
  /* 二次确认：× 就地换成「删除 / 取消」，不弹框 */
  .trow .tacts b.tdel.on{color:#c0442f;background:rgba(192,68,47,.10)}
  .trow .tacts b.tcancel{width:auto;padding:0 5px;font-size:10.5px}
  /* 锁：未锁 = 和眼睛一样灰（线框）；已锁 = 红色实心。
     同一个位置只表达一件事，两种状态不许共用符号。 */
  .trow .tacts b.tlk:hover{color:#c0442f;background:rgba(192,68,47,.10)}
  /* 已锁：红色实心。整棵树里**只有这一处**随锁定状态变，
     行本身、名字、数字、展开状态一概不动 —— 和 PS 的图层锁一个意思。 */
  .trow .tacts b.tlk.on{color:#c0442f}
  /* 锁对话框：遮罩 + 一张卡片。密码框只走 type=password，不做明文切换 */
  .lockmask{
    position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
    background:rgba(20,22,26,.28);backdrop-filter:blur(1.5px);
  }
  .lockcard{
    width:268px;background:var(--panel);border:1px solid var(--hair);
    border-radius:12px;padding:16px 16px 12px;box-shadow:0 12px 40px rgba(0,0,0,.18);
  }
  .lockcard .lh{font-size:12.5px;color:var(--ink);margin-bottom:11px;line-height:1.5}
  .lockcard .lh em{font-style:normal;color:var(--muted)}
  .lockcard input{
    width:100%;box-sizing:border-box;height:31px;padding:0 9px;margin-bottom:8px;
    border:1px solid var(--hair);border-radius:7px;background:var(--bg);
    font-size:12.5px;color:var(--ink);outline:none;
  }
  .lockcard input:focus{border-color:var(--accent)}
  .lockcard .lerr{min-height:15px;font-size:11px;color:#c0442f;margin-bottom:4px}
  .lockcard .lf{display:flex;justify-content:flex-end;gap:8px}
  .lockcard .lf b{
    padding:5px 13px;border-radius:7px;font-size:12px;cursor:pointer;
    color:var(--muted);border:1px solid transparent;
  }
  .lockcard .lf b:hover{background:var(--press);color:var(--ink)}
  .lockcard .lf b[data-lk="ok"]{color:#fff;background:var(--accent)}
  .lockcard .lf b[data-lk="ok"]:hover{background:var(--accent-ink);color:#fff}
  .lockcard .lf b.busy{opacity:.55;pointer-events:none}
  /* 忘记密码在左下角：它是「退出这条路」，不该和确认按钮挤在一起 */
  .lockcard .lf b.lforgot{margin-right:auto;color:var(--ghost2);font-size:11px;padding:5px 6px}
  .lockcard .lf b.lforgot:hover{color:#c0442f;background:transparent}
  .lockcard .lbody{font-size:12px;line-height:1.65;color:var(--ink2);margin-bottom:8px}
  .lockcard .lbody b{color:#c0442f}
  .lockcard .lnote{font-size:10.5px;line-height:1.6;color:var(--muted);margin-bottom:11px}
  /* 表头那颗锁：纯统计，只在真有锁定时出现。
     不占一行、不插进树里 —— 树是数据，这里只是数字。 */
  .thead .thlock{
    display:none;align-items:center;gap:4px;cursor:pointer;
    color:#c0442f;padding-left:9px;border-left:1px solid var(--hair);
  }
  .thead .thlock.on{display:inline-flex}
  .thead .thlock:hover{opacity:.7}
  .thead .thlock span{color:inherit}
  .thead .thlock svg{width:10px;height:10px;display:block;flex:0 0 auto}
  /* 锁面板：列出所有被锁的项。max-height 防止锁了几十项把屏幕撑爆 */
  .lockcard .lplist{max-height:230px;overflow:auto;margin-bottom:10px}
  .lockcard .lprow{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:6px 2px;border-bottom:1px solid var(--hair);font-size:11.5px;color:var(--ink2);
  }
  .lockcard .lprow:last-child{border-bottom:0}
  .lockcard .lprow i{flex:0 0 auto;display:flex;color:#c0442f}
  .lockcard .lprow i svg{width:11px;height:11px;display:block;margin-top:1px}
  .lockcard .lprow span{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lockcard .lprow b{
    flex:0 0 auto;padding:3px 9px;border-radius:6px;cursor:pointer;
    font-size:11px;color:var(--muted);border:1px solid var(--hair);
  }
  .lockcard .lprow b:hover{color:#c0442f;border-color:rgba(192,68,47,.4)}
  .tmono{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:11px}
  .tkind{color:var(--hair);font-size:10px}
  .hint{
    position:fixed;left:24px;bottom:20px;
    font-size:11px;color:var(--muted);letter-spacing:.02em;
  }
  #ver{
    position:fixed;right:24px;bottom:18px;font-size:11px;
    color:var(--ghost2);letter-spacing:.05em;user-select:none;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="addr">
  <div id="crumb"></div>
  <input id="q" type="text" placeholder="搜索会话或文件…" autocomplete="off" spellcheck="false">
  <div id="qlist"></div>
  <span class="ico">
    <svg class="mag" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <circle cx="6.8" cy="6.8" r="4.6"/>
      <path d="M10.4 10.4L14 14" stroke-linecap="round"/>
    </svg>
    <span id="qx" title="全部删除">×</span>
  </span>
</div>
<div id="tip"></div>
<div id="ctx"></div>
<div id="ctx2"></div>
<div id="tune"></div>
<div id="modes"><i class="pill"></i><b data-m="tree">树图</b><b data-m="rain" class="on">雨图</b></div>
<div id="treewrap">
  <canvas id="rip"></canvas>
  <div class="tcol">
    <div class="thead"><b>磁盘上真实的样子</b><span id="thdisk">…</span></div>    <div class="tbody" id="tbdisk"></div>
  </div>
  <div class="tcol">
    <div class="thead"><b>雨图显示的样子</b><span id="thmap">…</span><span id="thlock" class="thlock"></span></div>
    <div class="tbody" id="tbmap"></div>
  </div>
</div>
<div id="live"><span class="dot"></span><span id="lvtext">连接中…</span></div>
<div class="hint" id="hint">点开看圆周 · 按住拖动 · 右键更多</div>
<div id="ver">雨滴图 v2.7.0</div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";

  var TAU = Math.PI * 2;
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var tip = document.getElementById('tip');
  var tipHTML = '';            /* 上一次写进提示框的内容，一样就不再重建 DOM */
  var crumb = document.getElementById('crumb');


  var W = 0, H = 0, DPR = 1, CX = 0, CY = 0;

  var P = {
    gap: 14,          /* 珠子之间的最小间隙 */
    rMin: 13,         /* 珠子可读下限，低于这个就必须合并 */
    fill: 0.64,       /* 珠子最多吃掉圆周的多少（剩下的留给父点本体可读） */
    ring: 0.34,       /* 父点半径 = 视口短边 × ring */
    lane: 26,         /* 展开层的额外外距 */
    slack: 0.34       /* 首尾之间留的弧口，读作“起点/终点” */
  };

  var root = (location.hash.indexOf('dense') >= 0 && window.RAINDROP_TREE_DENSE)
    ? window.RAINDROP_TREE_DENSE : window.RAINDROP_TREE;
  var path = [];            /* 焦点链，path[0] 是根 */
  var expanded = true;   /* 进来就铺开子体，不再先看一个孤零零的大圆 */
  var openGroups = {};      /* 哪些合并珠子被展开了（可逆） */
  var beans = [];           /* 当前渲染项 */
  var ripples = [];
  var hoveredKey = null;
  /* 拖动：按住圆挪动超过阈值＝拖动（圆跟着手走），没超过＝点击（下钻）。
     两者靠位移区分，不需要长按、也不需要右键。
     松手即回弹到自动堆积位 —— 拖动只是临时挪开看看被挡住的圆，不改变布局。 */
  var drag = null;          /* { bean, key, sx, sy, ox, oy, moved, hit, snap, homeX, homeY, homeR } */
  var DRAG_MIN = 4;         /* 判定阈值(px)：小于它算点击，大于算拖动 */
  /* 拖动中要守住「任何两个圆都不重叠」这条全局规则。
     做法是每帧对所有圆做两遍推离（O(n²/2)，n=300 时约 1.8ms），
     绝不在指针事件里调 settle() —— 那一次是 300 万次计算、每帧 60ms，会直接卡死。 */
  var SHOVE_GAP = 2;        /* 最小间隙，和 settle 保持一致 */
  /* packItems 算出的椭圆参数存一份，拖动时钳制边界要用 */
  var packCX = 0, packCY = 0, packRX = 1, packRY = 1;
  /* 边界松紧倍数：1 = 严格不越界，>1 = 允许圆溢出（屏幕窄、圆多时才会 >1）。
     布局、拖动钳制、松手还原三处必须用同一个值，否则来回切换时松紧不一，看着像在跳。 */
  var packSoft = 1;
  /* 上一轮布局的指纹：一模一样就别重排（见 buildItems 结尾） */
  var lastLayoutSig = '';
  /* 数据轮询的时间戳。只有它刚刷过（400ms 内）的 sync，
     才允许给「半径变了」的圆冒涟漪 —— 否则改窗口大小、切层级
     也会让半径整体缩放，那是全屏几十颗一起冒圈，纯噪音。 */
  var pulseAt = 0;
  var lastT = 0;
  var needsBuild = true;
  var emptySince = 0;   /* 这一层开始为空的时刻（ms），给空态提示留 800ms 宽限 */

  /* ===== 性能角标（地址带 ?perf 才出现，平时完全不存在）=====
     卡顿这种事不能靠猜：圆数、布局耗时、同步耗时、帧率，四个数字一摆，
     就知道是「算得慢」还是「一直在算」还是「画得慢」。
     平时零成本：PERF 为 false 时所有记账调用都被这一行 if 挡掉。

     帧耗时报三个数，不是只报平均：
     · p50 = 一半的帧比这快 —— 这是「平时有多顺」
     · p99 = 最慢的那 1% 从这里开始 —— 这是「会不会突然顿一下」
     · max = 单次最长 —— 留着对时间点用的
     只看平均值会把「偶尔一次 300ms 长帧」抹平：99 帧 16ms 配 1 帧 300ms，
     平均才 18.8ms，看着很健康，可那一下用户是能感觉到的。 */
  var PERF = /[?&]perf/.test(location.search + location.hash);
  var pfT = (window.performance && performance.now) ? function(){ return performance.now(); }
                                                      : function(){ return Date.now(); };
  var PF_CAP = 240;          /* 帧耗时保留最近 240 帧（约 4 秒） */
  var pfStat = { pack: 0, packN: 0, sync: 0, syncN: 0, n: 0, fps: 0, fMax: 0, box: null,
                 frames: 0, acc: 0, t0: 0, t1: 0,
                 ft: new Float32Array(PF_CAP), fi: 0, fn: 0,
                 p50: 0, p99: 0, max: 0 };
  /* 把环形缓冲拿出来排序取分位。240 个数排序约 0.02ms，每 600ms 一次，
     不进渲染路径，不影响被测的那个东西。 */
  function pfPct(){
    var n = pfStat.fn, i, arr = [];
    if (!n) return;
    for (i = 0; i < n; i++) arr.push(pfStat.ft[i]);
    arr.sort(function(a, b){ return a - b; });
    pfStat.p50 = arr[Math.floor((n - 1) * 0.50)];
    pfStat.p99 = arr[Math.floor((n - 1) * 0.99)];
    pfStat.max = arr[n - 1];
  }
  function pfShow(){
    if (!PERF) return;
    if (!pfStat.box){
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;right:8px;bottom:38px;z-index:9999;'
        + 'font:11px/1.5 ui-monospace,Consolas,monospace;color:#fff;'
        + 'background:rgba(0,0,0,.62);padding:5px 8px;border-radius:7px;'
        + 'pointer-events:none;white-space:pre;letter-spacing:.2px';
      document.body.appendChild(d);
      pfStat.box = d;
    }
    pfStat.box.textContent = '圆 ' + pfStat.n
      + '  |  排 ' + pfStat.pack.toFixed(1) + 'ms ×' + pfStat.packN
      + '  |  同步 ' + pfStat.sync.toFixed(1) + 'ms ×' + pfStat.syncN
      + '  |  轮询 ' + (pfStat.live || 0).toFixed(1) + 'ms ×' + (pfStat.liveN || 0)
      + '\n' + (pfStat.fps ? pfStat.fps.toFixed(0) : '—') + ' fps'
      + '   帧 p50 ' + pfStat.p50.toFixed(1)
      + ' / p99 ' + pfStat.p99.toFixed(1)
      + ' / max ' + pfStat.max.toFixed(1) + ' ms';
  }
  var SNAP = /[#&?]snap/.test(location.search + location.hash);

  /* ---- 实时模式：数据从本地 live_server.py 来，页面只认 /api/tree ---- */
  /* 连不连服务：先看 URL 有没有明确要求，没有就自己问一句。
     以前只看参数，所以从收藏夹打开、或者直接开 ring.html 时，永远停在
     「连接中…」，画的还是 data.js 里写死的演示数据 —— 用户会以为那是自己的会话。
     改成探测：本地回环几十毫秒，同步发一次就够，不用把整段初始化改成异步。 */
  var LIVE = /[?&]src=live/.test(location.search + location.hash);
  if (!LIVE && location.protocol !== 'file:'){
    try {
      var _px = new XMLHttpRequest();
      _px.open('GET', '/api/ping', false);
      _px.send();
      if (_px.status === 200){
        var _pi = JSON.parse(_px.responseText);
        /* 认 app 字段，别把同端口上别的程序当成自己 */
        if (_pi && _pi.app === 'raindrop-chart') LIVE = true;
      }
    } catch (e) { /* 服务没起就是没起，保持原来的离线渲染 */ }
  }
  /* 数据源：workbuddy（本机会话记录）/ csv（通用层级）……
     名字从 URL 读，加新数据源只改后端注册表，这里一行都不用动。 */
  /* 取到 & 或 # 为止，再解码 —— 用 [\w.-] 会把百分号编码截断 */
  /* 空字符串 = 顶级目录（Raindrop Chart 下挂几个库）。
     以前默认就是 workbuddy，结果装了 WorkBuddy 的人永远看不到示例数据。 */
  var SOURCE = (function(){
    var m = /[?&]source=([^&#]+)/.exec(location.search + location.hash);
    var v = m ? m[1] : '';
    try { v = decodeURIComponent(v); } catch (e) {}
    return v;

  /* 名字像不像：公共前缀占比 + 包含关系。中文短标题靠这个够用 */
  function nameSim(a, b){

  var lastBuildSig = '', lastBuildOut = null;

    var vis = [], vi;
    for (vi = 0; vi < kids.length; vi++) if (!isHidden(kids[vi].__addr)) vis.push(kids[vi]);

    if (!kids.length) return [];

    var total = 0, i;
    for (i = 0; i < kids.length; i++) total += weigh(kids[i]);
    if (!total) total = 1;

    /* ===== 半径映射：对数配平 =====
       旧的写法是 r = S * sqrt(w / Σw)，也就是**按当前视图里的占比**分半径。
       三个毛病：
         ① 极端值主导：实测工作区层 w 极差 368 倍 ⇒ 直径 10 ~ 189px，
            最小的圆缩成一个点，最大的吃掉半个屏。
         ② 视图依赖：同一批数据，筛选掉几个之后，剩下圆的半径会全部变大

         ③ 跨层不可比：Σw 里混着不同量纲的值。
